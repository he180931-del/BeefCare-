name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - dev
      - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend unit tests
        env:
          TZ: UTC
        run: >-
          ./mvnw --batch-mode '-Pdev,!webapp'
          -Dspotless.skip=true
          -Dmodernizer.skip=true
          test

      - name: Run backend integration smoke tests
        env:
          TZ: UTC
        run: >-
          ./mvnw --batch-mode '-Pdev,!webapp'
          -Dspotless.skip=true
          -Dmodernizer.skip=true
          -Dit.test=HibernateTimeZoneIT,ReportsAndAuditIT,FarmInvitationPostgresIT,AppUserCreatedAtMigrationPostgresIT
          failsafe:integration-test failsafe:verify

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          VITE_BEEFCARE_DATA_SOURCE: local
          VITE_BEEFCARE_AUTH_MODE: mock

      - name: Build
        run: npm run build
        env:
          VITE_BEEFCARE_DATA_SOURCE: backend
          VITE_BEEFCARE_API_URL: https://example.invalid

  backend-image:
    name: Backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">BeefCare</title>
</head>
<body style="margin:0;background:#f3f6f1;font-family:Arial,Helvetica,sans-serif;color:#26342a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 12px;background:#f3f6f1;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e3e9e1;border-radius:14px;overflow:hidden;">
        <tr><td style="padding:24px 32px;background:#24583b;color:#ffffff;font-size:22px;font-weight:700;">BeefCare</td></tr>
        <tr><td style="padding:32px;">
          <h1 style="margin:0 0 18px;font-size:24px;line-height:1.3;color:#203b2b;" th:text="${title}">Thông báo BeefCare</h1>
          <p style="margin:0 0 14px;font-size:16px;line-height:1.6;" th:text="${greeting}">Xin chào,</p>
          <p style="margin:0 0 22px;font-size:15px;line-height:1.7;white-space:pre-line;" th:text="${intro}">Bạn có một yêu cầu cần xác nhận.</p>
          <p style="margin:0 0 24px;">
            <a th:href="${actionUrl}" th:text="${buttonLabel}" style="display:inline-block;padding:13px 22px;border-radius:8px;background:#28734b;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;">Tiếp tục</a>
          </p>
          <p style="margin:0 0 12px;font-size:13px;line-height:1.6;color:#58665b;" th:text="${expiryText}">Liên kết có thời hạn.</p>
          <p style="margin:0;font-size:13px;line-height:1.6;color:#58665b;">Nếu nút không hoạt động, hãy sao chép liên kết bên dưới vào trình duyệt:</p>
          <p style="overflow-wrap:anywhere;font-size:12px;line-height:1.5;color:#28734b;" th:text="${actionUrl}">https://example.test</p>
        </td></tr>
        <tr><td style="padding:18px 32px;border-top:1px solid #e9eee7;font-size:12px;line-height:1.6;color:#758077;">Email tự động từ BeefCare. Vui lòng không trả lời email này.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>

# Offline integration tests: H2 in PostgreSQL compatibility mode (no Docker / Testcontainers needed).
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:h2:mem:beefcare;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      auto-commit: false
      poolName: Hikari
      maximum-pool-size: 4
  docker:
    compose:
      enabled: false
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.jdbc.time_zone: UTC
      hibernate.timezone.default_storage: NORMALIZE
  liquibase:
    contexts: test

beefcare:
  attachments:
    local-root: target/test-attachments
  email:
    poll-delay-ms: 60000
    provider: mock
    link-signing-key: beefcare-test-only-fixed-link-key-000000000000000000000000000000000000000000
    frontend-base-url: http://127.0.0.1:8080
    backend-base-url: http://127.0.0.1:8080

name: beefcare-base
services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'
    environment:
      MP_MAX_MESSAGES: 1000
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: beefcare
      POSTGRES_USER: beefcare
      POSTGRES_PASSWORD: ${BEEFCARE_DB_PASSWORD:?Copy .env.example to .env and set BEEFCARE_DB_PASSWORD}
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - beefcare-base-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beefcare -d beefcare']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  beefcare-base-data:


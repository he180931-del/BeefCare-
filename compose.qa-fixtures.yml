services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: beefcare_qa
      POSTGRES_PASSWORD: ${BEEFCARE_DB_PASSWORD:?Set BEEFCARE_DB_PASSWORD for the disposable QA database}
      POSTGRES_DB: beefcare_qa
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - qa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beefcare_qa -d beefcare_qa"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  qa_data:

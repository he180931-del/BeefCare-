\n    }\n\n    public AppUser passwordHash(String passwordHash) {\n        this.setPasswordHash(passwordHash);\n        return this;\n    }\n\n    public void setPasswordHash(String passwordHash) {\n        this.passwordHash = passwordHash;\n    }\n\n    public boolean isPasswordLoginEnabled() {\n        return passwordLoginEnabled;\n    }\n\n    public void setPasswordLoginEnabled(boolean passwordLoginEnabled) {\n        this.passwordLoginEnabled = passwordLoginEnabled;\n    }\n\n    public boolean isOwnerRegistrationCompleted() {\n        return ownerRegistrationCompleted;\n    }\n\n    public void setOwnerRegistrationCompleted(boolean ownerRegistrationCompleted) {\n        this.ownerRegistrationCompleted = ownerRegistrationCompleted;\n    }\n\n    public Instant getOwnerRegistrationCompletedAt() {\n        return ownerRegistrationCompletedAt;\n    }\n\n    public void setOwnerRegistrationCompletedAt(Instant ownerRegistrationCompletedAt) {\n        this.ownerRegistrationCompletedAt = ownerRegistrationCompletedAt;\n    }\n\n    public boolean isTermsAccepted() {\n        return termsAccepted;\n    }\n\n    public void setTermsAccepted(boolean termsAccepted) {\n        this.termsAccepted = termsAccepted;\n    }\n\n    public Instant getTermsAcceptedAt() {\n        return termsAcceptedAt;\n    }\n\n    public void setTermsAcceptedAt(Instant termsAcceptedAt) {\n        this.termsAcceptedAt = termsAcceptedAt;\n    }\n\n    public String getPasswordMethodStatus() {\n        return passwordMethodStatus;\n    }\n\n    public void setPasswordMethodStatus(String passwordMethodStatus) {\n        this.passwordMethodStatus = passwordMethodStatus;\n    }\n\n    public Instant getPasswordLinkedAt() {\n        return passwordLinkedAt;\n    }\n\n    public void setPasswordLinkedAt(Instant passwordLinkedAt) {\n        this.passwordLinkedAt = passwordLinkedAt;\n    }\n\n    public Instant getPasswordLastUsedAt() {\n        return passwordLastUsedAt;\n    }\n\n    public void setPasswordLastUsedAt(Instant passwordLastUsedAt) {\n        this.passwordLastUsedAt = passwordLastUsedAt;\n    }\n\n    public Instant getGoogleLinkedAt() {\n        return googleLinkedAt;\n    }\n\n    public void setGoogleLinkedAt(Instant googleLinkedAt) {\n        this.googleLinkedAt = googleLinkedAt;\n    }\n\n    public Instant getGoogleLastUsedAt() {\n        return googleLastUsedAt;\n    }\n\n    public void setGoogleLastUsedAt(Instant googleLastUsedAt) {\n        this.googleLastUsedAt = googleLastUsedAt;\n    }\n\n    public Instant getCreatedAt() {\n        return createdAt;\n    }\n\n    public void setCreatedAt(Instant createdAt) {\n        this.createdAt = createdAt;\n    }\n\n    /** Every creation path (registration, first Google sign-in, provisioning, seed, tests) gets a created time. */\n    @PrePersist\n    void defaultCreatedAt() {\n        if (createdAt == null) createdAt = Instant.now();\n    }\n\n    public Long getVersion() {\n        return version;\n    }\n\n    public void setVersion(Long version) {\n        this.version = version;\n    }\n\n    public PlatformStaffAccess getPlatformStaffAccess() {\n        return this.platformStaffAccess;\n    }\n\n    public void setPlatformStaffAccess(PlatformStaffAccess platformStaffAccess) {\n        if (this.platformStaffAccess != null) {\n            this.platformStaffAccess.setUser(null);\n        }\n        if (platformStaffAccess != null) {\n            platformStaffAccess.setUser(this);\n        }\n        this.platformStaffAccess = platformStaffAccess;\n    }\n\n    public AppUser platformStaffAccess(PlatformStaffAccess platformStaffAccess) {\n        this.setPlatformStaffAccess(platformStaffAccess);\n        return this;\n    }\n\n    // jhipster-needle-entity-add-getters-setters - JHipster will add getters and setters here\n\n    @Override\n    public boolean equals(Object o) {\n        if (this == o) {\n            return true;\n        }\n        if (!(o instanceof AppUser)) {\n            return false;\n        }\n        return getId() != null && getId().equals(((AppUser) o).getId());\n    }\n\n    @Override\n    public int hashCode() {\n        // see https://vladmihalcea.com/how-to-implement-equals-and-hashcode-using-the-jpa-entity-identifier/\n        return getClass().hashCode();\n    }\n\n    // prettier-ignore\n    @Override\n    public String toString() {\n        return \"AppUser{\" +\n            \"id=\" + getId() +\n            \", email='\" + getEmail() + \"'\" +\n            \", fullName='\" + getFullName() + \"'\" +\n            \", phone='\" + getPhone() + \"'\" +\n            \", accountStatus='\" + getAccountStatus() + \"'\" +\n            \", googleSubjectPresent=\" + (getGoogleSubject() != null) +\n            \", passwordHashPresent=\" + (getPasswordHash() != null) +\n            \"}\";\n    }\n}"},"login-vm":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/vm/LoginVM.java","start":1,"end":53,"highlightStart":12,"highlightEnd":52,"scope":"Cả DTO","symbol":"LoginVM","code":"package vn.edu.fpt.beefcare.web.rest.vm;\n\nimport jakarta.validation.constraints.NotNull;\nimport jakarta.validation.constraints.Size;\n\n/**\n * View Model object for storing a user's credentials.\n */\npublic class LoginVM {\n\n    @NotNull\n    @Size(min = 1, max = 254)\n    private String username;\n\n    @NotNull\n    @Size(min = 4, max = 128)\n    private String password;\n\n    private boolean rememberMe;\n\n    public String getUsername() {\n        return username;\n    }\n\n    public void setUsername(String username) {\n        this.username = username;\n    }\n\n    public String getPassword() {\n        return password;\n    }\n\n    public void setPassword(String password) {\n        this.password = password;\n    }\n\n    public boolean isRememberMe() {\n        return rememberMe;\n    }\n\n    public void setRememberMe(boolean rememberMe) {\n        this.rememberMe = rememberMe;\n    }\n\n    // prettier-ignore\n    @Override\n    public String toString() {\n        return \"LoginVM{\" +\n            \"username='\" + username + '\\'' +\n            \", rememberMe=\" + rememberMe +\n            '}';\n    }\n}"},"password-change-dto":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/dto/PasswordChangeDTO.java","start":1,"end":46,"highlightStart":10,"highlightEnd":45,"scope":"Cả DTO","symbol":"PasswordChangeDTO","code":"package vn.edu.fpt.beefcare.service.dto;\n\nimport java.io.Serial;\nimport java.io.Serializable;\n\n/**\n * A DTO representing a password change required data - current and new password.\n */\npublic class PasswordChangeDTO implements Serializable {\n\n    @Serial\n    private static final long serialVersionUID = 1L;\n\n    private String currentPassword;\n    private String newPassword;\n    private String confirmPassword;\n\n    public PasswordChangeDTO() {\n        // Empty constructor needed for Jackson.\n    }\n\n    public PasswordChangeDTO(String currentPassword, String newPassword) {\n        this.currentPassword = currentPassword;\n        this.newPassword = newPassword;\n        this.confirmPassword = newPassword;\n    }\n\n    public String getCurrentPassword() {\n        return currentPassword;\n    }\n\n    public void setCurrentPassword(String currentPassword) {\n        this.currentPassword = currentPassword;\n    }\n\n    public String getNewPassword() {\n        return newPassword;\n    }\n\n    public void setNewPassword(String newPassword) {\n        this.newPassword = newPassword;\n    }\n\n    public String getConfirmPassword() { return confirmPassword; }\n    public void setConfirmPassword(String confirmPassword) { this.confirmPassword = confirmPassword; }\n}"},"key-password-vm":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/vm/KeyAndPasswordVM.java","start":1,"end":37,"highlightStart":10,"highlightEnd":36,"scope":"Cả DTO","symbol":"KeyAndPasswordVM","code":"package vn.edu.fpt.beefcare.web.rest.vm;\n\n/**\n * View Model object for storing the user's key and password.\n */\npublic class KeyAndPasswordVM {\n\n    private String key;\n\n    private String newPassword;\n\n    private String confirmPassword;\n\n    public String getKey() {\n        return key;\n    }\n\n    public void setKey(String key) {\n        this.key = key;\n    }\n\n    public String getNewPassword() {\n        return newPassword;\n    }\n\n    public void setNewPassword(String newPassword) {\n        this.newPassword = newPassword;\n    }\n\n    public String getConfirmPassword() {\n        return confirmPassword;\n    }\n\n    public void setConfirmPassword(String confirmPassword) {\n        this.confirmPassword = confirmPassword;\n    }\n}"},"google-failure-handler":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/security/GoogleOidcFailureHandler.java","start":1,"end":27,"highlightStart":14,"highlightEnd":27,"scope":"Cả class","symbol":"GoogleOidcFailureHandler","code":"package vn.edu.fpt.beefcare.security;\n\nimport jakarta.servlet.ServletException;\nimport jakarta.servlet.http.HttpServletRequest;\nimport jakarta.servlet.http.HttpServletResponse;\nimport java.io.IOException;\nimport org.springframework.beans.factory.annotation.Value;\nimport org.springframework.security.core.AuthenticationException;\nimport org.springframework.security.web.authentication.AuthenticationFailureHandler;\nimport org.springframework.stereotype.Component;\n\n/** Gives cancelled or rejected Google consent the same public frontend outcome as a rejected OIDC identity. */\n@Component\npublic class GoogleOidcFailureHandler implements AuthenticationFailureHandler {\n\n    private final String frontendBaseUrl;\n\n    public GoogleOidcFailureHandler(@Value(\"${beefcare.email.frontend-base-url}\") String frontendBaseUrl) {\n        this.frontendBaseUrl = frontendBaseUrl.replaceAll(\"/+$\", \"\");\n    }\n\n    @Override\n    public void onAuthenticationFailure(HttpServletRequest request, HttpServletResponse response, AuthenticationException exception)\n        throws IOException, ServletException {\n        response.sendRedirect(frontendBaseUrl + \"/sign-in?error=google-sign-in\");\n    }\n}"},"mail-send-email":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/MailService.java","start":135,"end":192,"highlightStart":135,"highlightEnd":191,"scope":"Nhóm hàm gửi sau commit","symbol":"MailService.sendEmail()","code":"    public void sendEmail(String to, String subject, String content, boolean isMultipart, boolean isHtml) {\n        enqueue(to, subject, content, isHtml);\n    }\n\n    public void sendEmailFromTemplate(User user, String templateName, String titleKey) {\n        renderAndQueue(user, templateName, titleKey);\n    }\n\n    public void sendActivationEmail(User user) {\n        LOG.debug(\"Queueing activation email for recipient {}\", user.getEmail());\n        renderAndQueue(user, \"mail/activationEmail\", \"email.activation.title\");\n    }\n\n    public void sendCreationEmail(User user) {\n        LOG.debug(\"Queueing creation email for recipient {}\", user.getEmail());\n        renderAndQueue(user, \"mail/creationEmail\", \"email.activation.title\");\n    }\n\n    public void sendPasswordResetMail(User user) {\n        LOG.debug(\"Queueing password reset email for recipient {}\", user.getEmail());\n        renderAndQueue(user, \"mail/passwordResetEmail\", \"email.reset.title\");\n    }\n\n    private void renderAndQueue(User user, String templateName, String titleKey) {\n        if (user.getEmail() == null) {\n            LOG.debug(\"Email does not exist for user {}\", user.getLogin());\n            return;\n        }\n        Locale locale = Locale.forLanguageTag(user.getLangKey());\n        Context context = new Context(locale);\n        context.setVariable(USER, user);\n        context.setVariable(BASE_URL, properties.getMail().getBaseUrl());\n        String content = templateEngine.process(templateName, context);\n        String subject = messageSource.getMessage(titleKey, null, locale);\n        enqueue(user.getEmail(), subject, content, true);\n    }\n\n    private void enqueue(String to, String subject, String content, boolean html) {\n        OutboundEmail message = new OutboundEmail(to, subject, content, html, java.time.Instant.now());\n        if (TransactionSynchronizationManager.isActualTransactionActive()) events.publishEvent(message);\n        else deliver(message);\n    }\n\n    @Async\n    @TransactionalEventListener(phase = TransactionPhase.AFTER_COMMIT)\n    public void sendAfterCommit(OutboundEmail message) {\n        deliver(message);\n    }\n\n    private void deliver(OutboundEmail message) {\n        try {\n            delivery.deliver(message);\n            LOG.debug(\"Sent email to recipient {} with subject {}\", message.to(), message.subject());\n        } catch (RuntimeException failure) {\n            LOG.warn(\"Email delivery failed for recipient {} with subject {} ({})\", message.to(), message.subject(), failure.getClass().getSimpleName());\n        }\n    }\n}"},"smtp-email-delivery":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/email/SmtpEmailDelivery.java","start":1,"end":58,"highlightStart":16,"highlightEnd":57,"scope":"Cả adapter","symbol":"SmtpEmailDelivery","code":"package vn.edu.fpt.beefcare.service.email;\n\nimport jakarta.mail.MessagingException;\nimport jakarta.mail.internet.MimeMessage;\nimport java.nio.charset.StandardCharsets;\nimport org.slf4j.Logger;\nimport org.slf4j.LoggerFactory;\nimport org.springframework.boot.autoconfigure.condition.ConditionalOnProperty;\nimport org.springframework.context.annotation.Profile;\nimport org.springframework.mail.MailException;\nimport org.springframework.mail.javamail.JavaMailSender;\nimport org.springframework.mail.javamail.MimeMessageHelper;\nimport org.springframework.stereotype.Component;\nimport tech.jhipster.config.JHipsterProperties;\n\n/** Configured SMTP adapter. Credentials come only from Spring mail environment configuration. */\n@Component\n@Profile(\"!test & !testh2\")\n@ConditionalOnProperty(name = \"beefcare.email.provider\", havingValue = \"smtp\")\npublic class SmtpEmailDelivery implements EmailDelivery {\n\n    private static final Logger LOG = LoggerFactory.getLogger(SmtpEmailDelivery.class);\n    private final JavaMailSender sender;\n    private final JHipsterProperties properties;\n\n    public SmtpEmailDelivery(JavaMailSender sender, JHipsterProperties properties) {\n        this.sender = sender;\n        this.properties = properties;\n    }\n\n    @Override\n    public void deliver(OutboundEmail outbound) {\n        RuntimeException last = null;\n        for (int attempt = 1; attempt \u003c= 3; attempt++) {\n            try {\n                MimeMessage message = sender.createMimeMessage();\n                MimeMessageHelper helper = new MimeMessageHelper(message, outbound.html(), StandardCharsets.UTF_8.name());\n                helper.setTo(outbound.to());\n                helper.setFrom(properties.getMail().getFrom());\n                helper.setSubject(outbound.subject());\n                if (outbound.html()) helper.setText(outbound.plainText() == null ? outbound.content().replaceAll(\"\u003c[^>]*>\", \" \") : outbound.plainText(), outbound.content());\n                else helper.setText(outbound.content(), false);\n                sender.send(message);\n                return;\n            } catch (MailException | MessagingException failure) {\n                last = new IllegalStateException(\"SMTP delivery failed\", failure);\n                if (attempt \u003c 3) {\n                    try { Thread.sleep(attempt * 250L); } catch (InterruptedException interrupted) {\n                        Thread.currentThread().interrupt();\n                        break;\n                    }\n                }\n            }\n        }\n        LOG.warn(\"Email delivery failed after retries for recipient {} and subject {}\", outbound.to(), outbound.subject());\n        if (last != null) throw last;\n    }\n}"},"mock-email-delivery":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/email/MockEmailDelivery.java","start":1,"end":40,"highlightStart":12,"highlightEnd":39,"scope":"Cả adapter","symbol":"MockEmailDelivery","code":"package vn.edu.fpt.beefcare.service.email;\n\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.UUID;\nimport java.util.concurrent.ConcurrentLinkedDeque;\nimport java.util.concurrent.atomic.AtomicInteger;\nimport org.springframework.boot.autoconfigure.condition.ConditionalOnProperty;\nimport org.springframework.context.annotation.Profile;\nimport org.springframework.stereotype.Component;\n\n/** Development/test mail sink. Messages, including verification links, stay in memory and are not logged or persisted. */\n@Component\n@Profile({ \"dev\", \"local\", \"test\", \"testh2\" })\n@ConditionalOnProperty(name = \"beefcare.email.provider\", havingValue = \"mock\", matchIfMissing = true)\npublic class MockEmailDelivery implements EmailDelivery {\n\n    private static final int MAX_MESSAGES = 1000;\n    private final ConcurrentLinkedDeque\u003cMailboxMessage> messages = new ConcurrentLinkedDeque\u003c>();\n    private final AtomicInteger forcedFailures = new AtomicInteger();\n\n    @Override\n    public void deliver(OutboundEmail message) {\n        if (forcedFailures.getAndUpdate(current -> Math.max(0, current - 1)) > 0) throw new IllegalStateException(\"Simulated local mail provider failure\");\n        messages.addFirst(new MailboxMessage(UUID.randomUUID().toString(), message.to(), message.subject(), message.content(), message.html(), message.plainText(), message.createdAt()));\n        while (messages.size() > MAX_MESSAGES) messages.pollLast();\n    }\n\n    public List\u003cMailboxMessage> findMessagesFor(String email) {\n        return messages.stream().filter(message -> message.to().equalsIgnoreCase(email)).toList();\n    }\n\n    /** Test hook for exercising durable retry behavior. It is not exposed over HTTP. */\n    public void failNextDeliveries(int count) {\n        if (count \u003c 0) throw new IllegalArgumentException(\"Failure count cannot be negative\");\n        forcedFailures.set(count);\n    }\n\n    public record MailboxMessage(String id, String to, String subject, String content, boolean html, String plainText, java.time.Instant createdAt) {}\n}"},"farm-action":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/FarmAction.java","start":1,"end":94,"highlightStart":11,"highlightEnd":94,"scope":"Cả enum quyền","symbol":"FarmAction","code":"package vn.edu.fpt.beefcare.service;\n\nimport java.util.EnumSet;\nimport java.util.Set;\nimport vn.edu.fpt.beefcare.domain.enumeration.FarmRole;\n\n/**\n * The role matrix of section 1 of the FE-04 / FE-06 / FE-13 specification. A write action is also blocked\n * while the farm service is not ACTIVE (GBR-09, MSG-COM-12).\n */\npublic enum FarmAction {\n    /** Owner access to the farm's own information remains available during service suspension. */\n    VIEW_FARM_INFORMATION(false, FarmRole.OWNER),\n    /** Owner may maintain the farm's own information regardless of service status. */\n    MANAGE_FARM_INFORMATION(true, FarmRole.OWNER),\n    /**\n     * UC-FE02-02 step 4: enter the farm chosen on Select Farm. Every member may enter an ACTIVE farm; while the farm is\n     * not ACTIVE only the Owner may (GBR-14) and a Manager or Technician gets MSG-FE02-04 (AF3).\n     */\n    SELECT_FARM(false, FarmRole.OWNER, FarmRole.MANAGER, FarmRole.TECHNICIAN),\n    /**\n     * SCR-13 member list (UC-FE03-05, Table III-2): the Owner in full, a Manager read-only; never a Technician. The Owner\n     * still reads it while the farm is not ACTIVE, so members can be deactivated (GBR-14, D29); a Manager needs ACTIVE.\n     */\n    VIEW_MEMBERS(false, FarmRole.OWNER, FarmRole.MANAGER),\n    /** Catalogue lookups used by farm workflows require an ACTIVE farm and are readable by every farm role. */\n    VIEW_CATALOGUES(false, FarmRole.OWNER, FarmRole.MANAGER, FarmRole.TECHNICIAN),\n    VIEW_CATTLE(false, FarmRole.OWNER, FarmRole.MANAGER, FarmRole.TECHNICIAN),\n    MANAGE_CATTLE(true, FarmRole.OWNER, FarmRole.MANAGER),\n    /** Record, correct and exclude growth assessments; Owner and Manager (D41). */\n    MANAGE_GROWTH(true, FarmRole.OWNER, FarmRole.MANAGER),\n    MANAGE_CATALOGUES(true, FarmRole.OWNER, FarmRole.MANAGER),\n    /** View pens, occupancy, pen history, cattle: every member. */\n    VIEW_PENS(false, FarmRole.OWNER, FarmRole.MANAGER, FarmRole.TECHNICIAN),\n    /** Create / edit pens, change criteria, stop / resume pens. */\n    MANAGE_PENS(true, FarmRole.OWNER, FarmRole.MANAGER),\n    /** Upload or remove profile photos for active cattle. */\n    MANAGE_CATTLE_PHOTOS(true, FarmRole.OWNER, FarmRole.MANAGER),\n    /** Read-only health and vaccination history, including for technicians. */\n    VIEW_HEALTH(false, FarmRole.OWNER, FarmRole.MANAGER, FarmRole.TECHNICIAN),\n    /** Record and maintain health cases, observations, treatments and vaccinations; Owner and Manager (GBR-08, D41). */\n    MANAGE_HEALTH(true, FarmRole.OWNER, FarmRole.MANAGER),\n    /** Read-only reproduction history and derived reproductive state, including for technicians. */\n    VIEW_REPRODUCTION(false, FarmRole.OWNER, FarmRole.MANAGER, FarmRole.TECHNICIAN),\n    /** Record and maintain estrus, breeding, pregnancy and calving; Owner and Manager (GBR-08, D41). */\n    MANAGE_REPRODUCTION(true, FarmRole.OWNER, FarmRole.MANAGER),\n    /** Vaccines, medicines, purposes and parameters: every member views (FE-18 §2; Q1 decided 09/11: Technician too). */\n    VIEW_CARE_CATALOGUES(false, FarmRole.OWNER, FarmRole.MANAGER, FarmRole.TECHNICIAN),\n    /** Maintain vaccines, medicines and farm parameters; Owner and Manager. */\n    MANAGE_CARE_CATALOGUES(true, FarmRole.OWNER, FarmRole.MANAGER),\n    /** Move one or several cattle between pens. */\n    MOVE_CATTLE(true, FarmRole.OWNER, FarmRole.MANAGER),\n    VIEW_ENTRY_VOUCHERS(false, FarmRole.OWNER, FarmRole.MANAGER),\n    /** Create / save draft / post / discard / void entry vouchers; correct or void one herd entry. */\n    MANAGE_ENTRY_VOUCHERS(true, FarmRole.OWNER, FarmRole.MANAGER),\n    /** Record or void a payment to a seller / supplier (PAY). */\n    RECORD_ENTRY_PAYMENT(true, FarmRole.OWNER, FarmRole.MANAGER),\n    /** Manager has read-only access to exit vouchers; Technician none. */\n    VIEW_EXIT_VOUCHERS(false, FarmRole.OWNER, FarmRole.MANAGER),\n    /** Create / edit / confirm / dismiss / void exit vouchers and death vouchers: Owner only. */\n    MANAGE_EXIT_VOUCHERS(true, FarmRole.OWNER),\n    /** Record or void a collection from a buyer (COLLECT): Owner only. */\n    RECORD_EXIT_COLLECTION(true, FarmRole.OWNER),\n    VIEW_PARTNERS(false, FarmRole.OWNER, FarmRole.MANAGER),\n    /** Sellers and feed suppliers. */\n    MANAGE_SELLERS(true, FarmRole.OWNER, FarmRole.MANAGER),\n    /** Buyers: Owner only. */\n    MANAGE_BUYERS(true, FarmRole.OWNER),\n    VIEW_FEED(false, FarmRole.OWNER, FarmRole.MANAGER, FarmRole.TECHNICIAN),\n    /** Feed stock and movement history are limited to Owner and Manager by FE-23. */\n    VIEW_FEED_STOCK(false, FarmRole.OWNER, FarmRole.MANAGER),\n    MANAGE_FEED(true, FarmRole.OWNER, FarmRole.MANAGER),\n    /** Record, correct and void feeding records; Owner and Manager (GBR-102, D41). */\n    MANAGE_FEEDING(true, FarmRole.OWNER, FarmRole.MANAGER),\n    VIEW_ANNOUNCEMENTS(false, FarmRole.OWNER, FarmRole.MANAGER, FarmRole.TECHNICIAN),\n    MANAGE_ANNOUNCEMENTS(true, FarmRole.OWNER, FarmRole.MANAGER),\n    VIEW_REPORTS(false, FarmRole.OWNER, FarmRole.MANAGER);\n\n    private final boolean write;\n    private final Set\u003cFarmRole> roles;\n\n    FarmAction(boolean write, FarmRole first, FarmRole... more) {\n        this.write = write;\n        this.roles = EnumSet.of(first, more);\n    }\n\n    public boolean isWrite() {\n        return write;\n    }\n\n    public boolean allows(FarmRole role) {\n        return roles.contains(role);\n    }\n}"},"user-not-activated":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/security/UserNotActivatedException.java","start":1,"end":21,"highlightStart":9,"highlightEnd":21,"scope":"Cả class","symbol":"UserNotActivatedException","code":"package vn.edu.fpt.beefcare.security;\n\nimport java.io.Serial;\nimport org.springframework.security.core.AuthenticationException;\n\n/**\n * This exception is thrown in case of a not activated user trying to authenticate.\n */\npublic class UserNotActivatedException extends AuthenticationException {\n\n    @Serial\n    private static final long serialVersionUID = 1L;\n\n    public UserNotActivatedException(String message) {\n        super(message);\n    }\n\n    public UserNotActivatedException(String message, Throwable t) {\n        super(message, t);\n    }\n}"},"farm-membership-entity":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/domain/FarmMembership.java","start":1,"end":171,"highlightStart":17,"highlightEnd":171,"scope":"Cả entity","symbol":"FarmMembership","code":"package vn.edu.fpt.beefcare.domain;\n\nimport com.fasterxml.jackson.annotation.JsonIgnoreProperties;\nimport jakarta.persistence.*;\nimport jakarta.validation.constraints.*;\nimport java.io.Serial;\nimport java.io.Serializable;\nimport java.time.Instant;\nimport java.time.LocalDate;\n\n/**\n * A FarmMembership.\n */\n@Entity\n@Table(name = \"farm_membership\", uniqueConstraints = @UniqueConstraint(name = \"uq_farm_membership_farm_user\", columnNames = { \"farm_id\", \"user_id\" }))\n@SuppressWarnings(\"common-java:DuplicatedBlocks\")\npublic class FarmMembership implements Serializable {\n\n    @Serial\n    private static final long serialVersionUID = 1L;\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.SEQUENCE, generator = \"sequenceGenerator\")\n    @SequenceGenerator(name = \"sequenceGenerator\")\n    @Column(name = \"id\")\n    private Long id;\n\n    @NotNull\n    @Size(max = 30)\n    @Column(name = \"role\", length = 30, nullable = false)\n    private String role;\n\n    @NotNull\n    @Size(max = 30)\n    @Column(name = \"status\", length = 30, nullable = false)\n    private String status;\n\n    @NotNull\n    @Column(name = \"effective_date\", nullable = false)\n    private LocalDate effectiveDate = LocalDate.now(java.time.ZoneOffset.ofHours(7));\n\n    @Column(name = \"change_reason\", length = 500)\n    private String changeReason;\n\n    /**\n     * SRS Part I §3.2 \"joined time\" (SCR-13 Joined, D29): set once when the membership is created, by farm registration\n     * or invitation acceptance; role changes, deactivation and reactivation never move it.\n     */\n    @NotNull\n    @Column(name = \"joined_at\", nullable = false, updatable = false)\n    private Instant joinedAt = Instant.now();\n\n    @Version\n    @Column(name = \"version\", nullable = false)\n    private Integer version = 0;\n\n    @ManyToOne(optional = false)\n    @NotNull\n    @JsonIgnoreProperties(value = { \"subscription\" }, allowSetters = true)\n    private Farm farm;\n\n    @ManyToOne(optional = false)\n    @NotNull\n    @JsonIgnoreProperties(value = { \"platformStaffAccess\" }, allowSetters = true)\n    private AppUser user;\n\n    // jhipster-needle-entity-add-field - JHipster will add fields here\n\n    public Long getId() {\n        return this.id;\n    }\n\n    public FarmMembership id(Long id) {\n        this.setId(id);\n        return this;\n    }\n\n    public void setId(Long id) {\n        this.id = id;\n    }\n\n    public String getRole() {\n        return this.role;\n    }\n\n    public FarmMembership role(String role) {\n        this.setRole(role);\n        return this;\n    }\n\n    public void setRole(String role) {\n        this.role = role;\n    }\n\n    public String getStatus() {\n        return this.status;\n    }\n\n    public FarmMembership status(String status) {\n        this.setStatus(status);\n        return this;\n    }\n\n    public void setStatus(String status) {\n        this.status = status;\n    }\n\n    public LocalDate getEffectiveDate() { return effectiveDate; }\n    public void setEffectiveDate(LocalDate effectiveDate) { this.effectiveDate = effectiveDate; }\n    public String getChangeReason() { return changeReason; }\n    public void setChangeReason(String changeReason) { this.changeReason = changeReason; }\n    public Instant getJoinedAt() { return joinedAt; }\n    public void setJoinedAt(Instant joinedAt) { this.joinedAt = joinedAt; }\n    public Integer getVersion() { return version; }\n    public void setVersion(Integer version) { this.version = version; }\n\n    public Farm getFarm() {\n        return this.farm;\n    }\n\n    public void setFarm(Farm farm) {\n        this.farm = farm;\n    }\n\n    public FarmMembership farm(Farm farm) {\n        this.setFarm(farm);\n        return this;\n    }\n\n    public AppUser getUser() {\n        return this.user;\n    }\n\n    public void setUser(AppUser appUser) {\n        this.user = appUser;\n    }\n\n    public FarmMembership user(AppUser appUser) {\n        this.setUser(appUser);\n        return this;\n    }\n\n    // jhipster-needle-entity-add-getters-setters - JHipster will add getters and setters here\n\n    @Override\n    public boolean equals(Object o) {\n        if (this == o) {\n            return true;\n        }\n        if (!(o instanceof FarmMembership)) {\n            return false;\n        }\n        return getId() != null && getId().equals(((FarmMembership) o).getId());\n    }\n\n    @Override\n    public int hashCode() {\n        // see https://vladmihalcea.com/how-to-implement-equals-and-hashcode-using-the-jpa-entity-identifier/\n        return getClass().hashCode();\n    }\n\n    // prettier-ignore\n    @Override\n    public String toString() {\n        return \"FarmMembership{\" +\n            \"id=\" + getId() +\n            \", role='\" + getRole() + \"'\" +\n            \", status='\" + getStatus() + \"'\" +\n            \"}\";\n    }\n}"},"platform-staff-entity":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/domain/PlatformStaffAccess.java","start":1,"end":138,"highlightStart":17,"highlightEnd":138,"scope":"Cả entity","symbol":"PlatformStaffAccess","code":"package vn.edu.fpt.beefcare.domain;\n\nimport com.fasterxml.jackson.annotation.JsonIgnoreProperties;\nimport io.swagger.v3.oas.annotations.media.Schema;\nimport jakarta.persistence.*;\nimport jakarta.validation.constraints.*;\nimport java.io.Serial;\nimport java.io.Serializable;\n\n/**\n * Quyền nhân sự nền tảng (CS / PM / SA)\n */\n@Schema(description = \"Quyền nhân sự nền tảng (CS / PM / SA)\")\n@Entity\n@Table(name = \"platform_staff_access\")\n@SuppressWarnings(\"common-java:DuplicatedBlocks\")\npublic class PlatformStaffAccess implements Serializable {\n\n    @Serial\n    private static final long serialVersionUID = 1L;\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.SEQUENCE, generator = \"sequenceGenerator\")\n    @SequenceGenerator(name = \"sequenceGenerator\")\n    @Column(name = \"id\")\n    private Long id;\n\n    @NotNull\n    @Size(max = 30)\n    @Column(name = \"role\", length = 30, nullable = false)\n    private String role;\n\n    @NotNull\n    @Size(max = 30)\n    @Column(name = \"status\", length = 30, nullable = false)\n    private String status;\n\n    @JsonIgnoreProperties(value = { \"platformStaffAccess\" }, allowSetters = true)\n    @OneToOne(fetch = FetchType.LAZY, optional = false)\n    @NotNull\n    @JoinColumn(unique = true)\n    private AppUser user;\n\n    @Version\n    @Column(name = \"version\", nullable = false)\n    private Long version;\n\n    // jhipster-needle-entity-add-field - JHipster will add fields here\n\n    public Long getId() {\n        return this.id;\n    }\n\n    public PlatformStaffAccess id(Long id) {\n        this.setId(id);\n        return this;\n    }\n\n    public void setId(Long id) {\n        this.id = id;\n    }\n\n    public String getRole() {\n        return this.role;\n    }\n\n    public PlatformStaffAccess role(String role) {\n        this.setRole(role);\n        return this;\n    }\n\n    public void setRole(String role) {\n        this.role = role;\n    }\n\n    public String getStatus() {\n        return this.status;\n    }\n\n    public PlatformStaffAccess status(String status) {\n        this.setStatus(status);\n        return this;\n    }\n\n    public void setStatus(String status) {\n        this.status = status;\n    }\n\n    public AppUser getUser() {\n        return this.user;\n    }\n\n    public void setUser(AppUser appUser) {\n        this.user = appUser;\n    }\n\n    public PlatformStaffAccess user(AppUser appUser) {\n        this.setUser(appUser);\n        return this;\n    }\n\n    public Long getVersion() {\n        return version;\n    }\n\n    public void setVersion(Long version) {\n        this.version = version;\n    }\n\n    // jhipster-needle-entity-add-getters-setters - JHipster will add getters and setters here\n\n    @Override\n    public boolean equals(Object o) {\n        if (this == o) {\n            return true;\n        }\n        if (!(o instanceof PlatformStaffAccess)) {\n            return false;\n        }\n        return getId() != null && getId().equals(((PlatformStaffAccess) o).getId());\n    }\n\n    @Override\n    public int hashCode() {\n        // see https://vladmihalcea.com/how-to-implement-equals-and-hashcode-using-the-jpa-entity-identifier/\n        return getClass().hashCode();\n    }\n\n    // prettier-ignore\n    @Override\n    public String toString() {\n        return \"PlatformStaffAccess{\" +\n            \"id=\" + getId() +\n            \", role='\" + getRole() + \"'\" +\n            \", status='\" + getStatus() + \"'\" +\n            \"}\";\n    }\n}"}},"sourceNotes":{"app-providers":"AppProviders lắp Router, AuthProvider, AuthGate và SessionProvider theo thứ tự. AuthProvider phải xác định anonymous/authenticated trước; SessionProvider chỉ tải profile sau khi đã có session hợp lệ.","backend-client-auth-check":"isAuthenticated gọi request(\"/api/authenticate\"). Response 204 trả true; BackendError 401 trả false; lỗi mạng hoặc status khác được ném tiếp để AuthProvider hiển thị lỗi kết nối.","guest-auth-flow":"GuestAuthFlow đọc pathname hiện tại. /register render RegisterPage; route link hết hạn render InvalidLinkPage; trạng thái suspended chuyển sang màn hình tạm ngưng.","security-filter-chain":"filterChain cấu hình CSRF, ActiveAccountFilter và quyền truy cập endpoint. GET /api/authenticate, POST /api/register, resend và GET /api/activate được permitAll; /api/account/** yêu cầu session authenticated.","authenticate-check":"Controller chỉ kiểm Principal do Spring Security gắn vào request. Principal null trả 401; có Principal trả 204; hàm không đọc database và không tạo session mới.","security-oauth":"oauth2Login đăng ký GoogleOidcSuccessHandler và GoogleOidcFailureHandler. Spring Security sở hữu endpoint authorization/callback; code ứng dụng chỉ xử lý kết quả success hoặc failure.","google-oauth-file":"googleAuthorizationUrl trả đúng đường dẫn Backend /oauth2/authorization/google. GoogleButton đặt URL này vào href nên toàn bộ OAuth chạy bằng browser redirect, không phải AJAX.","google-identity":"provisionOrLink nhận OidcUser đã xác minh. Hàm kiểm subject, email_verified, account status và xung đột identity; sau đó tạo hoặc cập nhật AppUser/User và trả cờ ownerRegistrationCompleted.","app-user-repository":"AppUserRepository đọc tài khoản theo email hoặc Google subject và persist thay đổi hồ sơ nghiệp vụ. Trong UC-01 nó lưu liên kết Google, trạng thái phương thức đăng nhập và hồ sơ Owner.","user-repository":"UserRepository quản lý identity dùng cho Spring Security. UC-01 dùng repository để kiểm email trùng, lưu password đã mã hóa, kích hoạt User và nạp identity theo email/login.","domain-user-details":"loadUserByUsername đọc User cùng authorities rồi tạo UserDetails cho Spring Security. AccountResource hoặc GoogleOidcSuccessHandler dùng kết quả này để tạo Authentication trước khi lưu SecurityContext vào session.","auth-validation":"normalizeEmail trim/lowercase email; validateRegistration kiểm fullName, email, password, confirmPassword và termsAccepted. Object lỗi khác rỗng làm RegisterPage return trước client.register.","auth-types":"RegistrationRequest là shape dữ liệu từ form sang client: fullName, email, password, confirmPassword, termsAccepted. AuthClient định nghĩa các lời gọi register, resend, login và reset mà page được phép dùng.","auth-client-register":"createBackendAuthClient nối use case xác thực với shared HTTP client. register gửi POST /api/register; resendVerification gửi POST /api/account/verification/resend và đọc nextAllowedAt.","backend-transport":"backendTransport là adapter dùng chung quanh backendClient. Feature gọi get/command qua boundary này để giữ xử lý 401, CSRF, cookie và idempotency ở một chỗ.","auth-errors":"Các hàm friendly... đọc BackendError.status/code/params rồi chọn thông báo tiếng Việt. MSG-FE01-10 được giữ để RegisterPage nhận biết email trùng và hiện liên kết đăng nhập/quên mật khẩu.","account-register":"registerAccount bind JSON vào RegistrationRequest và truyền từng field sang IdentityService.register. Service trả email đã chuẩn hóa; annotation @ResponseStatus(CREATED) tạo HTTP 201 cùng RegistrationResponse.","exception-translator":"domainProblem chuyển DomainException thành response lỗi có status, code và params. backendClient đọc JSON này thành BackendError để Frontend phân biệt validation, conflict, suspended và lỗi chung.","user-entity":"User là identity lưu password hash, activated, login/email, authorities và trạng thái khóa đăng nhập. IdentityService tạo bản ghi với activated=false cho đến khi link email được consume.","app-user-entity":"AppUser lưu hồ sơ nghiệp vụ BeefCare: accountStatus, phương thức đăng nhập, điều khoản, fullName/phone và ownerRegistrationCompleted. UC-01 cập nhật entity này ở đăng ký, Google link, kích hoạt password method và hoàn tất Owner.","authority-repository":"IdentityService đọc ROLE_USER từ AuthorityRepository rồi gắn vào User trước saveAndFlush. Thiếu ROLE_USER làm register fail thay vì tạo identity không có quyền chuẩn.","identity-link-helpers":"sendLink vô hiệu token cũ, tạo AccountLinkToken mới, ký bearer, lưu tokenHash rồi gọi MailService.queueActionLink. consume tìm token bằng hash, từ chối token thiếu/hết hạn/đã dùng và đặt usedAt khi hợp lệ.","action-link-signer":"ActionLinkSigner sinh nonce, ký payload ACCOUNT_LINK bằng HMAC và hash raw bearer bằng SHA-256. Raw token đi vào URL email; database chỉ giữ hash để giảm rủi ro lộ token dùng được.","account-link-token-entity":"AccountLinkToken giữ tokenType, tokenHash, tokenNonce, createdAt, expiresAt, usedAt và quan hệ User. usedAt khác null hoặc expiresAt đã qua làm link bị từ chối.","account-link-token-repository":"Repository tìm token theo hash/type, lấy token mới nhất để rate-limit và invalidate token chưa dùng. sendLink gọi save/saveAndFlush trước khi queue email.","mail-queue-action-link":"queueActionLink tạo EmailDeliveryJob PENDING thay vì gửi SMTP trong transaction đăng ký. Job giữ recipient, template và reference đến AccountLinkToken để worker dựng URL sau commit.","email-job-entity":"EmailDeliveryJob lưu trạng thái giao mail, số lần thử, thời điểm thử tiếp theo và lỗi cuối. Trạng thái bền vững cho phép worker retry sau khi request đăng ký đã kết thúc.","email-job-repository":"Repository khóa và đọc các job đến hạn, đồng thời persist SENT/RETRY/FAILED. Nó là hàng đợi database giữa transaction đăng ký và adapter gửi mail.","smtp-email-delivery":"SmtpEmailDelivery chuyển OutboundEmail sang JavaMailSender trong môi trường production. Exception được EmailDeliveryJobService ghi lại để tính retry.","mock-email-delivery":"MockEmailDelivery không gửi ra SMTP; nó ghi nội dung vào mail sink cho dev/test. Luồng trạng thái job vẫn giống production để kiểm tra link.","account-resend-verification":"Endpoint nhận EmailRequest, gọi resendVerification và luôn trả ResendVerificationResponse chứa nextAllowedAt. Response không nói email có tồn tại hay không.","identity-resend-verification":"resendVerification chuẩn hóa email, tìm password account chưa activate, áp dụng 60 giây và tối đa 5 lần/giờ. Đủ điều kiện mới gọi sendLink; mọi trường hợp vẫn trả thời điểm thử lại.","identity-consume":"consume hash raw token để tìm AccountLinkToken đúng type. Token rỗng, không tồn tại, đã dùng hoặc hết hạn ném MSG-FE01-06; token hợp lệ được đặt usedAt ngay trong transaction.","owner-registration-page":"Component bind fullName, phone, termsAccepted vào form và chuyển onSubmit sang hook. Email chỉ đọc; điều khoản chỉ hiện khi account chưa ghi nhận consent.","workspace-validation":"validateOwnerProfile kiểm tên, số điện thoại Việt Nam và điều khoản. compactPhone bỏ khoảng trắng/dấu phân cách trước khi adapter tạo contactPhone cho Backend.","farm-workspace-usecase":"Hook là boundary giữa page và farmWorkspaceApi. completeOwnerRegistration chỉ chuyển input sang adapter; query profile dùng useQuery để tải dữ liệu hiện tại khi mở trang.","owner-registration-api":"Adapter đổi phone của form thành contactPhone, gọi command POST /api/account/owner-registration và map OwnerRegistrationResponse về profile shape của Frontend.","active-account-filter":"Mọi authenticated API đi qua filter. Session hết hạn trả 401; account không còn ACTIVE làm expire session và trả status/code trước khi request tới controller.","farm-access-current":"currentActiveUser lấy user id/email từ Authentication, đọc AppUser và bắt buộc accountStatus ACTIVE. Controller dùng kết quả này thay vì tin id do Frontend gửi.","session-lifecycle":"notifyOwnerRegistrationCompleted phát custom event trong browser. SessionProvider nghe event, đặt cờ completed tức thời rồi gọi loadProfile để đồng bộ lại từ Backend.","authentication-usecase":"loadSessionProfile gọi GET /api/account/profile qua backendTransport. SessionProvider dùng response này làm nguồn dữ liệu cho SessionContext sau đăng nhập/kích hoạt/hoàn tất Owner.","session-profile":"sessionFromProfile kiểm và map ProfileResponse thành SessionUser: account status, ownerRegistrationCompleted, roles, farms và farm hiện tại. Payload sai shape bị từ chối thay vì đưa dữ liệu không hợp lệ vào context.","account-profile-get":"getProfile lấy AppUser hiện tại qua FarmAccessService rồi chuyển sang profile(account). Endpoint chỉ chạy khi session authenticated và ActiveAccountFilter đã cho qua.","account-profile-response":"profile đọc email verified, platform role, sign-in methods và danh sách farm/permission để tạo ProfileResponse. ownerRegistrationCompleted lấy trực tiếp từ AppUser vừa persist.","farm-workspace-list":"FarmWorkspaceService.list đọc memberships/trại có hiệu lực cho account hiện tại. Kết quả được profile() map thành farms trong ProfileResponse."}}</script>
  <script>
    const DATA = JSON.parse(document.getElementById('data').textContent)
    const state = { caseIndex: Math.max(0, DATA.useCases.findIndex((item) => '#' + item.id === location.hash)), stepIndex: 0, sourceOverride: null }
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[character]))
    const currentCase = () => DATA.useCases[state.caseIndex]
    const currentStep = () => currentCase().steps[state.stepIndex]
    const currentSource = () => state.sourceOverride || currentStep().source
    function findDiagramNode(source) {
      const rows = [...currentCase().frontend, ...currentCase().backend]
      for (const item of rows) {
        if (!item) continue
        for (const entry of item.nodes) if (entry.source === source) return entry
      }
      return null
    }

    function selectCase(index) {
      state.caseIndex = index
      state.stepIndex = 0
      state.sourceOverride = null
      history.replaceState(null, '', '#' + DATA.useCases[index].id)
      render()
    }
    function selectStep(index) {
      state.stepIndex = index
      state.sourceOverride = null
      renderFlow()
      renderDiagram()
      renderDetail()
    }
    function selectSource(source) {
      const index = currentCase().steps.findIndex((item) => item.source === source)
      if (index >= 0) selectStep(index)
      else if (DATA.sources[source]) {
        state.sourceOverride = source
        renderDiagram()
        renderDetail()
      }
    }
    function renderTabs() {
      document.getElementById('tabs').innerHTML = DATA.useCases.map((item, index) => '<button class="tab ' + (index === state.caseIndex ? 'active' : '') + '" type="button" data-case="' + index + '">' + escapeHtml(item.short) + ' · ' + escapeHtml(item.title) + '</button>').join('')
      document.querySelectorAll('[data-case]').forEach((button) => button.addEventListener('click', () => selectCase(Number(button.dataset.case))))
    }
    function renderNode(item) {
      const active = item.source === currentSource() ? ' active' : ''
      const source = DATA.sources[item.source]
      const lines = source ? 'L' + source.highlightStart + '–' + source.highlightEnd : ''
      const sourcePath = source ? source.file : item.path
      return '<button type="button" class="node' + active + '" data-source="' + escapeHtml(item.source || '') + '" title="' + escapeHtml(sourcePath) + '"><span class="node-file"><span>' + escapeHtml(item.file) + '</span><span class="node-lines">' + escapeHtml(lines) + '</span></span><span class="node-path">' + escapeHtml(item.path) + '</span><span class="methods">' + item.methods.map((method) => '<span class="method">' + escapeHtml(method) + '</span>').join('') + '</span><span class="node-result">' + escapeHtml(item.result) + '</span></button>'
    }
    function renderRow(item, kind, last) {
      if (!item) return '<div class="lane-cell ' + kind + (last ? ' last' : '') + ' empty">Không có xử lý ' + (kind === 'frontend' ? 'Frontend' : 'Backend') + ' mới</div>'
      let nodes = ''
      item.nodes.forEach((entry, index) => {
        if (index > 0) nodes += '<div class="arrow"><span>' + escapeHtml(item.arrows[index - 1] || 'gọi') + '</span>→</div>'
        nodes += renderNode(entry)
      })
      return '<div class="lane-cell ' + kind + (last ? ' last' : '') + '"><p class="row-caption">' + escapeHtml(item.title) + '<span>' + escapeHtml(item.subtitle) + '</span></p><div class="nodes">' + nodes + '</div></div>'
    }
    function renderExchange(entry) {
      if (entry.local) return '<div class="local-exchange"><strong>Không có HTTP mới</strong><div class="local-result">✓ ' + escapeHtml(entry.response) + '</div><div class="local-result">→ ' + escapeHtml(entry.frontendReceiver) + '</div>' + (entry.failure ? '<div class="failure-line">✕ ' + escapeHtml(entry.failure) + '</div>' : '') + '</div>'
      return '<div class="exchange"><div class="request-line">' + escapeHtml(entry.request) + ' ──▶</div><div class="receiver"><strong>Hàm Backend nhận</strong> · ' + escapeHtml(entry.backendReceiver) + '</div><div class="response-line">◀── ✓ Thành công · ' + escapeHtml(entry.response) + '</div><div class="receiver"><strong>Frontend nhận</strong> · ' + escapeHtml(entry.frontendReceiver) + '</div>' + (entry.failure ? '<div class="failure-line">✕ Không hợp lệ/lỗi · ' + escapeHtml(entry.failure) + '</div>' : '') + '</div>'
    }
    function renderBridge(entries, last) {
      return '<div class="bridge-cell' + (last ? ' last' : '') + '">' + (entries || []).map(renderExchange).join('') + '</div>'
    }
    function renderDiagram() {
      const item = currentCase()
      const rowCount = Math.max(item.frontend.length, item.backend.length, item.exchanges.length)
      let map = '<div class="system-map"><div class="lane-head frontend"><span>Frontend</span><small>React / TypeScript</small></div><div class="bridge-head">Request sang →<br>← Response về</div><div class="lane-head backend"><span>Backend</span><small>Spring Boot / Database</small></div>'
      for (let index = 0; index < rowCount; index += 1) {
        const last = index === rowCount - 1
        map += renderRow(item.frontend[index], 'frontend', last)
        map += renderBridge(item.exchanges[index], last)
        map += renderRow(item.backend[index], 'backend', last)
      }
      map += '</div>'
      document.getElementById('title').textContent = item.short + ' · ' + item.title
      document.getElementById('diagram').innerHTML = map
      document.querySelectorAll('.node[data-source]').forEach((button) => button.addEventListener('click', () => selectSource(button.dataset.source)))
    }
    function renderFlow() {
      const item = currentCase()
      document.getElementById('step-count').textContent = item.steps.length + ' bước'
      document.getElementById('flow').innerHTML = item.steps.map((entry, index) => '<button type="button" class="flow-step ' + (index === state.stepIndex ? 'active' : '') + '" data-step="' + index + '"><span class="flow-num">' + (index + 1) + '.</span><span><span class="flow-title">' + escapeHtml(entry.title) + '</span><span class="flow-pseudo">' + escapeHtml(entry.pseudo) + '</span><span class="flow-meta">' + escapeHtml(entry.meta) + '</span></span></button>').join('')
      document.querySelectorAll('[data-step]').forEach((button) => button.addEventListener('click', () => selectStep(Number(button.dataset.step))))
    }
    function renderDetail() {
      const selectedStep = currentStep()
      const diagramNode = state.sourceOverride ? findDiagramNode(state.sourceOverride) : null
      const selected = diagramNode
        ? { source: state.sourceOverride, title: diagramNode.methods.join(' → '), pseudo: diagramNode.result, note: DATA.sourceNotes[state.sourceOverride] || (diagramNode.result + '. Các symbol trực tiếp trong ô: ' + diagramNode.methods.join(', ') + '. Dòng tô vàng là nơi nhận dữ liệu, gọi dependency hoặc tạo giá trị chuyển sang ô kế tiếp.') }
        : selectedStep
      const source = DATA.sources[selected.source]
      const lines = source.code.split('\n')
      const code = lines.map((line, offset) => {
        const number = source.start + offset
        const highlighted = number >= source.highlightStart && number <= source.highlightEnd
        return '<div class="code-line' + (highlighted ? ' highlight' : '') + '" data-line="' + number + '"><span class="line-number">' + number + '</span><span class="line-code">' + (line ? escapeHtml(line) : ' ') + '</span></div>'
      }).join('')
      document.getElementById('detail').innerHTML = '<div class="source-head"><div><h3 class="source-symbol">' + escapeHtml(source.symbol) + '</h3><div class="source-path">' + escapeHtml(source.file) + ':' + source.start + '–' + source.end + '</div></div><span class="scope">' + escapeHtml(source.scope) + '</span></div><div class="code-window" tabindex="0">' + code + '</div><div class="code-explanation"><div class="explain-row"><strong>Hàm / điểm vào</strong><span>' + escapeHtml(selected.title) + '</span></div><div class="explain-row"><strong>Đường gọi</strong><span>' + escapeHtml(selected.pseudo) + '</span></div><div class="explain-row"><strong>Xử lý và kết quả</strong><span>' + escapeHtml(selected.note) + '</span></div><div class="explain-row"><strong>Đoạn liên quan</strong><span>Dòng ' + source.highlightStart + '–' + source.highlightEnd + ' được tô vàng; phần còn lại giữ nguyên để thấy import, kiểu dữ liệu, class hoặc hàm bao quanh.</span></div></div>'
      const codeWindow = document.querySelector('.code-window')
      const first = codeWindow && codeWindow.querySelector('.code-line.highlight')
      if (codeWindow && first) codeWindow.scrollTop = Math.max(0, first.offsetTop - codeWindow.offsetTop - codeWindow.clientHeight / 3)
    }
    function render() { renderTabs(); renderDiagram(); renderFlow(); renderDetail() }
    window.addEventListener('hashchange', () => {
      const index = DATA.useCases.findIndex((item) => '#' + item.id === location.hash)
      if (index >= 0 && index !== state.caseIndex) { state.caseIndex = index; state.stepIndex = 0; state.sourceOverride = null; render() }
    })
    render()
  </script>
</body>
</html>

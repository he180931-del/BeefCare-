.getLogin();\n        }\n        AppUser appUser = new AppUser()\n            .email(identity.getEmail().trim().toLowerCase(Locale.ROOT))\n            .fullName(fullName)\n            .accountStatus(ACTIVE);\n        appUser.setPasswordLoginEnabled(true);\n        return appUserRepository.save(appUser);\n    }\n\n    private Optional\u003cAppUser> findAppUser(String login) {\n        Optional\u003cAppUser> byEmail = appUserRepository.findOneByEmailIgnoreCase(login);\n        if (byEmail.isPresent()) {\n            return byEmail;\n        }\n        return userRepository\n            .findOneByLogin(login.toLowerCase(Locale.ROOT))\n            .map(u -> u.getEmail())\n            .flatMap(appUserRepository::findOneByEmailIgnoreCase);\n    }\n\n    static FarmRole parseRole(String raw) {\n        if (raw == null) {\n            return null;\n        }\n        String normalized = raw.trim().toUpperCase(Locale.ROOT).replace(\"ROLE_\", \"\").replace(\"FARM_\", \"\");\n        try {\n            return FarmRole.valueOf(normalized);\n        } catch (IllegalArgumentException e) {\n            return null;\n        }\n    }\n}"},"farm-workspace-list":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/FarmWorkspaceService.java","start":1,"end":139,"highlightStart":31,"highlightEnd":47,"scope":"Cả class service","symbol":"FarmWorkspaceService.list()","code":"package vn.edu.fpt.beefcare.service;\n\nimport jakarta.persistence.EntityManager;\nimport java.time.Duration;\nimport java.time.Instant;\nimport java.util.LinkedHashSet;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.Set;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\nimport vn.edu.fpt.beefcare.domain.*;\nimport vn.edu.fpt.beefcare.repository.FarmRepository;\nimport vn.edu.fpt.beefcare.service.dto.FarmWorkspaceDtos.*;\n\n/** Small, complete workspace slice used by every feature team. */\n@Service\npublic class FarmWorkspaceService {\n    private final EntityManager em;\n    private final FarmAccessService access;\n    private final FarmRepository farms;\n    private final StarterCatalogueService starters;\n    private final AuditService audit;\n    private final OutboxService outbox;\n    private final FarmServiceFacts facts;\n    private final FarmClock clock;\n    public FarmWorkspaceService(EntityManager em,FarmAccessService access,FarmRepository farms,\n        StarterCatalogueService starters,AuditService audit,OutboxService outbox,FarmServiceFacts facts,FarmClock clock) {\n        this.em=em;this.access=access;this.farms=farms;this.starters=starters;this.audit=audit;this.outbox=outbox;this.facts=facts;this.clock=clock;\n    }\n    /**\n     * UC-FE02-02 step 2: every farm where the caller has an ACTIVE membership, whatever its service status. A Manager or\n     * Technician gets a farm that is not ACTIVE as a locked card (AF3); entering it is refused by {@link #context}.\n     */\n    @Transactional(readOnly=true)\n    public List\u003cSummary> list() {\n        AppUser user=access.currentActiveUser();\n        List\u003cFarmMembership> memberships=em.createQuery(\"select m from FarmMembership m join fetch m.farm where m.user.id=:user and upper(m.status)='ACTIVE' order by m.farm.id\",FarmMembership.class)\n            .setParameter(\"user\",user.getId()).getResultList();\n        if (memberships.isEmpty()) return List.of();\n        List\u003cLong> ids=memberships.stream().map(m -> m.getFarm().getId()).toList();\n        // SCR-09 \"Until dd/mm/yyyy\" is the latest confirmed end.\n        Map\u003cLong,Long> cattle=facts.activeCattle(ids);Map\u003cLong,Instant> until=facts.latestEnd(ids);\n        return memberships.stream().map(m -> summary(m.getFarm(),m.getRole(),cattle,until)).toList();\n    }\n    private static Summary summary(Farm farm,String role,Map\u003cLong,Long> cattle,Map\u003cLong,Instant> until) {\n        return new Summary(farm.getId(),farm.getName(),role,farm.getServiceStatus(),farm.getVersion(),farm.getProvince(),farm.getCommune(),\n            cattle.getOrDefault(farm.getId(),0L),until.get(farm.getId()),farm.getTimeZone());\n    }\n    /** UC-FE02-01: one farm in PENDING_PAYMENT with its OWNER membership, parameters, starter catalogue and audit (R-02-03). */\n    @Transactional\n    public Details register(Registration request) {\n        AppUser owner=access.currentActiveUser();\n        if (!owner.isOwnerRegistrationCompleted()) throw DomainException.forbidden(MessageCodes.FE02_02);\n        String province=VietnamProvinces.require(request.province(),\"province\");\n        Farm farm=new Farm(); farm.setServiceStatus(\"PENDING_PAYMENT\"); farm.setTimeZone(FarmTimeZones.DEFAULT);\n        applyContact(farm,request.name(),province,request.commune(),request.detailedAddress(),\n            blankDefault(request.contactPerson(),owner.getFullName()),blankDefault(request.contactPhone(),owner.getPhone()),request.registrationCertificateInfo());\n        farm.setExpectedHerdSize(blankDefault(request.expectedHerdSize(),null)); em.persist(farm);\n        FarmMembership membership=new FarmMembership();membership.setFarm(farm);membership.setUser(owner);\n        membership.setRole(\"OWNER\");membership.setStatus(\"ACTIVE\");membership.setJoinedAt(clock.now());em.persist(membership); // SCR-13 Joined (D29)\n        starters.create(farm,owner,request.mainBreedCodes());\n        audit.log(farm,owner,\"FARM_REGISTER\",\"Farm\",farm.getId(),Map.of(\"name\",farm.getName()));\n        outbox.enqueue(farm.getId(),\"FARM_REGISTERED\",\"Farm\",farm.getId(),Map.of(\"farmId\",farm.getId(),\"ownerId\",owner.getId()));\n        em.flush();return details(farm);\n    }\n    @Transactional(readOnly=true)\n    public Details get(Long farmId) { return details(access.require(farmId,FarmAction.VIEW_FARM_INFORMATION).farm()); }\n    /** UC-FE02-02 step 4: rechecks membership, role and service status before the farm becomes the current farm (GBR-09, GBR-14). */\n    @Transactional(readOnly=true)\n    public Summary context(Long farmId) {\n        FarmContext ctx=access.require(farmId,FarmAction.SELECT_FARM);\n        List\u003cLong> ids=List.of(farmId);\n        return summary(ctx.farm(),ctx.role().name(),facts.activeCattle(ids),facts.latestEnd(ids));\n    }\n    /**\n     * UC-FE02-03 (SCR-11, flow confirmed as Q1): the Owner saves registration, contact and operating information in any\n     * service status. Province as SCR-10 (Q3), time zone fixed to UTC+7, a blank optional field is\n     * \"not provided\"; main breeds change only when the request sends them (SCR-11 has no such field).\n     */\n    @Transactional\n    public Details update(Long farmId,Update request) {\n        FarmContext ctx=access.require(farmId,FarmAction.MANAGE_FARM_INFORMATION);\n        Farm f=farms.lockById(farmId).orElseThrow(() -> DomainException.notFound(MessageCodes.COM_08));\n        VersionGuard.requireExpected(f.getVersion(),request.expectedVersion());\n        String province=VietnamProvinces.require(request.province(),\"province\");\n        String zone=FarmTimeZones.require(request.timeZone(),\"timeZone\");\n        applyContact(f,request.name(),province,request.commune(),blankDefault(request.detailedAddress(),null),blankDefault(request.contactPerson(),null),\n            blankDefault(request.contactPhone(),null),blankDefault(request.registrationCertificateInfo(),null));\n        f.setTimeZone(zone); f.setMorningShiftStart(request.morningShiftStart());f.setOperatingNotes(blankDefault(request.operatingNotes(),null));\n        if(request.mainBreedIds()!=null) {\n            Set\u003cBreed> selected=new LinkedHashSet\u003c>();\n            for(Long id:request.mainBreedIds()) {\n                Breed b=id==null?null:em.find(Breed.class,id);\n                if(b==null || !farmId.equals(b.getFarm().getId()) || !Boolean.TRUE.equals(b.getAvailable())) throw DomainException.invalid(\"mainBreedIds\");\n                selected.add(b);\n            }\n            f.setMainBreeds(selected);\n        }\n        audit.log(ctx,\"FARM_UPDATE\",\"Farm\",f.getId(),Map.of(\"name\",f.getName()));\n        outbox.enqueue(farmId,\"FARM_UPDATED\",\"Farm\",farmId,Map.of(\"farmId\",farmId));\n        em.flush();return details(f);\n    }\n    @Transactional(readOnly=true)\n    public Catalogues catalogues(Long farmId) {\n        access.require(farmId,FarmAction.VIEW_CATALOGUES);\n        List\u003cLookup> breeds=em.createQuery(\"select b from Breed b where b.farm.id=:farm order by b.code\",Breed.class).setParameter(\"farm\",farmId).getResultList()\n            .stream().map(b->new Lookup(b.getId(),b.getCode(),b.getName(),Boolean.TRUE.equals(b.getAvailable()),null)).toList();\n        List\u003cLookup> purposes=em.createQuery(\"select p from ProductionPurpose p where p.farm.id=:farm order by p.code\",ProductionPurpose.class).setParameter(\"farm\",farmId).getResultList()\n            .stream().map(p->new Lookup(p.getId(),p.getCode(),p.getName(),Boolean.TRUE.equals(p.getAvailable()),p.getPurposeType().name())).toList();\n        List\u003cLookup> vaccines=em.createQuery(\"select v from Vaccine v where v.farm.id=:farm order by v.code\",Vaccine.class).setParameter(\"farm\",farmId).getResultList()\n            .stream().map(v->new Lookup(v.getId(),v.getCode(),v.getName(),Boolean.TRUE.equals(v.getAvailable()),v.getDiseasePrevented())).toList();\n        List\u003cLookup> feeds=em.createQuery(\"select f from FeedItem f where f.farm.id=:farm order by f.code\",FeedItem.class).setParameter(\"farm\",farmId).getResultList()\n            .stream().map(f->new Lookup(f.getId(),f.getCode(),f.getName(),Boolean.TRUE.equals(f.getAvailable()),f.getFeedGroup())).toList();\n        return new Catalogues(breeds,purposes,vaccines,feeds);\n    }\n    private void applyContact(Farm f,String name,String province,String commune,String address,String person,String phone,String certificate) {\n        f.setName(name.trim());f.setProvince(province.trim());f.setCommune(commune.trim());f.setDetailedAddress(address);\n        f.setLocation(province.trim()+\", \"+commune.trim());f.setContact(phone==null?\"\":phone);\n        f.setContactPerson(person);f.setContactPhone(phone);f.setRegistrationCertificateInfo(certificate);\n    }\n    private String blankDefault(String value,String fallback) { return value==null || value.isBlank()?fallback:value.trim(); }\n    private Details details(Farm f) {\n        List\u003cLong> ids=List.of(f.getId());\n        Instant currentEnd=facts.currentPeriod(f.getId()).map(FarmServiceFacts.Period::end).orElse(null);\n        Instant latestEnd=facts.latestEnd(ids).get(f.getId());\n        FarmServiceFacts.Suspension suspension=\"SUSPENDED\".equalsIgnoreCase(f.getServiceStatus())?facts.lastSuspension(ids).get(f.getId()):null;\n        Instant suspendedAt=suspension==null?null:suspension.at();\n        // Whole days left, as SCR-57 counts them; the period keeps running while SUSPENDED (Q4).\n        Long daysRemaining=currentEnd==null?null:Math.max(0,Duration.between(facts.now(),currentEnd).toDays());\n        AppUser owner=facts.owners(ids).get(f.getId());\n        return new Details(f.getId(),f.getName(),f.getProvince(),f.getCommune(),f.getDetailedAddress(),f.getContactPerson(),f.getContactPhone(),\n            f.getRegistrationCertificateInfo(),f.getExpectedHerdSize(),f.getTimeZone(),f.getMorningShiftStart(),f.getOperatingNotes(),f.getServiceStatus(),\n            f.getMainBreeds().stream().map(Breed::getId).collect(java.util.stream.Collectors.toSet()),f.getVersion(),\n            currentEnd,latestEnd==null?null:latestEnd.minus(SubscriptionPaymentService.RENEWAL_WINDOW),suspendedAt,daysRemaining,\n            owner==null?null:owner.getFullName(),owner==null?null:owner.getEmail());\n    }\n}\n"},"farm-service-facts":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/FarmServiceFacts.java","start":1,"end":144,"highlightStart":46,"highlightEnd":79,"scope":"Cả class service","symbol":"FarmServiceFacts.activeCattle() + latestEnd()","code":"package vn.edu.fpt.beefcare.service;\n\nimport jakarta.persistence.EntityManager;\nimport java.time.Instant;\nimport java.util.Collection;\nimport java.util.HashMap;\nimport java.util.Map;\nimport java.util.Optional;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\nimport vn.edu.fpt.beefcare.domain.AppUser;\nimport vn.edu.fpt.beefcare.domain.AuditLog;\nimport vn.edu.fpt.beefcare.domain.FarmMembership;\nimport vn.edu.fpt.beefcare.domain.enumeration.HerdStatus;\n\n/**\n * Read-only service facts shared by the Owner side (SCR-09, SCR-11) and the Platform Manager side (SCR-12 and its\n * popup): ACTIVE cattle, latest confirmed end, the purchased period covering now, the last suspension (kept in the\n * append-only audit as the farm service history, decision 08/11/2026) and the Owner. No cattle or care record is read\n * beyond a count (GBR-11).\n */\n@Service\n@Transactional(readOnly = true)\npublic class FarmServiceFacts {\n\n    /** Audit action of a PM suspension; its details hold {@code statusBefore}, {@code statusAfter} and {@code reason}. */\n    public static final String SUSPEND_ACTION = \"FARM_SERVICE_SUSPEND\";\n    public static final String RESTORE_ACTION = \"FARM_SERVICE_RESTORE\";\n\n    public record Period(Instant start, Instant end) {}\n\n    public record Suspension(Instant at, String byName, String reason) {}\n\n    private final EntityManager em;\n    private final FarmClock clock;\n\n    public FarmServiceFacts(EntityManager em, FarmClock clock) {\n        this.em = em;\n        this.clock = clock;\n    }\n\n    public Instant now() {\n        return clock.now();\n    }\n\n    public Map\u003cLong, Long> activeCattle(Collection\u003cLong> farmIds) {\n        Map\u003cLong, Long> counts = new HashMap\u003c>();\n        if (farmIds.isEmpty()) return counts;\n        em\n            .createQuery(\"select c.farm.id, count(c) from Cattle c where c.farm.id in :ids and c.herdStatus=:s group by c.farm.id\", Object[].class)\n            .setParameter(\"ids\", farmIds)\n            .setParameter(\"s\", HerdStatus.ACTIVE)\n            .getResultList()\n            .forEach(row -> counts.put((Long) row[0], (Long) row[1]));\n        return counts;\n    }\n\n    /** Number of farms per upper-case service status, over every farm of the platform (SCR-12 tiles). */\n    public Map\u003cString, Long> farmsByStatus() {\n        Map\u003cString, Long> counts = new HashMap\u003c>();\n        em\n            .createQuery(\"select upper(f.serviceStatus), count(f) from Farm f group by upper(f.serviceStatus)\", Object[].class)\n            .getResultList()\n            .forEach(row -> counts.put(row[0] == null ? \"\" : (String) row[0], (Long) row[1]));\n        return counts;\n    }\n\n    /** Latest confirmed end per farm; absent when the farm has no accepted payment yet. */\n    public Map\u003cLong, Instant> latestEnd(Collection\u003cLong> farmIds) {\n        Map\u003cLong, Instant> ends = new HashMap\u003c>();\n        if (farmIds.isEmpty()) return ends;\n        em\n            .createQuery(\"select s.farm.id, s.latestEnd from Subscription s where s.farm.id in :ids\", Object[].class)\n            .setParameter(\"ids\", farmIds)\n            .getResultList()\n            .forEach(row -> {\n                if (row[1] != null) ends.put((Long) row[0], (Instant) row[1]);\n            });\n        return ends;\n    }\n\n    /** The accepted purchased period covering now, if any. */\n    public Optional\u003cPeriod> currentPeriod(Long farmId) {\n        Instant now = clock.now();\n        return em\n            .createQuery(\n                \"select p.purchasedStart, p.purchasedEnd from Payment p where p.subscription.farm.id=:f and upper(p.state)='PAID' \" +\n                \"and p.purchasedStart\u003c=:now and p.purchasedEnd>:now order by p.purchasedEnd desc\",\n                Object[].class\n            )\n            .setParameter(\"f\", farmId)\n            .setParameter(\"now\", now)\n            .setMaxResults(1)\n            .getResultStream()\n            .findFirst()\n            .map(row -> new Period((Instant) row[0], (Instant) row[1]));\n    }\n\n    /** The most recent PM suspension per farm (date, PM and reason), read from the farm service history in the audit. */\n    public Map\u003cLong, Suspension> lastSuspension(Collection\u003cLong> farmIds) {\n        Map\u003cLong, Suspension> latest = new HashMap\u003c>();\n        if (farmIds.isEmpty()) return latest;\n        em\n            .createQuery(\n                \"select a from AuditLog a left join fetch a.actor where a.farm.id in :ids and a.action=:action order by a.loggedAt desc, a.id desc\",\n                AuditLog.class\n            )\n            .setParameter(\"ids\", farmIds)\n            .setParameter(\"action\", SUSPEND_ACTION)\n            .getResultList()\n            .forEach(entry -> latest.putIfAbsent(entry.getFarm().getId(), suspension(entry)));\n        return latest;\n    }\n\n    public Map\u003cLong, AppUser> owners(Collection\u003cLong> farmIds) {\n        Map\u003cLong, AppUser> owners = new HashMap\u003c>();\n        if (farmIds.isEmpty()) return owners;\n        em\n            .createQuery(\n                \"select m from FarmMembership m join fetch m.user where m.farm.id in :ids and upper(m.role)='OWNER' and upper(m.status)='ACTIVE'\",\n                FarmMembership.class\n            )\n            .setParameter(\"ids\", farmIds)\n            .getResultList()\n            .forEach(m -> owners.putIfAbsent(m.getFarm().getId(), m.getUser()));\n        return owners;\n    }\n\n    /**\n     * GBR-13 without the suspension flag, used after a restore (GBR-15): ACTIVE while the latest confirmed end is ahead,\n     * EXPIRED once it has passed, PENDING_PAYMENT when no payment was ever accepted (UC-FE02-05 AF2).\n     */\n    public String statusFromSubscription(Instant latestEnd) {\n        if (latestEnd == null) return \"PENDING_PAYMENT\";\n        return latestEnd.isAfter(clock.now()) ? \"ACTIVE\" : \"EXPIRED\";\n    }\n\n    @SuppressWarnings(\"unchecked\")\n    private static Suspension suspension(AuditLog entry) {\n        Map\u003cString, Object> details = JsonSupport.fromJson(entry.getDetails(), Map.class);\n        Object reason = details == null ? null : details.get(\"reason\");\n        return new Suspension(entry.getLoggedAt(), entry.getActor() == null ? null : entry.getActor().getFullName(), reason == null ? null : reason.toString());\n    }\n}"},"identity-link-helpers":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/IdentityService.java","start":296,"end":348,"highlightStart":296,"highlightEnd":348,"scope":"Nhóm hàm nội bộ","symbol":"IdentityService · account/link helpers","code":"    private Optional\u003cAppUser> findGoogleOnlyAccount(String email) {\n        if (email == null || email.isBlank()) return Optional.empty();\n        return appUserRepository.findOneByEmailIgnoreCase(email.trim().toLowerCase(Locale.ROOT))\n            .filter(account -> !account.isPasswordLoginEnabled());\n    }\n\n    private Optional\u003cUser> findPasswordAccount(String email, boolean allowSuspended) {\n        if (email == null || email.isBlank()) return Optional.empty();\n        String normalized = email.trim().toLowerCase(Locale.ROOT);\n        return userRepository.findOneByEmailIgnoreCase(normalized)\n            .filter(user -> appUserRepository.findOneByEmailIgnoreCase(normalized)\n                .filter(AppUser::isPasswordLoginEnabled)\n                .filter(account -> allowSuspended || \"ACTIVE\".equalsIgnoreCase(account.getAccountStatus()))\n                .isPresent());\n    }\n\n    private void issueRateLimited(User user, String type, Duration lifetime, String templateKey) {\n        Instant now = Instant.now();\n        Optional\u003cAccountLinkToken> latest = tokenRepository.findFirstByUserIdAndTokenTypeOrderByCreatedAtDesc(user.getId(), type);\n        if (latest.isPresent() && latest.orElseThrow().getCreatedAt().plusSeconds(60).isAfter(now)) return;\n        if (tokenRepository.countByUserIdAndTokenTypeAndCreatedAtAfter(user.getId(), type, now.minus(Duration.ofHours(1))) >= MAX_LINK_EMAILS_PER_HOUR) {\n            return;\n        }\n        sendLink(user, type, lifetime, templateKey);\n    }\n\n    private void sendLink(User user, String type, Duration lifetime, String templateKey) {\n        Instant now = Instant.now();\n        tokenRepository.invalidateUnused(user.getId(), type, now);\n        AccountLinkToken link = new AccountLinkToken();\n        link.setTokenHash(linkSigner.hash(linkSigner.newNonce())); // replaced in the same transaction after the id is assigned\n        link.setTokenType(type);\n        link.setTokenNonce(linkSigner.newNonce());\n        link.setCreatedAt(now);\n        link.setExpiresAt(now.plus(lifetime));\n        link.setUser(user);\n        tokenRepository.save(link);\n        String raw = linkSigner.bearer(\"ACCOUNT_LINK:\" + type, link.getId(), link.getTokenNonce());\n        link.setTokenHash(linkSigner.hash(raw));\n        tokenRepository.saveAndFlush(link);\n        mailService.queueActionLink(user.getEmail(), templateKey, \"ACCOUNT_LINK\", link.getId(), user.getFirstName(), null, null);\n    }\n\n    private AccountLinkToken consume(String rawToken, String type) {\n        if (rawToken == null || rawToken.isBlank()) throw invalidLink();\n        AccountLinkToken link = tokenRepository.findOneByTokenHashAndTokenType(linkSigner.hash(rawToken), type).orElseThrow(IdentityService::invalidLink);\n        Instant now = Instant.now();\n        if (link.getUsedAt() != null || !link.getExpiresAt().isAfter(now)) throw invalidLink();\n        link.setUsedAt(now);\n        return link;\n    }\n\n    private Optional\u003cUser> findLogin(String login) {"},"identity-consume":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/IdentityService.java","start":339,"end":346,"highlightStart":339,"highlightEnd":345,"scope":"Cả hàm","symbol":"consume()","code":"    private AccountLinkToken consume(String rawToken, String type) {\n        if (rawToken == null || rawToken.isBlank()) throw invalidLink();\n        AccountLinkToken link = tokenRepository.findOneByTokenHashAndTokenType(linkSigner.hash(rawToken), type).orElseThrow(IdentityService::invalidLink);\n        Instant now = Instant.now();\n        if (link.getUsedAt() != null || !link.getExpiresAt().isAfter(now)) throw invalidLink();\n        link.setUsedAt(now);\n        return link;\n    }"},"identity-validation-session":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/IdentityService.java","start":350,"end":405,"highlightStart":350,"highlightEnd":405,"scope":"Nhóm hàm nội bộ","symbol":"IdentityService · validation/session helpers","code":"    }\n\n    private static String normalizeEmail(String email) {\n        if (email == null || email.isBlank()) throw DomainException.required(\"email\");\n        String normalized = email.trim().toLowerCase(Locale.ROOT);\n        if (normalized.length() > 254 || !normalized.matches(\"^[^\\\\s@]+@[^\\\\s@]+\\\\.[^\\\\s@]+$\")) throw DomainException.invalid(\"email\");\n        return normalized;\n    }\n\n    /** Keeps the denormalized sign-in-method state aligned with the credential in jhi_user. */\n    private static void activatePasswordMethod(AppUser account, Instant linkedAt) {\n        account.setPasswordLoginEnabled(true);\n        account.setPasswordMethodStatus(\"ACTIVE\");\n        if (account.getPasswordLinkedAt() == null) account.setPasswordLinkedAt(linkedAt);\n    }\n\n    /** GBR-02: 8-128 characters, not equal to the email (MSG-FE01-08); the confirmation must match (MSG-FE01-09). */\n    private static void validatePassword(String password, String email, String confirmation) {\n        if (password == null || password.length() \u003c 8 || password.length() > 128 || password.equalsIgnoreCase(email)) {\n            throw DomainException.badRequest(MessageCodes.FE01_08, \"field\", \"password\");\n        }\n        if (!password.equals(confirmation)) throw DomainException.badRequest(MessageCodes.FE01_09, \"field\", \"confirmPassword\");\n    }\n\n    /** MSG-FE01-06: the verification or reset link is unknown, expired or already used. */\n    private static DomainException invalidLink() {\n        return DomainException.badRequest(MessageCodes.FE01_06);\n    }\n\n    /** MSG-FE01-02 with the time at which password sign-in is available again (GBR-02). */\n    public static DomainException locked(Instant lockedUntil) {\n        return new DomainException(MessageCodes.FE01_02, DomainException.params(\"time\", lockedUntil.toString()), HttpStatus.LOCKED);\n    }\n\n    /** Ends the account's sessions; the caller's own session is kept when {@code keepCurrent} (change password, UC-FE01-06 step 4). */\n    private void expireSessions(User user, boolean keepCurrent) {\n        String currentSessionId = null;\n        if (keepCurrent && RequestContextHolder.getRequestAttributes() instanceof ServletRequestAttributes attributes) {\n            var session = attributes.getRequest().getSession(false);\n            if (session != null) currentSessionId = session.getId();\n        }\n        java.util.Set\u003cString> principals = new java.util.HashSet\u003c>();\n        principals.add(user.getLogin());\n        if (user.getEmail() != null) principals.add(user.getEmail());\n        for (String principal : principals) {\n            for (SessionInformation information : sessionRegistry.getAllSessions(principal, false)) {\n                if (currentSessionId == null || !currentSessionId.equals(information.getSessionId())) information.expireNow();\n            }\n        }\n    }\n\n    /** MSG-FE01-03: the Account Suspended state; no session is created (GBR-04). */\n    public static DomainException suspended(String email) {\n        return DomainException.forbidden(MessageCodes.FE01_03, \"email\", email);\n    }\n}"},"domain-exception":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/DomainException.java","start":1,"end":77,"highlightStart":11,"highlightEnd":77,"scope":"Cả class","symbol":"DomainException","code":"package vn.edu.fpt.beefcare.service;\n\nimport java.util.LinkedHashMap;\nimport java.util.Map;\nimport org.springframework.http.HttpStatus;\n\n/**\n * A business rule or permission failure carrying a spec message code (see {@link MessageCodes}) and its parameters.\n * Rendered by the ExceptionTranslator as {\"code\": \"MSG-...\", \"params\": {...}}.\n */\npublic class DomainException extends RuntimeException {\n\n    private static final long serialVersionUID = 1L;\n\n    private final String code;\n    private final transient Map\u003cString, Object> params;\n    private final HttpStatus status;\n\n    public DomainException(String code, Map\u003cString, Object> params, HttpStatus status) {\n        super(code + (params == null || params.isEmpty() ? \"\" : \" \" + params));\n        this.code = code;\n        this.params = params == null ? Map.of() : Map.copyOf(params);\n        this.status = status;\n    }\n\n    public String getCode() {\n        return code;\n    }\n\n    public Map\u003cString, Object> getParams() {\n        return params;\n    }\n\n    public HttpStatus getStatus() {\n        return status;\n    }\n\n    /** Builds a parameter map from alternating name / value arguments (null values are skipped). */\n    public static Map\u003cString, Object> params(Object... keyValues) {\n        Map\u003cString, Object> map = new LinkedHashMap\u003c>();\n        for (int i = 0; i + 1 \u003c keyValues.length; i += 2) {\n            if (keyValues[i + 1] != null) {\n                map.put(String.valueOf(keyValues[i]), keyValues[i + 1]);\n            }\n        }\n        return map;\n    }\n\n    public static DomainException badRequest(String code, Object... kv) {\n        return new DomainException(code, params(kv), HttpStatus.BAD_REQUEST);\n    }\n\n    public static DomainException forbidden(String code, Object... kv) {\n        return new DomainException(code, params(kv), HttpStatus.FORBIDDEN);\n    }\n\n    public static DomainException notFound(String code, Object... kv) {\n        return new DomainException(code, params(kv), HttpStatus.NOT_FOUND);\n    }\n\n    public static DomainException conflict(String code, Object... kv) {\n        return new DomainException(code, params(kv), HttpStatus.CONFLICT);\n    }\n\n    /** Business-rule violation (HTTP 422). */\n    public static DomainException unprocessable(String code, Object... kv) {\n        return new DomainException(code, params(kv), HttpStatus.UNPROCESSABLE_ENTITY);\n    }\n\n    public static DomainException required(String field) {\n        return badRequest(MessageCodes.COM_06, \"field\", field);\n    }\n\n    public static DomainException invalid(String field) {\n        return badRequest(MessageCodes.COM_10, \"field\", field);\n    }\n}"},"exception-translator":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/errors/ExceptionTranslator.java","start":75,"end":122,"highlightStart":90,"highlightEnd":120,"scope":"Nhóm hàm dịch lỗi","symbol":"ExceptionTranslator","code":"\n    @SuppressWarnings(\"java:S2638\")\n    @Nullable\n    @Override\n    protected ResponseEntity\u003cObject> handleExceptionInternal(\n        Exception ex,\n        @Nullable Object body,\n        HttpHeaders headers,\n        HttpStatusCode statusCode,\n        WebRequest request\n    ) {\n        body = body == null ? wrapAndCustomizeProblem(ex, (NativeWebRequest) request) : body;\n        return super.handleExceptionInternal(ex, body, headers, statusCode, request);\n    }\n\n    protected ProblemDetailWithCause wrapAndCustomizeProblem(Throwable ex, NativeWebRequest request) {\n        return customizeProblem(getProblemDetailWithCause(ex), ex, request);\n    }\n\n    private ProblemDetailWithCause getProblemDetailWithCause(Throwable ex) {\n        if (ex instanceof DomainException domainException) {\n            return domainProblem(domainException.getCode(), domainException.getParams(), domainException.getStatus());\n        }\n        if (\n            ex instanceof vn.edu.fpt.beefcare.service.UsernameAlreadyUsedException\n        ) return (ProblemDetailWithCause) new LoginAlreadyUsedException().getBody();\n        if (\n            ex instanceof vn.edu.fpt.beefcare.service.EmailAlreadyUsedException\n        ) return (ProblemDetailWithCause) new EmailAlreadyUsedException().getBody();\n        if (\n            ex instanceof vn.edu.fpt.beefcare.service.InvalidPasswordException\n        ) return (ProblemDetailWithCause) new InvalidPasswordException().getBody();\n\n        if (\n            ex instanceof ErrorResponseException exp && exp.getBody() instanceof ProblemDetailWithCause problemDetailWithCause\n        ) return problemDetailWithCause;\n        return ProblemDetailWithCauseBuilder.instance().withStatus(toStatus(ex).value()).build();\n    }\n\n    /** Error body required by the spec: {\"code\": \"MSG-...\", \"params\": {...}} plus status, title and a default message. */\n    private ProblemDetailWithCause domainProblem(String code, Map\u003cString, Object> params, HttpStatus status) {\n        ProblemDetailWithCause problem = ProblemDetailWithCauseBuilder.instance().withStatus(status.value()).build();\n        problem.setProperty(\"code\", code);\n        problem.setProperty(\"params\", params);\n        problem.setProperty(MESSAGE_KEY, domainMessages.resolve(code, params));\n        return problem;\n    }\n"},"action-link-signer":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/email/ActionLinkSigner.java","start":1,"end":53,"highlightStart":18,"highlightEnd":52,"scope":"Cả class","symbol":"ActionLinkSigner","code":"package vn.edu.fpt.beefcare.service.email;\n\nimport java.nio.charset.StandardCharsets;\nimport java.security.MessageDigest;\nimport java.security.SecureRandom;\nimport java.util.Base64;\nimport java.util.HexFormat;\nimport javax.crypto.Mac;\nimport javax.crypto.spec.SecretKeySpec;\nimport org.springframework.beans.factory.annotation.Value;\nimport org.springframework.stereotype.Component;\n\n/** Derives an opaque link from a purpose, immutable source-row id, nonce and server-only HMAC key. */\n@Component\npublic class ActionLinkSigner {\n\n    private final byte[] secret;\n    private final SecureRandom random = new SecureRandom();\n\n    public ActionLinkSigner(@Value(\"${beefcare.email.link-signing-key}\") String secret) {\n        if (secret == null || secret.length() \u003c 32) throw new IllegalStateException(\"BEEFCARE_EMAIL_LINK_SIGNING_KEY must contain at least 32 characters\");\n        this.secret = secret.getBytes(StandardCharsets.UTF_8);\n    }\n\n    public String newNonce() {\n        byte[] nonce = new byte[32];\n        random.nextBytes(nonce);\n        return Base64.getUrlEncoder().withoutPadding().encodeToString(nonce);\n    }\n\n    public String bearer(String purpose, Long sourceId, String nonce) {\n        try {\n            Mac mac = Mac.getInstance(\"HmacSHA256\");\n            mac.init(new SecretKeySpec(secret, \"HmacSHA256\"));\n            return Base64.getUrlEncoder().withoutPadding().encodeToString(mac.doFinal((purpose + \":\" + sourceId + \":\" + nonce).getBytes(StandardCharsets.UTF_8)));\n        } catch (Exception failure) {\n            throw new IllegalStateException(\"HMAC-SHA256 is required by the Java runtime\", failure);\n        }\n    }\n\n    public String hash(String bearer) {\n        try {\n            return HexFormat.of().formatHex(MessageDigest.getInstance(\"SHA-256\").digest(bearer.getBytes(StandardCharsets.UTF_8)));\n        } catch (Exception failure) {\n            throw new IllegalStateException(\"SHA-256 is required by the Java runtime\", failure);\n        }\n    }\n\n    public boolean matchesHash(String bearer, String expectedHash) {\n        if (bearer == null || expectedHash == null) return false;\n        return MessageDigest.isEqual(hash(bearer).getBytes(StandardCharsets.US_ASCII), expectedHash.getBytes(StandardCharsets.US_ASCII));\n    }\n}"},"email-job-service":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/email/EmailDeliveryJobService.java","start":1,"end":342,"highlightStart":91,"highlightEnd":247,"scope":"Cả class job","symbol":"EmailDeliveryJobService","code":"package vn.edu.fpt.beefcare.service.email;\n\nimport java.time.Duration;\nimport java.time.Instant;\nimport java.time.format.DateTimeFormatter;\nimport java.util.Locale;\nimport org.springframework.beans.factory.annotation.Value;\nimport org.springframework.data.domain.PageRequest;\nimport org.springframework.scheduling.annotation.Scheduled;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.PlatformTransactionManager;\nimport org.springframework.transaction.TransactionDefinition;\nimport org.springframework.transaction.support.TransactionTemplate;\nimport org.thymeleaf.context.Context;\nimport org.thymeleaf.spring6.SpringTemplateEngine;\nimport vn.edu.fpt.beefcare.domain.AccountLinkToken;\nimport vn.edu.fpt.beefcare.domain.AppUser;\nimport vn.edu.fpt.beefcare.domain.EmailDeliveryJob;\nimport vn.edu.fpt.beefcare.domain.Farm;\nimport vn.edu.fpt.beefcare.domain.FarmInvitation;\nimport vn.edu.fpt.beefcare.repository.AccountLinkTokenRepository;\nimport vn.edu.fpt.beefcare.repository.AppUserRepository;\nimport vn.edu.fpt.beefcare.repository.EmailDeliveryJobRepository;\nimport vn.edu.fpt.beefcare.repository.FarmInvitationRepository;\nimport vn.edu.fpt.beefcare.repository.FarmRepository;\nimport vn.edu.fpt.beefcare.service.FarmTimeZones;\nimport vn.edu.fpt.beefcare.service.FarmClock;\nimport vn.edu.fpt.beefcare.repository.PaymentRepository;\nimport vn.edu.fpt.beefcare.repository.FarmMembershipRepository;\nimport vn.edu.fpt.beefcare.service.NotificationService;\nimport vn.edu.fpt.beefcare.service.payment.SubscriptionNoticeJob;\nimport vn.edu.fpt.beefcare.repository.SupportTicketRepository;\n\n/** Durable, retryable dispatch for verification, reset and invitation links and account notices. Only a row reference is stored. */\n@Service\npublic class EmailDeliveryJobService {\n\n    private static final String EMAIL_VERIFICATION = \"EMAIL_VERIFICATION\";\n    private static final String PASSWORD_RESET = \"PASSWORD_RESET\";\n    private static final int MAX_ATTEMPTS = 8;\n    private static final DateTimeFormatter DISPLAY_TIME = DateTimeFormatter.ofPattern(\"dd/MM/yyyy HH:mm\", Locale.forLanguageTag(\"vi\"));\n    private final EmailDeliveryJobRepository jobs;\n    private final AccountLinkTokenRepository accountLinks;\n    private final FarmInvitationRepository invitations;\n    private final SupportTicketRepository supportTickets;\n    private final AppUserRepository accounts;\n    private final FarmRepository farms;\n    private final PaymentRepository payments;\n    private final FarmMembershipRepository memberships;\n    private final NotificationService notifications;\n    private final ActionLinkSigner signer;\n    private final EmailDelivery delivery;\n    private final SpringTemplateEngine templates;\n    private final String frontendBaseUrl;\n    private final String backendBaseUrl;\n    private final FarmClock farmClock;\n    private final TransactionTemplate requiresNew;\n\n    public EmailDeliveryJobService(\n        EmailDeliveryJobRepository jobs,\n        AccountLinkTokenRepository accountLinks,\n        FarmInvitationRepository invitations,\n        SupportTicketRepository supportTickets,\n        AppUserRepository accounts,\n        FarmRepository farms,\n        PaymentRepository payments,\n        FarmMembershipRepository memberships,\n        NotificationService notifications,\n        ActionLinkSigner signer,\n        EmailDelivery delivery,\n        SpringTemplateEngine templates,\n        PlatformTransactionManager transactionManager,\n        FarmClock farmClock,\n        @Value(\"${beefcare.email.frontend-base-url}\") String frontendBaseUrl,\n        @Value(\"${beefcare.email.backend-base-url}\") String backendBaseUrl\n    ) {\n        this.jobs = jobs;\n        this.accountLinks = accountLinks;\n        this.invitations = invitations;\n        this.supportTickets = supportTickets;\n        this.accounts = accounts;\n        this.farms = farms;\n        this.payments = payments;\n        this.memberships = memberships;\n        this.notifications = notifications;\n        this.signer = signer;\n        this.delivery = delivery;\n        this.templates = templates;\n        this.farmClock = farmClock;\n        this.frontendBaseUrl = trimTrailingSlash(frontendBaseUrl);\n        this.backendBaseUrl = trimTrailingSlash(backendBaseUrl);\n        this.requiresNew = new TransactionTemplate(transactionManager);\n        this.requiresNew.setPropagationBehavior(TransactionDefinition.PROPAGATION_REQUIRES_NEW);\n    }\n\n    @Scheduled(fixedDelayString = \"${beefcare.email.poll-delay-ms:2000}\")\n    public void dispatchDueJobs() {\n        Instant now = Instant.now();\n        for (EmailDeliveryJob candidate : jobs.findByStatusAndAvailableAtLessThanEqualOrderByCreatedAtAsc(\"PENDING\", now, PageRequest.of(0, 25))) {\n            if (claim(candidate.getId(), now)) dispatch(candidate.getId());\n        }\n    }\n\n    private boolean claim(Long id, Instant now) {\n        Integer claimed = requiresNew.execute(status -> jobs.claim(id, now, now.plus(Duration.ofMinutes(2))));\n        return claimed != null && claimed == 1;\n    }\n\n    private void dispatch(Long id) {\n        OutboundEmail message;\n        try {\n            message = requiresNew.execute(status -> prepare(id));\n            if (message == null) return;\n            delivery.deliver(message);\n            requiresNew.executeWithoutResult(status -> jobs.findById(id).ifPresent(job -> {\n                if (!\"PENDING\".equals(job.getStatus())) return;\n                job.setStatus(\"SENT\");\n                job.setSentAt(Instant.now());\n                job.setLeaseUntil(null);\n                job.setLastError(null);\n            }));\n        } catch (RuntimeException failure) {\n            requiresNew.executeWithoutResult(status -> jobs.findById(id).ifPresent(job -> {\n                if (!\"PENDING\".equals(job.getStatus())) return;\n                job.setLeaseUntil(null);\n                job.setLastError(failure.getClass().getSimpleName());\n                boolean dayLimited = \"PAYMENT_RECEIPT\".equals(job.getLinkSource()) || \"INVITATION\".equals(job.getLinkSource()) || \"MEMBERSHIP\".equals(job.getLinkSource());\n                Instant deadline = job.getCreatedAt().plus(Duration.ofHours(24));\n                if (dayLimited ? !Instant.now().isBefore(deadline) : job.getAttempts() >= MAX_ATTEMPTS) {\n                    job.setStatus(\"FAILED\");\n                } else {\n                    long delay = Math.min(3600, 1L \u003c\u003c Math.min(12, job.getAttempts()));\n                    Instant available = Instant.now().plusSeconds(delay);\n                    job.setAvailableAt(dayLimited && available.isAfter(deadline) ? deadline : available);\n                }\n            }));\n        }\n    }\n\n    private OutboundEmail prepare(Long id) {\n        EmailDeliveryJob job = jobs.findById(id).orElse(null);\n        if (job == null || !\"PENDING\".equals(job.getStatus())) return null;\n        if (\"PAYMENT_RECEIPT\".equals(job.getLinkSource())) return paymentReceipt(job);\n        String bearer;\n        Instant expiry;\n        String expectedRecipient;\n        String actionUrl;\n        Farm subscriptionFarm = null;\n        String joinedMember = null;\n        if (\"MEMBERSHIP\".equals(job.getLinkSource()) && \"MEMBER_JOINED\".equals(job.getTemplateKey())) {\n            // UC-FE03-04 step 8 / JOB-07 (D28): retried for 24 hours; the farm's current ACTIVE Owner is resolved now, and a lost\n            // recipient closes the event without sending.\n            if (!Instant.now().isBefore(job.getCreatedAt().plus(Duration.ofHours(24)))) {\n                job.setStatus(\"FAILED\"); job.setLeaseUntil(null); return null;\n            }\n            var membership = memberships.findById(job.getLinkSourceId()).orElse(null);\n            if (membership == null) return cancel(job);\n            Farm farm = membership.getFarm();\n            AppUser owner = memberships.findFirstByFarmIdAndRoleIgnoreCaseAndStatusIgnoreCase(farm.getId(), \"OWNER\", \"ACTIVE\")\n                .map(value -> value.getUser()).filter(value -> \"ACTIVE\".equalsIgnoreCase(value.getAccountStatus())).orElse(null);\n            if (owner == null) return cancel(job);\n            job.setRecipient(owner.getEmail()); job.setDisplayName(owner.getFullName()); job.setContextName(farm.getName());\n            AppUser member = membership.getUser();\n            joinedMember = blankDefault(member.getFullName(), member.getEmail()) + \" (\" + member.getEmail() + \")\";\n            expectedRecipient = owner.getEmail();\n            expiry = job.getCreatedAt();\n            actionUrl = frontendBaseUrl + \"/thanh-vien?farmId=\" + farm.getId();\n            bearer = null;\n        } else if (\"ACCOUNT_LINK\".equals(job.getLinkSource())) {\n            AccountLinkToken link = accountLinks.findById(job.getLinkSourceId()).orElse(null);\n            if (link == null || link.getUsedAt() != null || link.getTokenNonce() == null || !link.getExpiresAt().isAfter(Instant.now())) return cancel(job);\n            String templateKey = EMAIL_VERIFICATION.equals(link.getTokenType()) ? \"VERIFY_EMAIL\" : \"PASSWORD_RESET\".equals(link.getTokenType()) ? \"RESET_PASSWORD\" : null;\n            if (templateKey == null || !templateKey.equals(job.getTemplateKey())) return cancel(job);\n            bearer = signer.bearer(\"ACCOUNT_LINK:\" + link.getTokenType(), link.getId(), link.getTokenNonce());\n            if (!signer.matchesHash(bearer, link.getTokenHash())) return cancel(job);\n            expectedRecipient = link.getUser().getEmail();\n            expiry = link.getExpiresAt();\n            String base = templateKey.equals(\"VERIFY_EMAIL\") ? backendBaseUrl + \"/api/activate?token=\" : frontendBaseUrl + \"/resetpassword?token=\";\n            actionUrl = base + bearer;\n        } else if (\"INVITATION\".equals(job.getLinkSource())) {\n            // JOB-07 / D25: retries are bounded by elapsed time, not a fixed attempt count.\n            if (!Instant.now().isBefore(job.getCreatedAt().plus(Duration.ofHours(24)))) {\n                job.setStatus(\"FAILED\"); job.setLeaseUntil(null); return null;\n            }\n            FarmInvitation invitation = invitations.findById(job.getLinkSourceId()).orElse(null);\n            if (invitation == null || !\"PENDING\".equalsIgnoreCase(invitation.getStatus()) || invitation.getTokenNonce() == null || !invitation.getExpiresAt().isAfter(farmClock.now())) return cancel(job);\n            bearer = signer.bearer(\"FARM_INVITATION\", invitation.getId(), invitation.getTokenNonce());\n            if (!signer.matchesHash(bearer, invitation.getTokenHash())) return cancel(job);\n            expectedRecipient = invitation.getInvitedEmail();\n            expiry = invitation.getExpiresAt();\n            actionUrl = frontendBaseUrl + \"/invitation/accept?token=\" + bearer;\n        } else if (\"ACCOUNT\".equals(job.getLinkSource()) && \"GOOGLE_SIGN_IN_ADVICE\".equals(job.getTemplateKey())) {\n            // UC-FE01-05 AF1: no link or token, only advice; dropped if a password was added meanwhile.\n            AppUser account = accounts.findById(job.getLinkSourceId()).orElse(null);\n            if (account == null || account.isPasswordLoginEnabled()) return cancel(job);\n            expectedRecipient = account.getEmail();\n            expiry = Instant.now();\n            actionUrl = frontendBaseUrl + \"/sign-in\";\n            bearer = null;\n        } else if (\"FARM_SUBSCRIPTION\".equals(job.getLinkSource()) && \"SUBSCRIPTION_NOTICE\".equals(job.getTemplateKey())) {\n            // JOB-05: contextRole holds the notice type and contextName the period end it is about.\n            Farm farm = farms.findById(job.getLinkSourceId()).orElse(null);\n            if (farm == null) return cancel(job);\n            expectedRecipient = job.getRecipient();\n            expiry = Instant.parse(job.getContextName());\n            actionUrl = frontendBaseUrl + \"/farms/\" + farm.getId() + \"/subscription\";\n            bearer = null;\n            subscriptionFarm = farm;\n        } else if (\"SUPPORT_TICKET\".equals(job.getLinkSource()) && \"SUPPORT_TICKET_UPDATE\".equals(job.getTemplateKey())) {\n            var ticket = supportTickets.findById(job.getLinkSourceId()).orElse(null);\n            if (ticket == null || !job.getRecipient().equalsIgnoreCase(ticket.getRequester().getEmail())) return cancel(job);\n            expectedRecipient = ticket.getRequester().getEmail();\n            expiry = Instant.now();\n            actionUrl = frontendBaseUrl + \"/support/tickets/\" + ticket.getId();\n            bearer = null;\n            job.setContextName(ticket.getCode());\n            job.setContextRole(ticket.getStatus());\n            job.setDisplayName(ticket.getRequester().getFullName());\n        } else {\n            return cancel(job);\n        }\n        if (!job.getRecipient().equalsIgnoreCase(expectedRecipient)) return cancel(job);\n\n        String title;\n        String intro;\n        String button;\n        String safeName = blankDefault(job.getDisplayName(), \"bạn\");\n        String expiryText;\n        switch (job.getTemplateKey()) {\n            case \"VERIFY_EMAIL\" -> {\n                title = \"Xác minh email của bạn\";\n                intro = \"Xác minh địa chỉ email để kích hoạt tài khoản BeefCare và tiếp tục đăng ký.\";\n                button = \"Xác minh email\";\n                expiryText = \"Liên kết có hiệu lực đến \" + DISPLAY_TIME.withZone(FarmTimeZones.OFFSET).format(expiry) + \" (giờ Việt Nam).\";\n            }\n            case \"RESET_PASSWORD\" -> {\n                title = \"Đặt lại mật khẩu\";\n                intro = \"Bạn đã yêu cầu đặt lại mật khẩu BeefCare. Nếu bạn không yêu cầu, hãy bỏ qua email này.\";\n                button = \"Đặt lại mật khẩu\";\n                expiryText = \"Liên kết chỉ sử dụng một lần và hết hạn lúc \" + DISPLAY_TIME.withZone(FarmTimeZones.OFFSET).format(expiry) + \" (giờ Việt Nam).\";\n            }\n            case \"FARM_INVITATION\" -> {\n                String farmName = blankDefault(job.getContextName(), \"trang trại\");\n                String role = \"MANAGER\".equalsIgnoreCase(job.getContextRole()) ? \"Quản lý\" : \"Kỹ thuật viên\";\n                intro = \"Bạn được mời tham gia trang trại “\" + farmName + \"” với vai trò \" + role + \". Hãy đăng nhập bằng email này để xem và chấp nhận lời mời.\";\n                title = \"Lời mời tham gia trang trại\";\n                button = \"Xem lời mời\";\n                expiryText = \"Lời mời hết hạn lúc \" + DISPLAY_TIME.withZone(FarmTimeZones.OFFSET).format(expiry) + \" (giờ Việt Nam).\";\n            }\n            case \"GOOGLE_SIGN_IN_ADVICE\" -> {\n                title = \"Đăng nhập bằng Google\";\n                intro = \"Tài khoản BeefCare của bạn đăng nhập bằng Google và chưa có mật khẩu, nên không có mật khẩu nào để đặt lại. Hãy chọn “Tiếp tục với Google” ở màn hình đăng nhập. Sau khi đăng nhập, bạn có thể thêm mật khẩu trong hồ sơ của mình.\";\n                button = \"Đăng nhập\";\n                expiryText = \"Nếu bạn không yêu cầu đặt lại mật khẩu, hãy bỏ qua email này.\";\n            }\n            case \"SUBSCRIPTION_NOTICE\" -> {\n                SubscriptionNoticeJob.Notice notice;\n                try { notice = SubscriptionNoticeJob.Notice.valueOf(job.getContextRole()); } catch (RuntimeException unknown) { return cancel(job); }\n                title = notice == SubscriptionNoticeJob.Notice.RENEWAL_OPEN ? \"Đã mở gia hạn gói dịch vụ\"\n                    : notice == SubscriptionNoticeJob.Notice.EXPIRED ? \"Thời hạn dịch vụ đã hết\" : \"Gói dịch vụ sắp hết hạn\";\n                intro = SubscriptionNoticeJob.summary(notice, subscriptionFarm, expiry.atZone(FarmTimeZones.OFFSET).toLocalDate());\n                button = \"Xem gói dịch vụ\";\n                expiryText = \"BeefCare không tự động gia hạn; bạn tạo yêu cầu thanh toán khi muốn gia hạn.\";\n            }\n            case \"MEMBER_JOINED\" -> {\n                String farmName = blankDefault(job.getContextName(), \"trang trại\");\n                String role = \"MANAGER\".equalsIgnoreCase(job.getContextRole()) ? \"Quản lý\" : \"Kỹ thuật viên\";\n                title = \"Thành viên mới đã tham gia trang trại\";\n                intro = joinedMember + \" đã chấp nhận lời mời và tham gia trang trại “\" + farmName + \"” với vai trò \" + role + \".\";\n                button = \"Xem thành viên\";\n                expiryText = \"Thời điểm tham gia: \" + DISPLAY_TIME.withZone(FarmTimeZones.OFFSET).format(expiry) + \" (giờ Việt Nam).\";\n            }\n            case \"SUPPORT_TICKET_UPDATE\" -> {\n                title = \"Cập nhật yêu cầu hỗ trợ\";\n                intro = \"Yêu cầu hỗ trợ \" + blankDefault(job.getContextName(), \"\") + \" đã được cập nhật. Trạng thái hiện tại: \" + blankDefault(job.getContextRole(), \"Đang xử lý\") + \".\";\n                button = \"Mở yêu cầu hỗ trợ\";\n                expiryText = \"Đăng nhập vào BeefCare để xem nội dung và trao đổi mới nhất.\";\n            }\n            default -> { return cancel(job); }\n        }\n        Context context = new Context(Locale.forLanguageTag(\"vi\"));\n        context.setVariable(\"title\", title);\n        context.setVariable(\"greeting\", \"Xin chào \" + safeName + \",\");\n        context.setVariable(\"intro\", intro);\n        context.setVariable(\"buttonLabel\", button);\n        context.setVariable(\"actionUrl\", actionUrl);\n        context.setVariable(\"expiryText\", expiryText);\n        String html = templates.process(\"mail/srs/action\", context);\n        String plain = \"BeefCare\\n\\n\" + \"Xin chào \" + safeName + \",\\n\\n\" + intro + \"\\n\\n\" + button + \": \" + actionUrl + \"\\n\\n\" + expiryText + \"\\n\";\n        return new OutboundEmail(job.getRecipient(), job.getSubject(), html, true, Instant.now(), plain);\n    }\n\n    /** JOB-07 payment slice: resolve the current Owner at actual dispatch, not the historical requester. */\n    private OutboundEmail paymentReceipt(EmailDeliveryJob job) {\n        if (!Instant.now().isBefore(job.getCreatedAt().plus(Duration.ofHours(24)))) {\n            job.setStatus(\"FAILED\"); job.setLeaseUntil(null); return null;\n        }\n        var payment = payments.findById(job.getLinkSourceId()).orElse(null);\n        if (payment == null || !\"PAID\".equals(payment.getState()) || payment.getReceiptCode() == null) return cancel(job);\n        Farm farm = payment.getSubscription().getFarm();\n        var owner = memberships.findFirstByFarmIdAndRoleIgnoreCaseAndStatusIgnoreCase(farm.getId(), \"OWNER\", \"ACTIVE\")\n            .map(v -> v.getUser()).filter(v -> \"ACTIVE\".equalsIgnoreCase(v.getAccountStatus())).orElse(null);\n        if (owner == null) return cancel(job);\n        job.setRecipient(owner.getEmail()); job.setDisplayName(owner.getFullName());\n        String actionUrl = frontendBaseUrl + \"/goi-dich-vu/lich-su?farm=\" + farm.getId();\n        var vn = FarmTimeZones.OFFSET;\n        var number = java.text.NumberFormat.getIntegerInstance(Locale.forLanguageTag(\"vi-VN\"));\n        String amount = number.format(payment.getAmountVnd()) + \" VND\";\n        String period = DISPLAY_TIME.format(payment.getPurchasedStart().atZone(vn)) + \" – \" + DISPLAY_TIME.format(payment.getPurchasedEnd().atZone(vn));\n        String suspension = \"SUSPENDED\".equalsIgnoreCase(farm.getServiceStatus())\n            ? \"Trang trại đang bị tạm ngưng. Thanh toán đã được xác nhận và không gỡ tạm ngưng.\" : \"Kỳ dịch vụ đã được xác nhận.\";\n        String intro = \"Đã xác nhận thanh toán \" + payment.getQuoteRef() + \".\\nTrang trại: \" + farm.getName() +\n            \"\\nSố tiền: \" + amount + \"\\nKỳ hạn: \" + payment.getDurationYears() + \" năm\\nKỳ dịch vụ: \" + period +\n            \"\\nBiên lai: \" + payment.getReceiptCode() + \"\\n\" + suspension;\n        notifications.notify(owner, \"subscription\", \"SUBSCRIPTION\", farm.getId(), \"Thanh toán gói dịch vụ đã được xác nhận\",\n            \"Mã biên nhận \" + payment.getReceiptCode() + \". Thời hạn mới kết thúc ngày \" + payment.getPurchasedEnd().atZone(vn).toLocalDate(),\n            \"PAYMENT_PAID:\" + payment.getId());\n        Context context = new Context(Locale.forLanguageTag(\"vi\"));\n        context.setVariable(\"title\", \"Xác nhận thanh toán gói dịch vụ\");\n        context.setVariable(\"greeting\", \"Xin chào \" + blankDefault(owner.getFullName(), \"bạn\") + \",\");\n        context.setVariable(\"intro\", intro); context.setVariable(\"actionUrl\", actionUrl);\n        context.setVariable(\"buttonLabel\", \"Xem lịch sử thanh toán\"); context.setVariable(\"expiryText\", \"Đăng nhập vào BeefCare để xem chi tiết thanh toán và biên lai.\");\n        String html = templates.process(\"mail/srs/action\", context);\n        String plain = \"BeefCare\\n\\nXin chào \" + blankDefault(owner.getFullName(), \"bạn\") + \",\\n\\n\" + intro + \"\\n\\nXem lịch sử thanh toán: \" + actionUrl + \"\\n\";\n        return new OutboundEmail(owner.getEmail(), job.getSubject(), html, true, Instant.now(), plain);\n    }\n\n    private OutboundEmail cancel(EmailDeliveryJob job) {\n        job.setStatus(\"CANCELLED\");\n        job.setLeaseUntil(null);\n        return null;\n    }\n\n    private static String blankDefault(String value, String fallback) {\n        return value == null || value.isBlank() ? fallback : value.trim();\n    }\n\n    private static String trimTrailingSlash(String value) {\n        if (value == null) return \"\";\n        return value.replaceAll(\"/+$\", \"\");\n    }\n}"},"email-job-repository":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/repository/EmailDeliveryJobRepository.java","start":1,"end":30,"highlightStart":14,"highlightEnd":29,"scope":"Cả file","symbol":"EmailDeliveryJobRepository.java","code":"package vn.edu.fpt.beefcare.repository;\n\nimport java.time.Instant;\nimport java.util.List;\nimport org.springframework.data.domain.Pageable;\nimport org.springframework.data.jpa.repository.JpaRepository;\nimport org.springframework.data.jpa.repository.Modifying;\nimport org.springframework.data.jpa.repository.Query;\nimport org.springframework.data.repository.query.Param;\nimport org.springframework.stereotype.Repository;\nimport vn.edu.fpt.beefcare.domain.EmailDeliveryJob;\n\n@Repository\npublic interface EmailDeliveryJobRepository extends JpaRepository\u003cEmailDeliveryJob, Long> {\n    java.util.Optional\u003cEmailDeliveryJob> findByEventKey(String eventKey);\n    long countByRecipientIgnoreCaseAndTemplateKeyAndCreatedAtAfter(String recipient, String templateKey, Instant after);\n\n    boolean existsByRecipientIgnoreCaseAndTemplateKeyAndLinkSourceIdAndContextRoleAndContextName(\n        String recipient, String templateKey, Long linkSourceId, String contextRole, String contextName);\n\n    List\u003cEmailDeliveryJob> findByStatusAndAvailableAtLessThanEqualOrderByCreatedAtAsc(String status, Instant now, Pageable pageable);\n\n    @Modifying\n    @Query(\"update EmailDeliveryJob j set j.leaseUntil = :leaseUntil, j.attempts = j.attempts + 1 where j.id = :id and j.status = 'PENDING' and j.availableAt \u003c= :now and (j.leaseUntil is null or j.leaseUntil \u003c= :now)\")\n    int claim(@Param(\"id\") Long id, @Param(\"now\") Instant now, @Param(\"leaseUntil\") Instant leaseUntil);\n\n    @Modifying\n    @Query(\"update EmailDeliveryJob j set j.status = 'CANCELLED', j.leaseUntil = null where j.linkSource = :source and j.linkSourceId = :sourceId and j.status = 'PENDING'\")\n    int cancelForLink(@Param(\"source\") String source, @Param(\"sourceId\") Long sourceId);\n}"},"authority-repository":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/repository/AuthorityRepository.java","start":1,"end":12,"highlightStart":1,"highlightEnd":12,"scope":"Cả file","symbol":"AuthorityRepository.java","code":"package vn.edu.fpt.beefcare.repository;\n\nimport org.springframework.data.jpa.repository.*;\nimport org.springframework.stereotype.Repository;\nimport vn.edu.fpt.beefcare.domain.Authority;\n\n/**\n * Spring Data JPA repository for the Authority entity.\n */\n@SuppressWarnings(\"unused\")\n@Repository\npublic interface AuthorityRepository extends JpaRepository\u003cAuthority, String> {}"},"platform-staff-repository":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/repository/PlatformStaffAccessRepository.java","start":1,"end":49,"highlightStart":16,"highlightEnd":48,"scope":"Cả file","symbol":"PlatformStaffAccessRepository.java","code":"package vn.edu.fpt.beefcare.repository;\n\nimport org.springframework.data.jpa.repository.*;\nimport org.springframework.stereotype.Repository;\nimport jakarta.persistence.LockModeType;\nimport org.springframework.data.repository.query.Param;\nimport java.util.List;\nimport java.util.Optional;\nimport vn.edu.fpt.beefcare.domain.PlatformStaffAccess;\n\n/**\n * Spring Data JPA repository for the PlatformStaffAccess entity.\n */\n@SuppressWarnings(\"unused\")\n@Repository\npublic interface PlatformStaffAccessRepository extends JpaRepository\u003cPlatformStaffAccess, Long> {\n    Optional\u003cPlatformStaffAccess> findOneByUserId(Long userId);\n\n    Optional\u003cPlatformStaffAccess> findOneByUserIdAndStatusIgnoreCase(Long userId, String status);\n\n    List\u003cPlatformStaffAccess> findAllByRoleIgnoreCaseAndStatusIgnoreCase(String role, String status);\n\n    long countByRoleIgnoreCaseAndStatusIgnoreCase(String role, String status);\n\n    @Lock(LockModeType.PESSIMISTIC_WRITE)\n    @Query(\"select a from PlatformStaffAccess a where a.user.id = :userId\")\n    Optional\u003cPlatformStaffAccess> findOneByUserIdForUpdate(@Param(\"userId\") Long userId);\n\n    @Lock(LockModeType.PESSIMISTIC_WRITE)\n    List\u003cPlatformStaffAccess> findAllByRoleIgnoreCaseAndStatusIgnoreCaseOrderById(String role, String status);\n\n    /**\n     * BR-D06 (D32): ACTIVE SA access held by an ACTIVE account other than {@code excludedUserId}. A scalar query reads the\n     * committed rows, not accounts already loaded in the persistence context, so it sees a change that committed while\n     * this transaction waited for its row locks.\n     */\n    @Query(\n        \"select count(a) from PlatformStaffAccess a where upper(a.role) = 'SA' and upper(a.status) = 'ACTIVE' \" +\n        \"and upper(a.user.accountStatus) = 'ACTIVE' and a.user.id \u003c> :excludedUserId\"\n    )\n    long countOtherActiveAdministrators(@Param(\"excludedUserId\") Long excludedUserId);\n\n    /** Whether {@code userId} still holds ACTIVE SA access on an ACTIVE account, read from the database (D32). */\n    @Query(\n        \"select count(a) > 0 from PlatformStaffAccess a where upper(a.role) = 'SA' and upper(a.status) = 'ACTIVE' \" +\n        \"and upper(a.user.accountStatus) = 'ACTIVE' and a.user.id = :userId\"\n    )\n    boolean isActiveAdministrator(@Param(\"userId\") Long userId);\n}"},"account-link-token-entity":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/domain/AccountLinkToken.java","start":1,"end":64,"highlightStart":11,"highlightEnd":64,"scope":"Cả entity","symbol":"AccountLinkToken","code":"package vn.edu.fpt.beefcare.domain;\n\nimport com.fasterxml.jackson.annotation.JsonIgnore;\nimport jakarta.persistence.*;\nimport jakarta.validation.constraints.NotNull;\nimport jakarta.validation.constraints.Size;\nimport java.time.Instant;\n\n/** Opaque account links are persisted only as cryptographic digests. */\n@Entity\n@Table(name = \"account_link_token\")\npublic class AccountLinkToken {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.SEQUENCE, generator = \"sequenceGenerator\")\n    @SequenceGenerator(name = \"sequenceGenerator\")\n    private Long id;\n\n    @NotNull\n    @Size(min = 64, max = 64)\n    @Column(name = \"token_hash\", length = 64, nullable = false, unique = true)\n    private String tokenHash;\n\n    @JsonIgnore\n    @Size(max = 64)\n    @Column(name = \"token_nonce\", length = 64)\n    private String tokenNonce;\n\n    @NotNull\n    @Size(max = 30)\n    @Column(name = \"token_type\", length = 30, nullable = false)\n    private String tokenType;\n\n    @NotNull\n    @Column(name = \"created_at\", nullable = false)\n    private Instant createdAt;\n\n    @NotNull\n    @Column(name = \"expires_at\", nullable = false)\n    private Instant expiresAt;\n\n    @Column(name = \"used_at\")\n    private Instant usedAt;\n\n    @ManyToOne(fetch = FetchType.LAZY, optional = false)\n    @JoinColumn(name = \"user_id\", nullable = false)\n    private User user;\n\n    public Long getId() { return id; }\n    public String getTokenHash() { return tokenHash; }\n    public void setTokenHash(String tokenHash) { this.tokenHash = tokenHash; }\n    public String getTokenNonce() { return tokenNonce; }\n    public void setTokenNonce(String tokenNonce) { this.tokenNonce = tokenNonce; }\n    public String getTokenType() { return tokenType; }\n    public void setTokenType(String tokenType) { this.tokenType = tokenType; }\n    public Instant getCreatedAt() { return createdAt; }\n    public void setCreatedAt(Instant createdAt) { this.createdAt = createdAt; }\n    public Instant getExpiresAt() { return expiresAt; }\n    public void setExpiresAt(Instant expiresAt) { this.expiresAt = expiresAt; }\n    public Instant getUsedAt() { return usedAt; }\n    public void setUsedAt(Instant usedAt) { this.usedAt = usedAt; }\n    public User getUser() { return user; }\n    public tRole() { return contextRole; }\n    public void setContextRole(String contextRole) { this.contextRole = contextRole; }\n    public Instant getCreatedAt() { return createdAt; }\n    public void setCreatedAt(Instant createdAt) { this.createdAt = createdAt; }\n    public Instant getAvailableAt() { return availableAt; }\n    public void setAvailableAt(Instant availableAt) { this.availableAt = availableAt; }\n    public Instant getLeaseUntil() { return leaseUntil; }\n    public void setLeaseUntil(Instant leaseUntil) { this.leaseUntil = leaseUntil; }\n    public String getStatus() { return status; }\n    public void setStatus(String status) { this.status = status; }\n    public int getAttempts() { return attempts; }\n    public void setAttempts(int attempts) { this.attempts = attempts; }\n    public String getLastError() { return lastError; }\n    public void setLastError(String lastError) { this.lastError = lastError; }\n    public Instant getSentAt() { return sentAt; }\n    public void setSentAt(Instant sentAt) { this.sentAt = sentAt; }\n    public String getEventKey() { return eventKey; }\n    public void setEventKey(String eventKey) { this.eventKey = eventKey; }\n    public Integer getVersion() { return version; }\n    public void setVersion(Integer version) { this.version = version; }\n}"},"user-entity":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/domain/User.java","start":1,"end":254,"highlightStart":20,"highlightEnd":254,"scope":"Cả entity","symbol":"User","code":"package vn.edu.fpt.beefcare.domain;\n\nimport com.fasterxml.jackson.annotation.JsonIgnore;\nimport jakarta.persistence.*;\nimport jakarta.validation.constraints.Email;\nimport jakarta.validation.constraints.NotNull;\nimport jakarta.validation.constraints.Pattern;\nimport jakarta.validation.constraints.Size;\nimport java.io.Serial;\nimport java.io.Serializable;\nimport java.time.Instant;\nimport java.util.HashSet;\nimport java.util.Locale;\nimport java.util.Set;\nimport org.apache.commons.lang3.StringUtils;\nimport org.hibernate.annotations.BatchSize;\nimport vn.edu.fpt.beefcare.config.Constants;\n\n/**\n * A user.\n */\n@Entity\n@Table(name = \"jhi_user\")\npublic class User extends AbstractAuditingEntity\u003cLong> implements Serializable {\n\n    @Serial\n    private static final long serialVersionUID = 1L;\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.SEQUENCE, generator = \"sequenceGenerator\")\n    @SequenceGenerator(name = \"sequenceGenerator\")\n    @Column(name = \"id\")\n    private Long id;\n\n    @NotNull\n    @Pattern(regexp = Constants.LOGIN_REGEX)\n    @Size(min = 1, max = 50)\n    @Column(name = \"login\", length = 50, unique = true, nullable = false)\n    private String login;\n\n    @JsonIgnore\n    @NotNull\n    @Size(min = 60, max = 60)\n    @Column(name = \"password_hash\", length = 60, nullable = false)\n    private String password;\n\n    @Size(max = 50)\n    @Column(name = \"first_name\", length = 50)\n    private String firstName;\n\n    @Size(max = 50)\n    @Column(name = \"last_name\", length = 50)\n    private String lastName;\n\n    @Email\n    @Size(min = 5, max = 254)\n    @Column(name = \"email\", length = 254, unique = true)\n    private String email;\n\n    @NotNull\n    @Column(name = \"activated\", nullable = false)\n    private boolean activated = false;\n\n    @NotNull\n    @Column(name = \"failed_password_attempts\", nullable = false)\n    private int failedPasswordAttempts;\n\n    @Column(name = \"password_locked_until\")\n    private Instant passwordLockedUntil;\n\n    @Size(min = 2, max = 10)\n    @Column(name = \"lang_key\", length = 10)\n    private String langKey;\n\n    @Size(max = 256)\n    @Column(name = \"image_url\", length = 256)\n    private String imageUrl;\n\n    @Size(max = 20)\n    @Column(name = \"activation_key\", length = 20)\n    @JsonIgnore\n    private String activationKey;\n\n    @Size(max = 20)\n    @Column(name = \"reset_key\", length = 20)\n    @JsonIgnore\n    private String resetKey;\n\n    @Column(name = \"reset_date\")\n    private Instant resetDate = null;\n\n    @JsonIgnore\n    @ManyToMany\n    @JoinTable(\n        name = \"jhi_user_authority\",\n        joinColumns = { @JoinColumn(name = \"user_id\", referencedColumnName = \"id\") },\n        inverseJoinColumns = { @JoinColumn(name = \"authority_name\", referencedColumnName = \"name\") }\n    )\n    @BatchSize(size = 20)\n    private Set\u003cAuthority> authorities = new HashSet\u003c>();\n\n    public Long getId() {\n        return id;\n    }\n\n    public void setId(Long id) {\n        this.id = id;\n    }\n\n    public String getLogin() {\n        return login;\n    }\n\n    // Lowercase the login before saving it in database\n    public void setLogin(String login) {\n        this.login = StringUtils.lowerCase(login, Locale.ENGLISH);\n    }\n\n    public String getPassword() {\n        return password;\n    }\n\n    public void setPassword(String password) {\n        this.password = password;\n    }\n\n    public String getFirstName() {\n        return firstName;\n    }\n\n    public void setFirstName(String firstName) {\n        this.firstName = firstName;\n    }\n\n    public String getLastName() {\n        return lastName;\n    }\n\n    public void setLastName(String lastName) {\n        this.lastName = lastName;\n    }\n\n    public String getEmail() {\n        return email;\n    }\n\n    public void setEmail(String email) {\n        this.email = email;\n    }\n\n    public String getImageUrl() {\n        return imageUrl;\n    }\n\n    public void setImageUrl(String imageUrl) {\n        this.imageUrl = imageUrl;\n    }\n\n    public boolean isActivated() {\n        return activated;\n    }\n\n    public void setActivated(boolean activated) {\n        this.activated = activated;\n    }\n\n    public int getFailedPasswordAttempts() {\n        return failedPasswordAttempts;\n    }\n\n    public void setFailedPasswordAttempts(int failedPasswordAttempts) {\n        this.failedPasswordAttempts = failedPasswordAttempts;\n    }\n\n    public Instant getPasswordLockedUntil() {\n        return passwordLockedUntil;\n    }\n\n    public void setPasswordLockedUntil(Instant passwordLockedUntil) {\n        this.passwordLockedUntil = passwordLockedUntil;\n    }\n\n    public String getActivationKey() {\n        return activationKey;\n    }\n\n    public void setActivationKey(String activationKey) {\n        this.activationKey = activationKey;\n    }\n\n    public String getResetKey() {\n        return resetKey;\n    }\n\n    public void setResetKey(String resetKey) {\n        this.resetKey = resetKey;\n    }\n\n    public Instant getResetDate() {\n        return resetDate;\n    }\n\n    public void setResetDate(Instant resetDate) {\n        this.resetDate = resetDate;\n    }\n\n    public String getLangKey() {\n        return langKey;\n    }\n\n    public void setLangKey(String langKey) {\n        this.langKey = langKey;\n    }\n\n    public Set\u003cAuthority> getAuthorities() {\n        return authorities;\n    }\n\n    public void setAuthorities(Set\u003cAuthority> authorities) {\n        this.authorities = authorities;\n    }\n\n    @Override\n    public boolean equals(Object o) {\n        if (this == o) {\n            return true;\n        }\n        if (!(o instanceof User)) {\n            return false;\n        }\n        return id != null && id.equals(((User) o).id);\n    }\n\n    @Override\n    public int hashCode() {\n        // see https://vladmihalcea.com/how-to-implement-equals-and-hashcode-using-the-jpa-entity-identifier/\n        return getClass().hashCode();\n    }\n\n    // prettier-ignore\n    @Override\n    public String toString() {\n        return \"User{\" +\n            \"login='\" + login + '\\'' +\n            \", firstName='\" + firstName + '\\'' +\n            \", lastName='\" + lastName + '\\'' +\n            \", email='\" + email + '\\'' +\n            \", imageUrl='\" + imageUrl + '\\'' +\n            \", activated='\" + activated + '\\'' +\n            \", langKey='\" + langKey + '\\'' +\n            \", activationKey='\" + activationKey + '\\'' +\n            \"}\";\n    }\n}"},"app-user-entity":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/domain/AppUser.java","start":1,"end":360,"highlightStart":19,"highlightEnd":360,"scope":"Cả entity","symbol":"AppUser","code":"package vn.edu.fpt.beefcare.domain;\n\nimport com.fasterxml.jackson.annotation.JsonIgnoreProperties;\nimport com.fasterxml.jackson.annotation.JsonIgnore;\nimport io.swagger.v3.oas.annotations.media.Schema;\nimport jakarta.persistence.*;\nimport jakarta.validation.constraints.*;\nimport java.io.Serial;\nimport java.io.Serializable;\nimport java.time.Instant;\n\n/**\n * User (gộp User Identity, Password Credential, Password Reset Token). Đặt tên AppUser để không trùng User có sẵn của JHipster.\n */\n@Schema(\n    description = \"User (gộp User Identity, Password Credential, Password Reset Token). Đặt tên AppUser để không trùng User có sẵn của JHipster.\"\n)\n@Entity\n@Table(name = \"app_user\")\n@SuppressWarnings(\"common-java:DuplicatedBlocks\")\npublic class AppUser implements Serializable {\n\n    @Serial\n    private static final long serialVersionUID = 1L;\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.SEQUENCE, generator = \"sequenceGenerator\")\n    @SequenceGenerator(name = \"sequenceGenerator\")\n    @Column(name = \"id\")\n    private Long id;\n\n    @NotNull\n    @Size(max = 255)\n    @Column(name = \"email\", length = 255, nullable = false, unique = true)\n    private String email;\n\n    @NotNull\n    @Size(max = 255)\n    @Column(name = \"full_name\", length = 255, nullable = false)\n    private String fullName;\n\n    @Size(max = 255)\n    @Column(name = \"phone\", length = 255)\n    private String phone;\n\n    @NotNull\n    @Size(max = 30)\n    @Column(name = \"account_status\", length = 30, nullable = false)\n    private String accountStatus;\n\n    /**\n     * ERD: NOT NULL; để trống được vì

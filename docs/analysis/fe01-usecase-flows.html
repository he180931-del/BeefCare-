  : failure.getClass().getSimpleName();\n            LOG.warn(\"Google sign-in was rejected [{}]\", reason);\n            response.sendRedirect(frontendBaseUrl + \"/sign-in?error=google-sign-in\");\n        }\n    }\n}"},"session-provider":{"file":"frontend/src/app/session/SessionProvider.tsx","start":19,"end":68,"highlightStart":25,"highlightEnd":63,"scope":"Cả hàm component","symbol":"SessionProvider()","code":"export function SessionProvider({ children }: { children: ReactNode }) {\n  const { mode, logout } = useAuth()\n  const { loadSessionProfile } = useAuthenticationUseCase()\n  const [user, setUser] = useState\u003cSessionUser | null>(null)\n  const [error, setError] = useState('')\n\n  useEffect(() => {\n    let active = true\n    if (mode === 'mock') {\n      // Same rule as the server profile: the demo user names its farm only once this tab has entered one.\n      const user = demo.demoUsers.demoUserFor(demo.demoUsers.readMockUserEmail())\n      const farmCount = user.farmId == null ? 0 : 1\n      const farmRoles = user.farmId == null ? {} : { [user.farmId]: user.role }\n      setUser(readCurrentFarmId() == null ? { ...user, farmId: null, farmName: null, farmCount, farmRoles } : { ...user, farmCount, farmRoles })\n      return undefined\n    }\n    const loadProfile = () => loadSessionProfile().then(\n      (profile) => {\n        if (!active) return\n        // Every feature API of this page already points at the stale farm, so forget it and reload into Select Farm.\n        // Reload only once the stale id is really gone, so a storage that refuses to forget it cannot loop.\n        if (isStaleFarmSelection(profile, readCurrentFarmId())) {\n          clearCurrentFarmId()\n          if (readCurrentFarmId() == null) {\n            pageLoader.load('/chon-trai')\n            return\n          }\n        }\n        setUser(sessionFromProfile(profile, readCurrentFarmId()))\n      },\n      (cause: unknown) => { if (active) setError(userFacingError(cause, 'Không tải được hồ sơ người dùng.')) },\n    )\n    void loadProfile()\n    const markCompleted = () => {\n      setUser((current) => current ? markOwnerRegistrationCompleted(current) : current)\n      void loadProfile()\n    }\n    window.addEventListener(OWNER_REGISTRATION_COMPLETED_EVENT, markCompleted)\n    return () => {\n      active = false\n      window.removeEventListener(OWNER_REGISTRATION_COMPLETED_EVENT, markCompleted)\n    }\n  }, [loadSessionProfile, mode])\n\n  const session = useMemo\u003cSession | null>(() => user && { ...user, logout }, [user, logout])\n\n  if (error) return \u003cdiv role=\"alert\" className=\"grid min-h-screen place-items-center px-4 text-center text-sm text-err-fg\">{error}\u003c/div>\n  if (!session) return \u003cdiv className=\"grid min-h-screen place-items-center text-sm text-subtle\">Đang tải hồ sơ…\u003c/div>\n  return \u003cSessionContext.Provider value={session}>{children}\u003c/SessionContext.Provider>\n}"},"session-route":{"file":"frontend/src/features/authorization/roles.ts","start":18,"end":43,"highlightStart":38,"highlightEnd":43,"scope":"Cả nhóm hàm điều hướng","symbol":"needsOwnerRegistration() + homePathForSession()","code":"/**\n * UC-FE01-02 step 6 / AF4: Complete Owner Profile is the destination only for an account that has no farm and no\n * platform role. A Manager or Technician who joined by invitation enters their farm (UC-FE03-04, D28).\n */\nexport const needsOwnerRegistration = (session: SessionUser | null | undefined): boolean =>\n  session?.ownerRegistrationCompleted === false && (session.farmCount ?? (session.farmId == null ? 0 : 1)) === 0 && !session.platformRole\n\nexport { isFarmRole }\n\nexport function homePathFor(role: AppRole): string {\n  switch (role) {\n    case 'TECHNICIAN': return '/kt'\n    case 'CS': return '/nen-tang/ho-tro'\n    case 'PM': return '/nen-tang/dich-vu'\n    case 'SA': return '/nen-tang/tai-khoan'\n    default: return '/tong-quan'\n  }\n}\n\n/** SCR-02 priority after a successful sign-in; requested/invitation routes are retained by the router before this is reached. */\nexport function homePathForSession(session: SessionUser): string {\n  if (needsOwnerRegistration(session)) return '/owner-registration'\n  if (session.platformRole || ['CS', 'PM', 'SA'].includes(session.role)) return homePathFor(session.role)\n  if ((session.activeFarmCount ?? (session.farmId == null ? 0 : 1)) !== 1) return '/chon-trai'\n  return homePathFor(session.role)\n}"},"technician-account":{"file":"frontend/src/features/account/pages/TechnicianAccountPage.tsx","start":14,"end":52,"highlightStart":21,"highlightEnd":23,"scope":"Cả hàm component","symbol":"TechnicianAccountPage()","code":"export default function TechnicianAccountPage() {\n  const session = useSession()\n  const { identity, data, loading, error, refetch } = useAccountProfile()\n  const [m, openModal, closeModal] = useModalParam()\n  const [search] = useSearchParams()\n  const { pathname } = useLocation()\n  const [notice, setNotice] = useState\u003cstring | null>(null)\n  const [signingOut, setSigningOut] = useState(false)\n  const form = useProfileForm(data, identity, async (_saved, message) => { setNotice(message); await refetch() })\n  const signOut = async () => { setSigningOut(true); try { await session?.logout() } finally { setSigningOut(false) } }\n\n  return (\n    \u003cTechnicianLayout title=\"Tài khoản\">\n      {notice && \u003cNote tone=\"ok\">{notice}\u003c/Note>}\n      {loading && !data && \u003cLoadingBlock />}\n      {Boolean(error) && !data && \u003cErrorBlock message={userFacingError(error, 'Không tải được tài khoản.')} onRetry={refetch} />}\n      \u003csection className=\"flex items-center gap-3 rounded-md border border-edge bg-white p-4\">\n        \u003cAvatar name={identity.fullName} />\n        \u003cdiv className=\"min-w-0\">\u003cdiv className=\"text-base font-semibold text-[#212121]\">{identity.fullName}\u003c/div>\u003cdiv className=\"text-xs text-muted\">{roleAtFarm(identity.role, identity.farmName)}\u003c/div>\u003c/div>\n      \u003c/section>\n      {data && (\n        \u003cform onSubmit={form.submit} noValidate className=\"flex flex-col gap-3 rounded-md border border-edge bg-white p-4 text-[13px]\">\n          \u003cField label=\"Thư điện tử đăng nhập\" id=\"technician-email\">\u003cinput id=\"technician-email\" readOnly value={data.email} className={`${inputCls} bg-chip text-muted`} />\u003c/Field>\n          \u003cField label=\"Họ và tên *\" id=\"technician-name\">\u003cinput id=\"technician-name\" autoComplete=\"name\" maxLength={100} value={form.values.fullName} onChange={(event) => form.setValues({ ...form.values, fullName: event.target.value })} className={inputCls} />{form.errors.fullName && \u003cspan className=\"text-xs text-err-fg\">{form.errors.fullName}\u003c/span>}\u003c/Field>\n          \u003cField label=\"Điện thoại liên hệ\" id=\"technician-phone\">\u003cinput id=\"technician-phone\" type=\"tel\" autoComplete=\"tel\" value={form.values.phone} onChange={(event) => form.setValues({ ...form.values, phone: event.target.value })} className={inputCls} />{form.errors.phone && \u003cspan className=\"text-xs text-err-fg\">{form.errors.phone}\u003c/span>}\u003c/Field>\n          \u003cKV k=\"Trang trại\">{identity.farmName ?? '—'}\u003c/KV>\n          \u003cKV k=\"Vai trò\">Kỹ thuật viên\u003c/KV>\n          {form.error && \u003cNote tone=\"err\">{form.error}\u003c/Note>}\n          \u003cButton type=\"submit\" disabled={form.saving}>{form.saving ? 'Đang lưu…' : 'Lưu hồ sơ'}\u003c/Button>\n        \u003c/form>\n      )}\n      \u003cdiv className=\"flex flex-col gap-2\">\n        {data && \u003cButton block onClick={() => openModal('doi-mat-khau')}>\u003cIcon name=\"lock\" size={16} />{data.passwordSignInEnabled ? 'Đổi mật khẩu' : 'Thêm mật khẩu'}\u003c/Button>}\n        \u003cButton block variant=\"danger\" onClick={signOut} disabled={signingOut || !session}>\u003cIcon name=\"logout\" size={16} />Đăng xuất\u003c/Button>\n      \u003c/div>\n      {m === 'doi-mat-khau' && data && \u003cChangePasswordDialog identity={identity} profile={data} returnTo={pathname} googleReauthenticated={search.get('googleReauthenticated') === 'true'} onClose={closeModal} onChanged={(message) => { setNotice(message); closeModal(); void refetch() }} />}\n    \u003c/TechnicianLayout>\n  )\n}"},"auth-provider-logout":{"file":"frontend/src/features/authentication/AuthContext.tsx","start":33,"end":94,"highlightStart":63,"highlightEnd":80,"scope":"Cả hàm component","symbol":"AuthProvider()","code":"export function AuthProvider({ client = defaultAuthClient, children }: { client?: AuthClient; children: ReactNode }) {\n  const auth = useAuthenticationUseCase(client)\n  const [status, setStatus] = useState\u003c'checking' | 'anonymous' | 'authenticated' | 'suspended'>('checking')\n  const [error, setError] = useState\u003cstring | null>(null)\n  const hasRouter = useInRouterContext()\n  const expireSession = useCallback(() => {\n    clearCurrentFarmId()\n    setError('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.')\n    setStatus('anonymous')\n  }, [])\n\n  useEffect(() => {\n    let active = true\n    setStatus('checking')\n    setError(null)\n    auth.isAuthenticated().then((ok) => {\n      if (active) setStatus(ok ? 'authenticated' : 'anonymous')\n    }).catch((reason: unknown) => {\n      if (active) {\n        if (reason instanceof BackendError && reason.code === 'MSG-FE01-03') {\n          setStatus('suspended')\n        } else {\n          setError('Không thể kiểm tra phiên đăng nhập với máy chủ. Hãy thử đăng nhập lại hoặc kiểm tra kết nối.')\n          setStatus('anonymous')\n        }\n      }\n    })\n    return () => { active = false }\n  }, [auth])\n\n  const value = useMemo\u003cAuthContextValue>(() => ({\n    authenticated: status === 'authenticated',\n    mode: client.mode ?? 'backend',\n    logout: async () => {\n      let logoutFailed = false\n      try {\n        await auth.logout()\n      } catch {\n        logoutFailed = true\n      }\n      clearCurrentFarmId()\n      setError(logoutFailed\n        ? 'Không thể xác nhận đăng xuất với máy chủ. Phiên trên thiết bị này đã được xóa; bạn có thể đăng nhập lại.'\n        : null)\n      notifySessionSignedOut()\n      setStatus('anonymous')\n    },\n  }), [auth, client, status])\n\n  if (status === 'checking') return \u003cdiv className=\"grid min-h-screen place-items-center text-sm text-subtle\">Đang kiểm tra phiên đăng nhập…\u003c/div>\n  return (\n    \u003cAuthContext.Provider value={value}>\n      {status === 'authenticated' && hasRouter && \u003cSessionRedirect onExpired={expireSession} />}\n      {status === 'authenticated' && hasRouter && \u003cInvitationResume />}\n      {status === 'authenticated'\n        ? children\n        : hasRouter\n          ? \u003cGuestAuthFlow client={client} initialError={error} forceSuspended={status === 'suspended'} onExitSuspended={() => { setError(null); setStatus('anonymous') }} onAuthenticated={() => setStatus('authenticated')} />\n          : \u003cLegacyLoginForm client={client} initialError={error} onSuccess={() => setStatus('authenticated')} />}\n    \u003c/AuthContext.Provider>\n  )\n}"},"authentication-usecase":{"file":"frontend/src/features/authentication/hooks/useAuthenticationUseCase.ts","start":1,"end":21,"highlightStart":11,"highlightEnd":20,"scope":"Cả file","symbol":"useAuthenticationUseCase.ts","code":"import { useMemo } from 'react'\nimport { backendTransport } from '../../../shared/api/backendTransport'\nimport { defaultAuthClient } from '../client'\nimport type { AuthClient } from '../types'\n\n/**\n * Feature-owned orchestration boundary for authentication and the signed-in\n * session profile.  Pages/providers keep navigation and view state here, but\n * do not reach the transport or client directly.\n */\nexport function useAuthenticationUseCase(client: AuthClient = defaultAuthClient) {\n  return useMemo(() => ({\n    client,\n    isAuthenticated: () => client.isAuthenticated(),\n    logout: () => client.logout(),\n    loadSessionProfile: () => backendTransport.get('/api/account/profile'),\n    requestPasswordReset: client.requestPasswordReset,\n    validatePasswordReset: client.validatePasswordReset,\n    resetPassword: client.resetPassword,\n  }), [client])\n}"},"backend-client-logout":{"file":"frontend/src/shared/api/backendClient.ts","start":55,"end":141,"highlightStart":114,"highlightEnd":122,"scope":"Cả hàm","symbol":"createBackendClient() · logout","code":"export function createBackendClient({ baseUrl = '', fetchImpl = globalThis.fetch, newKey = () => globalThis.crypto.randomUUID(), onUnauthorized }: ClientOptions = {}) {\n  let csrfToken: string | undefined\n  let csrfHeader = 'X-XSRF-TOKEN'\n  const pathUrl = (path: string): string => {\n    if (!path.startsWith('/api/')) throw new TypeError('Use a relative /api/ path')\n    return `${baseUrl.replace(/\\/$/, '')}${path}`\n  }\n  async function responseBody(response: Response): Promise\u003cunknown> {\n    if (response.status === 204) return undefined\n    const contentType = response.headers.get('content-type') || ''\n    if (contentType.includes('json')) return response.json()\n    if (!response.ok) return { message: await response.text() }\n    return response.blob()\n  }\n  async function getCsrf(): Promise\u003cCsrfBody> {\n    const response = await fetchImpl(pathUrl('/api/csrf'), { credentials: 'include', headers: { Accept: 'application/json' } })\n    const body = await responseBody(response)\n    if (!response.ok) throw new BackendError(response.status, body)\n    const csrf = errorBody(body) as ErrorBody & Partial\u003cCsrfBody>\n    if (!csrf.token) throw new Error('Backend did not return a CSRF token')\n    csrfToken = csrf.token\n    csrfHeader = csrf.headerName || 'X-XSRF-TOKEN'\n    return { token: csrf.token, headerName: csrf.headerName }\n  }\n  async function request\u003cT = unknown>(path: string, { method = 'GET', body, key, signal, headers = {} }: RequestOptions = {}, retried = false): Promise\u003cT> {\n    if (path.startsWith(NO_FARM_PATH)) throw new NoActiveFarmError()\n    const changing = !['GET', 'HEAD', 'OPTIONS'].includes(method.toUpperCase())\n    if (changing && !csrfToken) await getCsrf()\n    const multipart = typeof FormData !== 'undefined' && body instanceof FormData\n    const actualHeaders: Record\u003cstring, string> = { Accept: 'application/json', ...headers }\n    if (body !== undefined && !multipart) actualHeaders['Content-Type'] = 'application/json'\n    if (changing && csrfToken) actualHeaders[csrfHeader] = csrfToken\n    if (key) actualHeaders['Idempotency-Key'] = key\n    const response = await fetchImpl(pathUrl(path), {\n      method, credentials: 'include', headers: actualHeaders,\n      body: body === undefined ? undefined : multipart ? body : JSON.stringify(body), signal,\n    })\n    const result = await responseBody(response)\n    if (response.status === 401) onUnauthorized?.()\n    // A 403 without a domain code is the CSRF filter: the token belongs to an earlier session (another client in the\n    // same tab signed out / in). Refresh it and resend once with the same Idempotency-Key; a domain 403 (MSG-COM-01) stays.\n    if (response.status === 403 && changing && !retried && !new BackendError(403, result).code) {\n      csrfToken = undefined\n      await getCsrf()\n      return request\u003cT>(path, { method, body, key, signal, headers }, true)\n    }\n    if (!response.ok) throw new BackendError(response.status, result)\n    return result as T\n  }\n  return {\n    request,\n    getCsrf,\n    newCommandKey: newKey,\n    async login(username: string, password: string, rememberMe = false) {\n      await getCsrf()\n      await request('/api/authenticate', { method: 'POST', body: { username, password, rememberMe } })\n      csrfToken = undefined\n      await getCsrf()\n    },\n    async logout() {\n      try {\n        await request('/api/logout', { method: 'POST' })\n      } catch (error) {\n        if (!(error instanceof BackendError && error.status === 401)) throw error\n      } finally {\n        csrfToken = undefined\n      }\n    },\n    async isAuthenticated() {\n      try {\n        await request('/api/authenticate')\n        return true\n      } catch (error) {\n        if (error instanceof BackendError && error.status === 401) return false\n        throw error\n      }\n    },\n    get: \u003cT = unknown>(path: string, options?: RequestOptions) => request\u003cT>(path, options),\n    // Keep this key for a retry after a timeout; generate a new key only for a new user action.\n    command: \u003cT = unknown>(path: string, body: unknown, { method = 'POST', key = newKey(), ...options }: RequestOptions = {}) => request\u003cT>(path, { ...options, method, body, key }),\n    farmPath: (farmId: string | number | null, suffix = '') => {\n      if (farmId == null) return `${NO_FARM_PATH}${suffix}`\n      if (!/^\\d+$/.test(String(farmId))) throw new TypeError('farmId must be the backend numeric ID')\n      return `/api/farms/${farmId}${suffix}`\n    },\n  }\n}"},"security-logout":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/config/SecurityConfiguration.java","start":78,"end":151,"highlightStart":138,"highlightEnd":145,"scope":"Cả hàm cấu hình","symbol":"filterChain()","code":"    public SecurityFilterChain filterChain(\n        HttpSecurity http,\n        FarmAccessService farmAccessService,\n        SessionRegistry sessionRegistry,\n        vn.edu.fpt.beefcare.security.GoogleOidcSuccessHandler googleSuccessHandler,\n        vn.edu.fpt.beefcare.security.GoogleOidcFailureHandler googleFailureHandler\n    ) throws Exception {\n        CookieCsrfTokenRepository csrfRepository = CookieCsrfTokenRepository.withHttpOnlyFalse();\n        csrfRepository.setCookiePath(\"/\");\n        csrfRepository.setCookieCustomizer(cookie -> cookie.secure(secureCookies).sameSite(cookieSameSite));\n        CsrfTokenRequestAttributeHandler csrfRequestHandler = new CsrfTokenRequestAttributeHandler();\n\n        http.cors(withDefaults())\n            .csrf(csrf -> csrf.csrfTokenRepository(csrfRepository).csrfTokenRequestHandler(csrfRequestHandler)\n                .ignoringRequestMatchers(\"/api/webhooks/sepay\", \"/api/v1/payments/sepay/webhook\"))\n            .addFilterAfter(new SpaWebFilter(), AnonymousAuthenticationFilter.class)\n            .addFilterAfter(new ActiveAccountFilter(farmAccessService, sessionRegistry), AnonymousAuthenticationFilter.class)\n            .headers(headers ->\n                headers\n                    .contentSecurityPolicy(csp -> csp.policyDirectives(jHipsterProperties.getSecurity().getContentSecurityPolicy()))\n                    .frameOptions(FrameOptionsConfig::sameOrigin)\n                    .referrerPolicy(referrer -> referrer.policy(ReferrerPolicyHeaderWriter.ReferrerPolicy.STRICT_ORIGIN_WHEN_CROSS_ORIGIN))\n            )\n            .authorizeHttpRequests(authz ->\n                authz\n                    .requestMatchers(\"/index.html\", \"/*.js\", \"/*.txt\", \"/*.json\", \"/*.map\", \"/*.css\").permitAll()\n                    .requestMatchers(\"/*.ico\", \"/*.png\", \"/*.svg\", \"/*.webapp\").permitAll()\n                    .requestMatchers(\"/app/**\", \"/i18n/**\", \"/content/**\", \"/swagger-ui/**\").permitAll()\n                    .requestMatchers(HttpMethod.GET, \"/api/csrf\", \"/api/authenticate\").permitAll()\n                    .requestMatchers(HttpMethod.POST, \"/api/authenticate\", \"/api/register\", \"/api/account/reset-password/init\", \"/api/account/reset-password/finish\").permitAll()\n                    .requestMatchers(HttpMethod.POST, \"/api/account/verification/resend\").permitAll()\n                    .requestMatchers(HttpMethod.GET, \"/api/account/reset-password/validate\").permitAll()\n                    .requestMatchers(HttpMethod.GET, \"/api/activate\").permitAll()\n                    .requestMatchers(HttpMethod.POST, \"/api/logout\").authenticated()\n                    .requestMatchers(\"/api/account/**\").authenticated()\n                    .requestMatchers(\"/api/farms/**\").authenticated()\n                    .requestMatchers(HttpMethod.GET, \"/api/notifications/mine\").authenticated()\n                    .requestMatchers(HttpMethod.PUT, \"/api/notifications/read-all\").authenticated()\n                    .requestMatchers(HttpMethod.PUT, \"/api/notifications/*/read\").authenticated()\n                    .requestMatchers(\"/api/invitations/**\").authenticated()\n                    .requestMatchers(\"/api/platform/accounts/**\").authenticated()\n                    .requestMatchers(\"/api/platform/audit/**\").authenticated()\n                    .requestMatchers(\"/api/platform/plan-prices/**\").authenticated()\n                    .requestMatchers(\"/api/platform/payments/**\").authenticated()\n                    .requestMatchers(\"/api/platform/finance/**\").authenticated()\n                    .requestMatchers(\"/api/platform/farms/**\").authenticated()\n                    .requestMatchers(HttpMethod.GET, \"/api/platform/subscriptions\", \"/api/platform/subscriptions/*\").authenticated()\n                    .requestMatchers(HttpMethod.GET, \"/api/public/prices\").permitAll()\n                    .requestMatchers(HttpMethod.GET, \"/api/public/landing\").permitAll()\n                    .requestMatchers(HttpMethod.POST, \"/api/webhooks/sepay\", \"/api/v1/payments/sepay/webhook\").permitAll()\n                    .requestMatchers(\"/api/dev/sepay/**\").authenticated()\n                    .requestMatchers(\"/api/support/tickets/**\", \"/api/platform/support/tickets/**\", \"/api/platform/support/recipients\", \"/api/platform/internal-requests/**\").authenticated()\n                    .requestMatchers(\"/api/admin/**\").hasAuthority(AuthoritiesConstants.ADMIN)\n                    .requestMatchers(\"/v3/api-docs/**\").hasAuthority(AuthoritiesConstants.ADMIN)\n                    .requestMatchers(\"/management/health\", \"/management/health/**\", \"/management/info\", \"/management/prometheus\").permitAll()\n                    .requestMatchers(\"/management/**\").hasAuthority(AuthoritiesConstants.ADMIN)\n                    // Unfinished JHipster entity CRUD controllers and all other API routes are deliberately closed.\n                    .requestMatchers(\"/api/**\").denyAll()\n                    .anyRequest().permitAll()\n            )\n            .sessionManagement(session -> session.sessionCreationPolicy(SessionCreationPolicy.IF_REQUIRED))\n            .logout(logout ->\n                logout\n                    .logoutUrl(\"/api/logout\")\n                    .deleteCookies(\"JSESSIONID\", \"XSRF-TOKEN\")\n                    .invalidateHttpSession(true)\n                    .logoutSuccessHandler((request, response, authentication) -> response.setStatus(HttpServletResponse.SC_NO_CONTENT))\n            )\n            .exceptionHandling(exceptions -> exceptions.authenticationEntryPoint((request, response, exception) -> response.sendError(401)));\n\n        if (googleLoginEnabled) http.oauth2Login(oauth2 -> oauth2.successHandler(googleSuccessHandler).failureHandler(googleFailureHandler));\n\n        return http.build();\n    }"},"security-filter-chain":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/config/SecurityConfiguration.java","start":78,"end":151,"highlightStart":88,"highlightEnd":119,"scope":"Cả hàm cấu hình","symbol":"filterChain() · CSRF và authorization","code":"    public SecurityFilterChain filterChain(\n        HttpSecurity http,\n        FarmAccessService farmAccessService,\n        SessionRegistry sessionRegistry,\n        vn.edu.fpt.beefcare.security.GoogleOidcSuccessHandler googleSuccessHandler,\n        vn.edu.fpt.beefcare.security.GoogleOidcFailureHandler googleFailureHandler\n    ) throws Exception {\n        CookieCsrfTokenRepository csrfRepository = CookieCsrfTokenRepository.withHttpOnlyFalse();\n (\"/api/support/tickets/**\", \"/api/platform/support/tickets/**\", \"/api/platform/support/recipients\", \"/api/platform/internal-requests/**\").authenticated()\n                    .requestMatchers(\"/api/admin/**\").hasAuthority(AuthoritiesConstants.ADMIN)\n                    .requestMatchers(\"/v3/api-docs/**\").hasAuthority(AuthoritiesConstants.ADMIN)\n                    .requestMatchers(\"/management/health\", \"/management/health/**\", \"/management/info\", \"/management/prometheus\").permitAll()\n                    .requestMatchers(\"/management/**\").hasAuthority(AuthoritiesConstants.ADMIN)\n                    // Unfinished JHipster entity CRUD controllers and all other API routes are deliberately closed.\n                    .requestMatchers(\"/api/**\").denyAll()\n                    .anyRequest().permitAll()\n            )\n            .sessionManagement(session -> session.sessionCreationPolicy(SessionCreationPolicy.IF_REQUIRED))\n            .logout(logout ->\n                logout\n                    .logoutUrl(\"/api/logout\")\n                    .deleteCookies(\"JSESSIONID\", \"XSRF-TOKEN\")\n                    .invalidateHttpSession(true)\n                    .logoutSuccessHandler((request, response, authentication) -> response.setStatus(HttpServletResponse.SC_NO_CONTENT))\n            )\n            .exceptionHandling(exceptions -> exceptions.authenticationEntryPoint((request, response, exception) -> response.sendError(401)));\n\n        if (googleLoginEnabled) http.oauth2Login(oauth2 -> oauth2.successHandler(googleSuccessHandler).failureHandler(googleFailureHandler));\n\n        return http.build();\n    }"},"session-lifecycle":{"file":"frontend/src/app/session/sessionLifecycle.ts","start":1,"end":21,"highlightStart":5,"highlightEnd":14,"scope":"Cả file","symbol":"sessionLifecycle.ts","code":"// Session lifecycle events of the whole app. The 401 signal is raised by the shared HTTP client, so it lives in\n// `shared/api/sessionExpiry` and is re-exported here; sign-out is an app-level event.\nexport { SESSION_EXPIRED_EVENT, notifySessionExpired, onSessionExpired } from '../../shared/api/sessionExpiry'\n\nexport const SESSION_SIGNED_OUT_EVENT = 'beefcare:session-signed-out'\n\nexport function notifySessionSignedOut(): void {\n  window.dispatchEvent(new Event(SESSION_SIGNED_OUT_EVENT))\n}\n\nexport function onSessionSignedOut(listener: () => void): () => void {\n  window.addEventListener(SESSION_SIGNED_OUT_EVENT, listener)\n  return () => window.removeEventListener(SESSION_SIGNED_OUT_EVENT, listener)\n}\n\n/** The Owner profile was accepted (SCR-10): the session reloads the profile so routing sees the completed registration. */\nexport const OWNER_REGISTRATION_COMPLETED_EVENT = 'beefcare:owner-registration-completed'\n\nexport function notifyOwnerRegistrationCompleted(): void {\n  window.dispatchEvent(new Event(OWNER_REGISTRATION_COMPLETED_EVENT))\n}"},"session-redirect":{"file":"frontend/src/features/authentication/AuthContext.tsx","start":109,"end":125,"highlightStart":109,"highlightEnd":125,"scope":"Cả hàm","symbol":"SessionRedirect()","code":"function SessionRedirect({ onExpired }: { onExpired: () => void }) {\n  const navigate = useNavigate()\n  useEffect(() => {\n    const stopListeningForExpiry = onSessionExpired(() => {\n      onExpired()\n      navigate(AUTH_PATH.signIn, { replace: true })\n    })\n    const stopListeningForSignOut = onSessionSignedOut(() => {\n      navigate(AUTH_PATH.signIn, { replace: true })\n    })\n    return () => {\n      stopListeningForExpiry()\n      stopListeningForSignOut()\n    }\n  }, [navigate, onExpired])\n  return null\n}"},"clear-farm":{"file":"frontend/src/app/session/currentFarm.ts","start":51,"end":57,"highlightStart":51,"highlightEnd":57,"scope":"Cả hàm","symbol":"clearCurrentFarmId()","code":"export function clearCurrentFarmId(): void {\n  try {\n    tabStorage()?.removeItem(CURRENT_FARM_KEY)\n  } catch {\n    // Nothing kept, nothing to clear.\n  }\n}"},"profile-screen":{"file":"frontend/src/features/account/components/ProfileScreen.tsx","start":13,"end":46,"highlightStart":14,"highlightEnd":43,"scope":"Cả hàm component","symbol":"ProfileScreen()","code":"/** SCR-08 \"Hồ sơ & quyền của tôi\". `platform`: nhân sự nền tảng (CS, PM, SA) không có bảng quyền theo trại. */\nexport function ProfileScreen({ title, platform = false }: { title: string; platform?: boolean }) {\n  const { identity, data, loading, error, refetch, permissions } = useAccountProfile()\n  const [m, openModal, closeModal] = useModalParam()\n  const [search] = useSearchParams()\n  const { pathname } = useLocation()\n  const navigate = useNavigate()\n  const [notice, setNotice] = useState\u003cstring | null>(null)\n  const form = useProfileForm(data, identity, async (_saved, message) => { setNotice(message); await refetch() })\n\n  if (loading && !data) return \u003cLayout title={title}>\u003cLoadingBlock />\u003c/Layout>\n  if (error || !data) return \u003cLayout title={title}>\u003cErrorBlock message={userFacingError(error, 'Không tải được hồ sơ của bạn.')} onRetry={refetch} />\u003c/Layout>\n\n  const farmRole = !platform && isFarmRole(identity.role) ? identity.role : null\n  // Permissions belong to one farm: a tab that has not entered one has no role or permission table to show.\n  const noFarm = farmRole != null && identity.farmId == null\n  return (\n    \u003cLayout title={title}>\n      \u003cPageHeader title={title} sub={platform ? roleAtFarm(identity.role, null) : undefined}>\n        \u003cButton variant=\"primary\" type=\"submit\" form=\"profile-form\" disabled={form.saving}>{form.saving ? 'Đang lưu…' : 'Lưu hồ sơ'}\u003c/Button>\n      \u003c/PageHeader>\n      {notice && \u003cNote tone=\"ok\">{notice}\u003c/Note>}\n      {form.error && \u003cNote tone=\"err\">{form.error}\u003c/Note>}\n      \u003cdiv className={`grid items-start gap-5 ${farmRole ? 'xl:grid-cols-[minmax(0,1fr)_376px]' : 'max-w-[740px]'}`}>\n        \u003cProfileCard profile={data} headline={noFarm ? 'Chưa vào trại nào trong tab này' : roleAtFarm(identity.role, identity.farmName)} values={form.values} onChange={form.setValues} errors={form.errors} onSubmit={form.submit} onPassword={() => openModal('doi-mat-khau')} />\n        {farmRole && (noFarm\n          ? \u003cCard title=\"Quyền của tôi trong trại này\">\u003cp className=\"m-0 text-[13px] text-muted\">Quyền được cấp theo từng trại. Vào một trại để xem vai trò và quyền của bạn ở trại đó.\u003c/p>\u003cdiv className=\"mt-3\">\u003cButton onClick={() => navigate('/chon-trai')}>Chọn trại\u003c/Button>\u003c/div>\u003c/Card>\n          : \u003cPermissionsCard permissions={permissions.data} loading={permissions.loading} error={permissions.error} />)}\n      \u003c/div>\n      \u003cFoot>{farmRole ? 'Thư điện tử và cách đăng nhập để nhận diện tài khoản; tên và điện thoại là thông tin liên hệ. Bảng quyền chỉ đọc theo vai trò hiện tại.' : 'Thư điện tử và cách đăng nhập để nhận diện tài khoản; tên và điện thoại là thông tin liên hệ. Quyền nền tảng do quản trị hệ thống cấp.'}\u003c/Foot>\n      {m === 'doi-mat-khau' && \u003cChangePasswordDialog identity={identity} profile={data} returnTo={pathname} googleReauthenticated={search.get('googleReauthenticated') === 'true'} onClose={closeModal} onChanged={(message) => { setNotice(message); closeModal(); void refetch() }} />}\n    \u003c/Layout>\n  )\n}"},"account-profile-hook":{"file":"frontend/src/features/account/hooks/useAccountProfile.ts","start":25,"end":36,"highlightStart":25,"highlightEnd":36,"scope":"Cả hook","symbol":"useAccountProfile()","code":"export function useAccountProfile() {\n  const identity = useAccountIdentity()\n  const account = useAccountUseCase()\n  const query = useQuery(() => account.getProfile(identity), [account, identity.email])\n  const permissions = useQuery(\n    () => identity.farmId != null && ['OWNER', 'MANAGER', 'TECHNICIAN'].includes(identity.role)\n      ? account.getFarmPermissions(identity, identity.farmId)\n      : Promise.resolve(null),\n    [account, identity.email, identity.farmId, identity.role],\n  )\n  return { identity, permissions, ...query }\n}"},"profile-form-hook":{"file":"frontend/src/features/account/hooks/useAccountProfile.ts","start":38,"end":57,"highlightStart":39,"highlightEnd":57,"scope":"Cả hook","symbol":"useProfileForm()","code":"/** Biểu mẫu hồ sơ cá nhân (họ tên, điện thoại); nút \"Lưu hồ sơ\" ở đầu trang gửi biểu mẫu qua thuộc tính `form`. */\nexport function useProfileForm(profile: AccountProfile | null, identity: AccountIdentity, onSaved: (profile: AccountProfile, message: string) => void) {\n  const account = useAccountUseCase()\n  const [values, setValues] = useState({ fullName: '', phone: '' })\n  const [errors, setErrors] = useState\u003cProfileErrors>({})\n  const [error, setError] = useState\u003cstring | null>(null)\n  const [saving, setSaving] = useState(false)\n  useEffect(() => { if (profile) setValues({ fullName: profile.fullName, phone: profile.phone }) }, [profile])\n  const submit = async (event: FormEvent) => {\n    event.preventDefault()\n    const next = validateProfile(values)\n    setErrors(next); setError(null)\n    if (Object.keys(next).length) return\n    setSaving(true)\n    try { onSaved(await account.updateProfile(identity, values), 'Hồ sơ của bạn đã được cập nhật.') }\n    catch (reason) { setError(userFacingError(reason, 'Không lưu được hồ sơ. Vui lòng thử lại.')) }\n    finally { setSaving(false) }\n  }\n  return { values, setValues, errors, error, saving, submit }\n}"},"account-api-profile":{"file":"frontend/src/features/account/api/accountApi.ts","start":18,"end":50,"highlightStart":24,"highlightEnd":36,"scope":"Cả hàm tạo adapter","symbol":"createAccountApi() · profile methods","code":"export function createAccountApi({ mode, farmId, transport, store }: { mode: BackendMode; farmId: string | number | null; transport: BackendTransport; store: AccountDemoStore }) {\n  void farmId\n  const backend = mode === 'backend'\n  return {\n    /** Gợi ý chỉ có ở bản mô phỏng; máy chủ thật không có mật khẩu mẫu. */\n    samplePasswordHint(): string | null { return backend ? null : `Bản mô phỏng: mật khẩu hiện tại là ${store.samplePassword}.` },\n    // GET /api/account/profile\n    async getProfile(identity: AccountIdentity): Promise\u003cAccountProfile> {\n      return backend ? mapAccountProfile(await transport.get('/api/account/profile')) : store.getProfile(identity)\n    },\n    // POST /api/account/profile (FE01 A9: contactPhone là tên trường hợp đồng)\n    async updateProfile(identity: AccountIdentity, input: ProfileUpdateInput): Promise\u003cAccountProfile> {\n      return backend ? mapAccountProfile(await transport.command('/api/account/profile', { fullName: input.fullName.trim(), contactPhone: input.phone.trim() }, { method: 'POST' })) : store.updateProfile(identity, input)\n    },\n    async getFarmPermissions(identity: AccountIdentity, farmId: number): Promise\u003cFarmPermissions> {\n      if (backend) return mapFarmPermissions(await transport.get(transport.farmPath(farmId, '/my-permissions')))\n      if (identity.role !== 'OWNER' && identity.role !== 'MANAGER' && identity.role !== 'TECHNICIAN') throw new Error('Tài khoản nền tảng không có quyền trại.')\n      return mockPermissions(identity.role)\n    },\n    // POST /api/account/google-reauthentication (D07), sau đó trình duyệt chuyển tới Google\n    async reauthenticateWithGoogle(identity: AccountIdentity, returnTo: string): Promise\u003c{ redirectTo: string | null }> {\n      if (!backend) return store.reauthenticateWithGoogle(identity)\n      await transport.command('/api/account/google-reauthentication', { returnTo }, { method: 'POST' })\n      return { redirectTo: googleAuthorizationUrl() }\n    },\n    // POST /api/account/change-password\n    async changePassword(identity: AccountIdentity, input: PasswordChangeInput): Promise\u003c{ message: string }> {\n      if (!backend) return store.changePassword(identity, input)\n      await transport.command('/api/account/change-password', input, { method: 'POST' })\n      return { message: 'Mật khẩu đã được đổi. Các phiên khác đã được đăng xuất.' }\n    },\n  }\n}"},"account-get-update-profile":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/AccountResource.java","start":210,"end":228,"highlightStart":210,"highlightEnd":228,"scope":"Hai hàm trọn vẹn","symbol":"getProfile() + updateProfile()","code":"    @GetMapping(\"/account/profile\")\n    public ProfileResponse getProfile() {\n        return profile(farmAccessService.currentActiveUser());\n    }\n\n    @PostMapping(\"/account/profile\")\n    public ProfileResponse updateProfile(@RequestBody AccountProfileUpdate request) {\n        String name = fullName(request.fullName());\n        String phone = phone(request.contactPhone(), \"contactPhone\");\n        AppUser account = farmAccessService.currentActiveUser();\n        account.setFullName(name);\n        account.setPhone(phone);\n        appUserRepository.save(account);\n        userRepository.findOneByEmailIgnoreCase(account.getEmail()).ifPresent(identity -> {\n            identity.setFirstName(name.substring(0, Math.min(50, name.length())));\n            userRepository.save(identity);\n        });\n        return profile(account);\n    }"},"account-profile-response":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/AccountResource.java","start":297,"end":307,"highlightStart":297,"highlightEnd":307,"scope":"Cả hàm","symbol":"profile()","code":"    private ProfileResponse profile(AppUser account) {\n        boolean verified = userRepository.findOneByEmailIgnoreCase(account.getEmail()).map(User::isActivated).orElse(false);\n        String platformRole = platformStaffAccess.findOneByUserIdAndStatusIgnoreCase(account.getId(), \"ACTIVE\").map(access -> access.getRole()).orElse(null);\n        List\u003cFarmRoleSummary> farms = workspace.list().stream().map(farm -> new FarmRoleSummary(farm.id(), farm.name(), farm.role(), farm.serviceStatus(), permissionsOf(farm.role()))).toList();\n        List\u003cString> methods = new ArrayList\u003c>();\n        if (account.isPasswordLoginEnabled()) methods.add(\"PASSWORD\");\n        if (account.getGoogleSubject() != null) methods.add(\"GOOGLE\");\n        return new ProfileResponse(account.getId(), account.getEmail(), account.getFullName(), account.getPhone(), verified,\n            account.isPasswordLoginEnabled(), account.getGoogleSubject() != null, account.isOwnerRegistrationCompleted(), account.isTermsAccepted(), account.getAccountStatus(),\n            methods, account.isPasswordLoginEnabled(), platformRole, farms);\n    }"},"account-profile-get":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/AccountResource.java","start":210,"end":213,"highlightStart":210,"highlightEnd":213,"scope":"Cả endpoint","symbol":"getProfile()","code":"    @GetMapping(\"/account/profile\")\n    public ProfileResponse getProfile() {\n        return profile(farmAccessService.currentActiveUser());\n    }"},"account-permissions":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/AccountResource.java","start":230,"end":278,"highlightStart":231,"highlightEnd":239,"scope":"Cả nhóm hàm quyền","symbol":"myPermissions() + permissionEntries()","code":"    /** A10 / SCR-08: the permission matrix comes from the verified active membership, never from browser state. */\n    @GetMapping(\"/farms/{farmId}/my-permissions\")\n    public FarmPermissionsResponse myPermissions(@PathVariable Long farmId) {\n        AppUser account = farmAccessService.currentActiveUser();\n        FarmRole role = farmMembershipRepository\n            .findFirstByFarmIdAndUserIdAndStatusIgnoreCase(farmId, account.getId(), \"ACTIVE\")\n            .map(membership -> parseFarmRole(membership.getRole()))\n            .orElseThrow(() -> DomainException.forbidden(MessageCodes.COM_01));\n        return new FarmPermissionsResponse(role.name(), permissionEntries(role));\n    }\n\n    private static FarmRole parseFarmRole(String value) {\n        try {\n            return FarmRole.valueOf(value.trim().toUpperCase(Locale.ROOT));\n        } catch (IllegalArgumentException | NullPointerException invalid) {\n            throw DomainException.forbidden(MessageCodes.COM_01);\n        }\n    }\n\n    private static List\u003cPermissionEntry> permissionEntries(FarmRole role) {\n        return List.of(\n            permission(\"CATTLE_PROFILE_QR\", role, \"FULL\", \"FULL\", \"RESTRICTED\"),\n            permission(\"PENS_AND_MOVES\", role, \"FULL\", \"FULL\", \"RESTRICTED\"),\n            permission(\"HERD_ENTRY_AND_PAYMENTS\", role, \"FULL\", \"FULL\", \"NO\"),\n            // D41: the Owner has every Manager permission on care, reproduction, catalogues and the feeding log.\n            permission(\"GROWTH_BCS\", role, \"FULL\", \"FULL\", \"RESTRICTED\"),\n            permission(\"VACCINATION\", role, \"FULL\", \"FULL\", \"RESTRICTED\"),\n            permission(\"HEALTH_AND_TREATMENT\", role, \"FULL\", \"FULL\", \"RESTRICTED\"),\n            permission(\"REPRODUCTION\", role, \"FULL\", \"FULL\", \"RESTRICTED\"),\n            permission(\"CATALOGUES_AND_PARAMETERS\", role, \"FULL\", \"FULL\", \"RESTRICTED\"),\n            permission(\"FARM_ANNOUNCEMENTS\", role, \"FULL\", \"FULL\", \"RESTRICTED\"),\n            permission(\"REMINDERS\", role, \"RESTRICTED\", \"RESTRICTED\", \"RESTRICTED\"),\n            permission(\"DASHBOARD_AND_REPORTS\", role, \"RESTRICTED\", \"RESTRICTED\", \"NO\"),\n            permission(\"MEMBERS_ROLES\", role, \"FULL\", \"RESTRICTED\", \"NO\"),\n            permission(\"HERD_EXIT_AND_COLLECTIONS\", role, \"FULL\", \"RESTRICTED\", \"NO\"),\n            permission(\"FEED_STOCK_AND_CATALOGUE\", role, \"FULL\", \"FULL\", \"RESTRICTED\"),\n            permission(\"FEEDING_LOG\", role, \"FULL\", \"FULL\", \"RESTRICTED\"),\n            permission(\"SUBSCRIPTION_AND_PAYMENT\", role, \"FULL\", \"NO\", \"NO\"),\n            permission(\"FARM_INFORMATION\", role, \"FULL\", \"NO\", \"NO\")\n        );\n    }\n\n    private static PermissionEntry permission(String area, FarmRole role, String owner, String manager, String technician) {\n        String value = switch (role) {\n            case OWNER -> owner;\n            case MANAGER -> manager;\n            case TECHNICIAN -> technician;\n        };\n        return new PermissionEntry(area, value);"},"forgot-password-page":{"file":"frontend/src/features/authentication/pages/RecoveryPages.tsx","start":15,"end":45,"highlightStart":23,"highlightEnd":33,"scope":"Cả hàm component","symbol":"ForgotPasswordPage()","code":"export function ForgotPasswordPage({ client }: { client: AuthClient }) {\n  const auth = useAuthenticationUseCase(client)\n  const navigate = useNavigate()\n  const location = useLocation()\n  const [email, setEmail] = useState(emailFromState(location.state) || new URLSearchParams(location.search).get('email') || '')\n  const [error, setError] = useState\u003cstring | null>(null)\n  const [fieldError, setFieldError] = useState\u003cstring | undefined>()\n  const [busy, setBusy] = useState(false)\n  const submit = async (event: FormEvent\u003cHTMLFormElement>) => {\n    event.preventDefault(); setError(null); setFieldError(undefined)\n    if (!isValidEmail(email)) { setFieldError(email.trim() ? 'Email không hợp lệ.' : 'Vui lòng nhập email.'); return }\n    if (!auth.requestPasswordReset) { setError('Dịch vụ đặt lại mật khẩu chưa được nối với máy chủ.'); return }\n    setBusy(true)\n    try {\n      await auth.requestPasswordReset(normalizeEmail(email))\n      navigate(AUTH_PATH.resetSent, { replace: true, state: { email: normalizeEmail(email) } })\n    } catch (reason) { setError(friendlyEmailRequestError(reason)) }\n    finally { setBusy(false) }\n  }\n  return (\n    \u003cAuthShell title=\"Quên mật khẩu\" description=\"Nhập email tài khoản để nhận liên kết đặt lại mật khẩu.\" eyebrow=\"Khôi phục tài khoản\" footer={backToSignIn} alert={error ? \u003cAlert>{error}\u003c/Alert> : null}>\n      \u003cdiv className=\"space-y-5\">\n        \u003cForm onSubmit={submit}>\n          \u003cFormField id=\"forgot-email\" label=\"Email đăng ký\" type=\"email\" value={email} onChange={(event) => setEmail(event.target.value)} error={fieldError} placeholder=\"email@example.com\" autoComplete=\"email\" maxLength={254} required />\n          \u003cbutton type=\"submit\" disabled={busy} className={primaryButtonClass}>{busy ? 'Đang gửi…' : 'Gửi liên kết đặt lại'}\u003c/button>\n        \u003c/Form>\n        \u003cp className=\"m-0 rounded-[14px] bg-[#eef4ef] px-5 py-4 text-[13px] leading-5 text-subtle\">Nếu bạn đăng nhập bằng Google, hãy khôi phục tài khoản trong Google.\u003c/p>\n      \u003c/div>\n    \u003c/AuthShell>\n  )\n}"},"auth-client-reset":{"file":"frontend/src/features/authentication/client.ts","start":1,"end":27,"highlightStart":14,"highlightEnd":18,"scope":"Cả file","symbol":"client.ts · reset endpoints","code":"import { createBackendClient } from '../../shared/api/backendClient'\nimport type { AuthClient, RegistrationRequest } from './types'\nimport { demo } from '../../demo/demoModules'\n\nexport function createBackendAuthClient(): AuthClient {\n  const api = createBackendClient({ baseUrl: import.meta.env.VITE_BEEFCARE_API_URL || '' })\n  return {\n    mode: 'backend',\n    isAuthenticated: api.isAuthenticated,\n    login: api.login,\n    logout: api.logout,\n    register: (request: RegistrationRequest) => api.request\u003cvoid>('/api/register', { method: 'POST', body: request }),\n    resendVerification: (email) => api.request\u003c{ nextAllowedAt: string }>('/api/account/verification/resend', { method: 'POST', body: { email } }),\n    requestPasswordReset: (email) => api.request\u003cvoid>('/api/account/reset-password/init', { method: 'POST', body: { email } }),\n    validatePasswordReset: (token) => api.get\u003c{ valid: boolean; email?: string }>(`/api/account/reset-password/validate?token=${encodeURIComponent(token)}`),\n    resetPassword: (token, newPassword, confirmPassword) => api.request\u003cvoid>('/api/account/reset-password/finish', {\n      method: 'POST', body: { key: token, newPassword, confirmPassword },\n    }),\n    getPublicLanding: () => api.get('/api/public/landing'),\n    getPublicPrices: () => api.get('/api/public/prices'),\n  }\n}\n\nconst authMode = (import.meta.env as ImportMetaEnv & { VITE_BEEFCARE_AUTH_MODE?: string }).VITE_BEEFCARE_AUTH_MODE\nexport const defaultAuthClient: AuthClient = authMode === 'mock'\n  ? demo.mockAuth.createMockAuthClient()\n  : createBackendAuthClient()"},"account-reset-init":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/AccountResource.java","start":417,"end":425,"highlightStart":417,"highlightEnd":425,"scope":"Hai hàm trọn vẹn","symbol":"requestPasswordReset() + validateResetLink()","code":"    @PostMapping(path = \"/account/reset-password/init\")\n    public void requestPasswordReset(@RequestBody EmailRequest request) {\n        identityService.requestPasswordReset(request.email());\n    }\n\n    @GetMapping(path = \"/account/reset-password/validate\")\n    public ResetLinkValidation validateResetLink(@RequestParam(\"token\") String token) {\n        return identityService.passwordResetEmail(token).map(email -> new ResetLinkValidation(true, email)).orElseGet(() -> new ResetLinkValidation(false, null));\n    }"},"identity-reset-init":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/IdentityService.java","start":161,"end":178,"highlightStart":166,"highlightEnd":178,"scope":"Cả hàm","symbol":"requestPasswordReset()","code":"    /**\n     * Always responds identically; unknown addresses cause no mail. A SUSPENDED account can still reset its password while\n     * sign-in stays blocked (UC-FE01-05 E3, GBR-04). A Google-only account gets an email advising Google sign-in and no\n     * password is created (AF1); like the link mails it is limited to five per hour.\n     */\n    @Transactional\n    public void requestPasswordReset(String email) {\n        String normalizedEmail = normalizeEmail(email);\n        Optional\u003cUser> passwordAccount = findPasswordAccount(normalizedEmail, true).filter(User::isActivated);\n        if (passwordAccount.isPresent()) {\n            issueRateLimited(passwordAccount.get(), PASSWORD_RESET, RESET_LIFETIME, \"RESET_PASSWORD\");\n            return;\n        }\n        findGoogleOnlyAccount(normalizedEmail).ifPresent(account -> {\n            if (emailJobs.countByRecipientIgnoreCaseAndTemplateKeyAndCreatedAtAfter(account.getEmail(), \"GOOGLE_SIGN_IN_ADVICE\", Instant.now().minus(Duration.ofHours(1))) >= MAX_LINK_EMAILS_PER_HOUR) return;\n            mailService.queueActionLink(account.getEmail(), \"GOOGLE_SIGN_IN_ADVICE\", \"ACCOUNT\", account.getId(), account.getFullName(), null, null);\n        });\n    }"},"reset-password-page":{"file":"frontend/src/features/authentication/pages/RecoveryPages.tsx","start":59,"end":119,"highlightStart":75,"highlightEnd":102,"scope":"Cả hàm component","symbol":"ResetPasswordPage()","code":"export function ResetPasswordPage({ client }: { client: AuthClient }) {\n  const auth = useAuthenticationUseCase(client)\n  const location = useLocation()\n  const navigate = useNavigate()\n  const query = useMemo(() => new URLSearchParams(location.search), [location.search])\n  const token = query.get('token') || ''\n  const initialEmail = normalizeEmail(query.get('email') || '')\n  const [validation, setValidation] = useState\u003cPasswordResetValidation | null>(null)\n  const [checking, setChecking] = useState(true)\n  const [checkError, setCheckError] = useState\u003cstring | null>(null)\n  const [password, setPassword] = useState('')\n  const [confirmPassword, setConfirmPassword] = useState('')\n  const [errors, setErrors] = useState\u003cReturnType\u003ctypeof validateReset>>({})\n  const [error, setError] = useState\u003cstring | null>(null)\n  const [busy, setBusy] = useState(false)\n\n  const checkLink = async () => {\n    setChecking(true); setCheckError(null)\n    if (!token || !auth.validatePasswordReset) { setValidation({ valid: false }); setChecking(false); return }\n    try { setValidation(await auth.validatePasswordReset(token)) }\n    catch (reason) {\n      const { code } = readError(reason)\n      if (code === 'MSG-FE01-06' || reason instanceof BackendError && reason.status === 400) setValidation({ valid: false })\n      else setCheckError(userFacingError(reason, 'Không thể kiểm tra liên kết. Vui lòng thử lại.'))\n    } finally { setChecking(false) }\n  }\n  useEffect(() => { void checkLink() }, [token, auth])\n\n  const email = validation?.email ? normalizeEmail(validation.email) : initialEmail\n  const submit = async (event: FormEvent\u003cHTMLFormElement>) => {\n    event.preventDefault(); setError(null)\n    const next = validateReset({ email, password, confirmPassword }); setErrors(next)\n    if (Object.keys(next).length) return\n    if (!auth.resetPassword) { setError('Dịch vụ đặt lại mật khẩu chưa được nối với máy chủ.'); return }\n    setBusy(true)\n    try {\n      await auth.resetPassword(token, password, confirmPassword)\n      navigate(`${AUTH_PATH.signIn}?reset=success`, { replace: true })\n    } catch (reason) {\n      const { code } = readError(reason)\n      if (code === 'MSG-FE01-06') navigate(AUTH_PATH.invalid, { replace: true, state: { email } })\n      else setError(friendlyAccountError(reason))\n    } finally { setBusy(false) }\n  }\n\n  if (checking) return \u003cAuthShell title=\"Đặt mật khẩu mới\" description=\"Đang kiểm tra liên kết đặt lại mật khẩu…\">\u003cdiv className=\"animate-pulse rounded-xl bg-[#eef4ef] p-8 text-center text-sm text-subtle\">Đang xác minh liên kết\u003c/div>\u003c/AuthShell>\n  if (checkError) return \u003cAuthShell title=\"Chưa kiểm tra được liên kết\" description=\"Kết nối máy chủ đang gặp sự cố.\" alert={\u003cAlert>{checkError}\u003c/Alert>} footer={backToSignIn}>\u003cbutton type=\"button\" className={primaryButtonClass} onClick={() => void checkLink()}>Thử lại\u003c/button>\u003c/AuthShell>\n  if (!validation?.valid) return \u003cInvalidLinkPage email={initialEmail} />\n\n  return (\n    \u003cAuthShell title=\"Đặt mật khẩu mới\" description=\"Tạo mật khẩu mới để bảo vệ tài khoản của bạn.\" eyebrow=\"Thiết lập mật khẩu\" footer={backToSignIn} alert={error ? \u003cAlert>{error}\u003c/Alert> : null}>\n      \u003cForm onSubmit={submit}>\n        {email && \u003cFormField id=\"reset-email\" label=\"Email tài khoản\" value={email} readOnly />}\n        \u003cPasswordField id=\"reset-password\" label=\"Mật khẩu mới\" value={password} onChange={setPassword} error={errors.password} placeholder=\"Tối thiểu 8 ký tự\" autoComplete=\"new-password\" />\n        \u003cPasswordField id=\"reset-confirm\" label=\"Nhập lại mật khẩu\" value={confirmPassword} onChange={setConfirmPassword} error={errors.confirmPassword} placeholder=\"Nhập lại mật khẩu mới\" autoComplete=\"new-password\" />\n        \u003cp className=\"-mt-1 mb-0 text-xs text-subtle\">Dùng mật khẩu đủ dài và khó đoán.\u003c/p>\n        \u003cbutton type=\"submit\" disabled={busy} className={primaryButtonClass}>{busy ? 'Đang cập nhật…' : 'Lưu mật khẩu mới'}\u003c/button>\n      \u003c/Form>\n    \u003c/AuthShell>\n  )\n}"},"account-reset-finish":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/AccountResource.java","start":429,"end":439,"highlightStart":436,"highlightEnd":439,"scope":"Cả hàm","symbol":"finishPasswordReset()","code":"    /**\n     * {@code POST   /account/reset-password/finish} : Finish to reset the password of the user.\n     *\n     * @param keyAndPassword the generated key and the new password.\n     * @throws InvalidPasswordException {@code 400 (Bad Request)} if the password is incorrect.\n     * @throws RuntimeException {@code 500 (Internal Server Error)} if the password could not be reset.\n     */\n    @PostMapping(path = \"/account/reset-password/finish\")\n    public void finishPasswordReset(@RequestBody KeyAndPasswordVM keyAndPassword) {\n        identityService.completePasswordReset(keyAndPassword.getKey(), keyAndPassword.getNewPassword(), keyAndPassword.getConfirmPassword());\n    }"},"identity-reset-finish":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/IdentityService.java","start":180,"end":212,"highlightStart":197,"highlightEnd":212,"scope":"Ba hàm trọn vẹn","symbol":"isPasswordResetLinkValid() + passwordResetEmail() + completePasswordReset()","code":"    @Transactional\n    public boolean isPasswordResetLinkValid(String rawToken) {\n        if (rawToken == null || rawToken.isBlank()) return false;\n        return tokenRepository.findOneByTokenHashAndTokenType(linkSigner.hash(rawToken), PASSWORD_RESET)\n            .filter(link -> link.getUsedAt() == null && link.getExpiresAt().isAfter(Instant.now()))\n            .filter(link -> link.getUser().isActivated())\n            .filter(link -> appUserRepository.findOneByEmailIgnoreCase(link.getUser().getEmail()).isPresent())\n            .isPresent();\n    }\n\n    @Transactional(readOnly = true)\n    public Optional\u003cString> passwordResetEmail(String rawToken) {\n        if (!isPasswordResetLinkValid(rawToken)) return Optional.empty();\n        return tokenRepository.findOneByTokenHashAndTokenType(linkSigner.hash(rawToken), PASSWORD_RESET)\n            .map(AccountLinkToken::getUser).map(User::getEmail);\n    }\n\n    @Transactional\n    public User completePasswordReset(String rawToken, String newPassword, String confirmation) {\n        AccountLinkToken link = consume(rawToken, PASSWORD_RESET);\n        User user = userRepository.findOneWithAuthoritiesByLogin(link.getUser().getLogin()).orElseThrow(IdentityService::invalidLink);\n        validatePassword(newPassword, user.getEmail(), confirmation);\n        user.setPassword(passwordEncoder.encode(newPassword));\n        user.setFailedPasswordAttempts(0);\n        user.setPasswordLockedUntil(null);\n        user.setResetKey(null);\n        user.setResetDate(null);\n        expireSessions(user, false); // UC-FE01-05 step 7: every session of the account ends, including one held by the requester\n        AppUser account = appUserRepository.findOneByEmailIgnoreCase(user.getEmail()).orElseThrow(IdentityService::invalidLink);\n        activatePasswordMethod(account, Instant.now());\n        mailService.sendEmail(user.getEmail(), \"Your BeefCare password changed\", \"Your password was changed. If you did not make this change, contact BeefCare support.\", false, false);\n        return user;\n    }"},"change-password-dialog":{"file":"frontend/src/features/account/components/ChangePasswordDialog.tsx","start":39,"end":115,"highlightStart":51,"highlightEnd":80,"scope":"Cả hàm component","symbol":"ChangePasswordDialog()","code":"/** UC-FE01-06. Tài khoản có Google: xác thực lại trong 5 phút thì không cần mật khẩu hiện tại (D07); chưa có mật khẩu thì phải xác thực lại. */\nexport function ChangePasswordDialog({ identity, profile, onClose, onChanged, googleReauthenticated = false, returnTo }: {\n  identity: AccountIdentity; profile: AccountProfile; onClose: () => void; onChanged: (message: string) => void; googleReauthenticated?: boolean; returnTo: string\n}) {\n  const [values, setValues] = useState({ currentPassword: '', newPassword: '', confirmPassword: '' })\n  const [errors, setErrors] = useState\u003cPasswordErrors>({})\n  const [error, setError] = useState\u003cstring | null>(null)\n  const [saving, setSaving] = useState(false)\n  const [visible, setVisible] = useState\u003cRecord\u003cPasswordFieldKey, boolean>>({ current: false, new: false, confirm: false })\n  const [reauthed, setReauthed] = useState(googleReauthenticated)\n  const account = useAccountUseCase()\n  const samplePasswordHint = account.samplePasswordHint()\n  const hasPassword = profile.passwordSignInEnabled\n  const needsReauth = !hasPassword && !reauthed\n  const requireCurrent = hasPassword && !reauthed\n  const set = (key: keyof typeof values, value: string) => setValues((current) => ({ ...current, [key]: value }))\n  const toggleVisibility = (key: PasswordFieldKey) => setVisible((current) => ({ ...current, [key]: !current[key] }))\n\n  const reauthenticate = async () => {\n    setError(null)\n    try {\n      const result = await account.reauthenticateWithGoogle(identity, returnTo)\n      if (result.redirectTo) window.location.assign(result.redirectTo)\n      else setReauthed(true)\n    } catch (reason) { setError(userFacingError(reason, 'Không xác thực lại được với Google.')) }\n  }\n\n  const submit = async (event: FormEvent) => {\n    event.preventDefault()\n    const input = { currentPassword: requireCurrent ? values.currentPassword : undefined, newPassword: values.newPassword, confirmPassword: values.confirmPassword }\n    const next = validatePasswordChange(input, { email: profile.email, requireCurrent })\n    setErrors(next); setError(null)\n    if (Object.keys(next).length) return\n    setSaving(true)\n    try { onChanged((await account.changePassword(identity, input)).message) }\n    catch (reason) {\n      const message = userFacingError(reason, 'Không đổi được mật khẩu. Vui lòng thử lại.')\n      const wrongCurrent = (reason as { code?: unknown })?.code === 'MSG-FE01-16' || message.startsWith('Mật khẩu hiện tại')\n      if (wrongCurrent) setErrors({ currentPassword: 'Mật khẩu hiện tại không đúng.' })\n      else setError(message)\n    } finally { setSaving(false) }\n  }\n\n  return (\n    \u003cModal title={hasPassword ? 'Đổi mật khẩu' : 'Thêm mật khẩu'} sub={profile.email} width={520} onClose={onClose}>\n      \u003cform onSubmit={submit} className=\"flex flex-col gap-4\" noValidate>\n        {error && \u003cNote tone=\"err\">{error}\u003c/Note>}\n        {needsReauth && \u003cNote tone=\"info\">Tài khoản này chưa có mật khẩu. Xác thực lại với Google để thêm mật khẩu.\u003c/Note>}\n        {requireCurrent && (\n          \u003cField label=\"Mật khẩu hiện tại *\" id=\"cp-current\">\n            \u003cPasswordInput id=\"cp-current\" label=\"mật khẩu hiện tại\" autoComplete=\"current-password\" value={values.currentPassword} onChange={(value) => set('currentPassword', value)} visible={visible.current} onToggle={() => toggleVisibility('current')} />\n            {errorText(errors.currentPassword)}\n          \u003c/Field>\n        )}\n        {!needsReauth && (\u003c>\n          \u003cField label=\"Mật khẩu mới *\" id=\"cp-new\">\n            \u003cPasswordInput id=\"cp-new\" label=\"mật khẩu mới\" autoComplete=\"new-password\" value={values.newPassword} onChange={(value) => set('newPassword', value)} visible={visible.new} onToggle={() => toggleVisibility('new')} />\n            {errorText(errors.newPassword)}\n          \u003c/Field>\n          \u003cField label=\"Nhập lại mật khẩu mới *\" id=\"cp-confirm\">\n            \u003cPasswordInput id=\"cp-confirm\" label=\"mật khẩu xác nhận\" autoComplete=\"new-password\" value={values.confirmPassword} onChange={(value) => set('confirmPassword', value)} visible={visible.confirm} onToggle={() => toggleVisibility('confirm')} />\n            {errorText(errors.confirmPassword)}\n          \u003c/Field>\n        \u003c/>)}\n        {profile.googleSignInLinked && !reauthed && (\n          \u003cdiv className=\"text-xs text-subtle\">{hasPassword ? 'Quên mật khẩu hiện tại? ' : ''}\u003cButton variant=\"link\" size=\"sm\" onClick={reauthenticate}>Xác thực lại với Google\u003c/Button>\u003c/div>\n        )}\n        {reauthed && \u003cNote tone=\"ok\">Đã xác thực lại với Google. Bạn không cần nhập mật khẩu hiện tại.\u003c/Note>}\n        {samplePasswordHint && hasPassword && \u003cp className=\"m-0 text-[11px] text-subtle\">{samplePasswordHint}\u003c/p>}\n        \u003cModalFooter compact>\n          \u003cButton size=\"lg\" onClick={onClose}>Hủy\u003c/Button>\n          \u003cButton size=\"lg\" variant=\"primary\" type=\"submit\" disabled={saving || needsReauth}>\u003cIcon name=\"lock\" size={16} />{saving ? 'Đang lưu…' : hasPassword ? 'Đổi mật khẩu' : 'Thêm mật khẩu'}\u003c/Button>\n        \u003c/ModalFooter>\n      \u003c/form>\n    \u003c/Modal>\n  )\n}"},"account-api-password":{"file":"frontend/src/features/account/api/accountApi.ts","start":18,"end":50,"highlightStart":37,"highlightEnd":48,"scope":"Cả hàm tạo adapter","symbol":"createAccountApi() · password methods","code":"export function createAccountApi({ mode, farmId, transport, store }: { mode: BackendMode; farmId: string | number | null; transport: BackendTransport; store: AccountDemoStore }) {\n  void farmId\n  const backend = mode === 'backend'\n  return {\n    /** Gợi ý chỉ có ở bản mô phỏng; máy chủ thật không có mật khẩu mẫu. */\n    samplePasswordHint(): string | null { return backend ? null : `Bản mô phỏng: mật khẩu hiện tại là ${store.samplePassword}.` },\n    // GET /api/account/profile\n    async getProfile(identity: AccountIdentity): Promise\u003cAccountProfile> {\n      return backend ? mapAccountProfile(await transport.get('/api/account/profile')) : store.getProfile(identity)\n    },\n    // POST /api/account/profile (FE01 A9: contactPhone là tên trường hợp đồng)\n    async updateProfile(identity: AccountIdentity, input: ProfileUpdateInput): Promise\u003cAccountProfile> {\n      return backend ? mapAccountProfile(await transport.command('/api/account/profile', { fullName: input.fullName.trim(), contactPhone: input.phone.trim() }, { method: 'POST' })) : store.updateProfile(identity, input)\n    },\n    async getFarmPermissions(identity: AccountIdentity, farmId: number): Promise\u003cFarmPermissions> {\n      if (backend) return mapFarmPermissions(await transport.get(transport.farmPath(farmId, '/my-permissions')))\n      if (identity.role !== 'OWNER' && identity.role !== 'MANAGER' && identity.role !== 'TECHNICIAN') throw new Error('Tài khoản nền tảng không có quyền trại.')\n      return mockPermissions(identity.role)\n    },\n    // POST /api/account/google-reauthentication (D07), sau đó trình duyệt chuyển tới Google\n    async reauthenticateWithGoogle(identity: AccountIdentity, returnTo: string): Promise\u003c{ redirectTo: string | null }> {\n      if (!backend) return store.reauthenticateWithGoogle(identity)\n      await transport.command('/api/account/google-reauthentication', { returnTo }, { method: 'POST' })\n      return { redirectTo: googleAuthorizationUrl() }\n    },\n    // POST /api/account/change-password\n    async changePassword(identity: AccountIdentity, input: PasswordChangeInput): Promise\u003c{ message: string }> {\n      if (!backend) return store.changePassword(identity, input)\n      await transport.command('/api/account/change-password', input, { method: 'POST' })\n      return { message: 'Mật khẩu đã được đổi. Các phiên khác đã được đăng xuất.' }\n    },\n  }\n}"},"account-google-reauth":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/AccountResource.java","start":386,"end":410,"highlightStart":391,"highlightEnd":408,"scope":"Cả nhóm hàm","symbol":"startGoogleReauthentication() + reauthenticationReturnPath()","code":"    /**\n     * UC-FE01-06 AF1/AF2: the profile calls this, then sends the browser to {@code /oauth2/authorization/google}; after the\n     * Google sign-in the browser returns to its server-verified profile route with {@code googleReauthenticated=true} and, for 5 minutes, change-password\n     * accepts the new password without the current one.\n     */\n    @PostMapping(path = \"/account/google-reauthentication\")\n    @org.springframework.web.bind.annotation.ResponseStatus(HttpStatus.NO_CONTENT)\n    public void startGoogleReauthentication(@RequestBody(required = false) GoogleReauthenticationRequest request, HttpServletRequest httpRequest) {\n        AppUser account = farmAccessService.currentActiveUser();\n        String requested = request == null ? null : request.returnTo();\n        httpRequest.getSession(true).setAttribute(GoogleReauthentication.RETURN_TO_PROFILE_PATH, reauthenticationReturnPath(account, requested));\n    }\n\n    /** Only known account routes are retained, and each privileged route is derived from the active server-side role. */\n    private String reauthenticationReturnPath(AppUser account, String requested) {\n        if (\"/nen-tang/ho-so\".equals(requested) && platformStaffAccess.findOneByUserIdAndStatusIgnoreCase(account.getId(), \"ACTIVE\").isPresent()) {\n            return requested;\n        }\n        if (\"/kt/tai-khoan\".equals(requested) && farmMembershipRepository.existsByUserIdAndRoleIgnoreCaseAndStatusIgnoreCase(account.getId(), \"TECHNICIAN\", \"ACTIVE\")) {\n            return requested;\n        }\n        return \"/ho-so\";\n    }\n\n    public record GoogleReauthenticationRequest(String returnTo) {}"},"google-reauth-window":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/security/GoogleReauthentication.java","start":1,"end":31,"highlightStart":11,"highlightEnd":30,"scope":"Cả class","symbol":"GoogleReauthentication","code":"package vn.edu.fpt.beefcare.security;\n\nimport jakarta.servlet.http.HttpSession;\nimport java.time.Duration;\nimport java.time.Instant;\n\n/**\n * UC-FE01-06 AF1/AF2: a Google sign-in within the last 5 minutes, in this session, stands in for the current password\n * when the user adds a first password or forgot the current one.\n */\npublic final class GoogleReauthentication {\n\n    /** Set by the Google success handler on every Google sign-in. */\n    public static final String AUTHENTICATED_AT = \"beefcare.google.authenticatedAt\";\n    /**\n     * Set by the verified account endpoint before it sends the user to Google, so the callback returns to that\n     * account's own profile surface. This is a server-validated internal path, never a client-provided redirect URL.\n     */\n    public static final String RETURN_TO_PROFILE_PATH = \"beefcare.google.returnToProfilePath\";\n    public static final Duration WINDOW = Duration.ofMinutes(5);\n\n    private GoogleReauthentication() {}\n\n    /** The time of a Google sign-in in this session within the window, or null. */\n    public static Instant recent(HttpSession session, Instant now) {\n        if (session == null) return null;\n        Object value = session.getAttribute(AUTHENTICATED_AT);\n        if (!(value instanceof Instant at)) return null;\n        return !at.isAfter(now) && Duration.between(at, now).compareTo(WINDOW) \u003c= 0 ? at : null;\n    }\n}"},"account-change-password":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/AccountResource.java","start":374,"end":384,"highlightStart":380,"highlightEnd":384,"scope":"Cả hàm","symbol":"changePassword()","code":"    /**\n     * {@code POST  /account/change-password} : changes the current user's password.\n     *\n     * @param passwordChangeDto current and new password.\n     * @throws InvalidPasswordException {@code 400 (Bad Request)} if the new password is incorrect.\n     */\n    @PostMapping(path = \"/account/change-password\")\n    public void changePassword(@RequestBody PasswordChangeDTO passwordChangeDto, jakarta.servlet.http.HttpServletRequest request) {\n        boolean googleReauthenticated = GoogleReauthentication.recent(request.getSession(false), java.time.Instant.now()) != null;\n        identityService.changePassword(passwordChangeDto.getCurrentPassword(), passwordChangeDto.getNewPassword(), passwordChangeDto.getConfirmPassword(), googleReauthenticated);\n    }"},"identity-change-password":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/IdentityService.java","start":218,"end":249,"highlightStart":223,"highlightEnd":249,"scope":"Cả hàm","symbol":"changePassword()","code":"    /**\n     * UC-FE01-06. {@code googleReauthenticated} is a Google sign-in within the last 5 minutes in this session: it adds a\n     * first password to a Google-only account (AF1) or replaces the forgotten current password (AF2). The failed-attempt\n     * counter must survive the wrong-password rejection, so that exception does not roll the transaction back (GBR-02).\n     */\n    @Transactional(noRollbackFor = DomainException.class)\n    public void changePassword(String currentPassword, String newPassword, String confirmation, boolean googleReauthenticated) {\n        String login = SecurityUtils.getCurrentUserLogin().orElseThrow(() -> new ResponseStatusException(HttpStatus.UNAUTHORIZED));\n        User user = findLogin(login).orElseThrow(() -> new ResponseStatusException(HttpStatus.UNAUTHORIZED));\n        AppUser account = appUserRepository.findOneByEmailIgnoreCase(user.getEmail()).orElseThrow(IdentityService::invalidLink);\n        boolean google = googleReauthenticated && account.getGoogleSubject() != null;\n        if (!account.isPasswordLoginEnabled() && !google) {\n            throw new DomainException(MessageCodes.COM_01, DomainException.params(\"reason\", \"google_reauthentication_required\"), HttpStatus.FORBIDDEN);\n        }\n        if (!google) {\n            if (user.getPasswordLockedUntil() != null && user.getPasswordLockedUntil().isAfter(Instant.now())) {\n                throw locked(user.getPasswordLockedUntil());\n            }\n            if (!passwordEncoder.matches(currentPassword == null ? \"\" : currentPassword, user.getPassword())) {\n                recordFailedPasswordAttempt(login);\n                throw DomainException.badRequest(MessageCodes.FE01_16, \"field\", \"currentPassword\");\n            }\n        }\n        validatePassword(newPassword, user.getEmail(), confirmation);\n        user.setPassword(passwordEncoder.encode(newPassword));\n        user.setFailedPasswordAttempts(0);\n        user.setPasswordLockedUntil(null);\n        // AF1: the email is already verified by Google, so the new password works at once; Google sign-in stays linked.\n        activatePasswordMethod(account, Instant.now());\n        expireSessions(user, true);\n        mailService.sendEmail(user.getEmail(), \"Your BeefCare password changed\", \"Your password was changed. If you did not make this change, contact BeefCare support.\", false, false);\n    }"},"domain-user-details":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/security/DomainUserDetailsService.java","start":22,"end":90,"highlightStart":32,"highlightEnd":56,"scope":"Cả class","symbol":"DomainUserDetailsService","code":"public class DomainUserDetailsService implements UserDetailsService {\n\n    private static final Logger LOG = LoggerFactory.getLogger(DomainUserDetailsService.class);\n\n    private final UserRepository userRepository;\n\n    public DomainUserDetailsService(UserRepository userRepository) {\n        this.userRepository = userRepository;\n    }\n\n    @Override\n    @Transactional(readOnly = true)\n    public UserDetails loadUserByUsername(final String login) {\n        LOG.debug(\"Authenticating {}\", login);\n\n        if (new EmailValidator().isValid(login, null)) {\n            return userRepository\n                .findOneWithAuthoritiesByEmailIgnoreCase(login)\n                .map(user -> createSpringSecurityUser(login, user))\n                .orElseThrow(() -> new UsernameNotFoundException(\"User with email \" + login + \" was not found in the database\"));\n        }\n\n        String lowercaseLogin = login.toLowerCase(Locale.ENGLISH);\n        return userRepository\n            .findOneWithAuthoritiesByLogin(lowercaseLogin)\n            .map(user -> createSpringSecurityUser(lowercaseLogin, user))\n            .orElseThrow(() -> new UsernameNotFoundException(\"User \" + lowercaseLogin + \" was not found in the database\"));\n    }\n\n    private org.springframework.security.core.userdetails.User createSpringSecurityUser(String lowercaseLogin, User user) {\n        if (!user.isActivated()) {\n            throw new UserNotActivatedException(\"User \" + lowercaseLogin + \" was not activated\");\n        }\n        return UserWithId.fromUser(user);\n    }\n\n    public static class UserWithId extends org.springframework.security.core.userdetails.User {\n\n        private final Long id;\n\n        public UserWithId(String login, String password, Collection\u003c? extends GrantedAuthority> authorities, Long id) {\n            super(login, password, authorities);\n            this.id = id;\n        }\n\n        public Long getId() {\n            return id;\n        }\n\n        @Override\n        public boolean equals(Object obj) {\n            return super.equals(obj);\n        }\n\n        @Override\n        public int hashCode() {\n            return super.hashCode();\n        }\n\n        public static UserWithId fromUser(User user) {\n            return new UserWithId(\n                user.getLogin(),\n                user.getPassword(),\n                user.getAuthorities().stream().map(Authority::getName).map(SimpleGrantedAuthority::new).toList(),\n                user.getId()\n            );\n        }\n    }\n}"},"mail-queue-action-link":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/MailService.java","start":58,"end":81,"highlightStart":58,"highlightEnd":81,"scope":"Cả hàm","symbol":"queueActionLink()","code":"    /** Creates durable metadata; the referenced action token is reconstructed at delivery and never stored in this job. */\n    @Transactional(propagation = Propagation.MANDATORY)\n    public void queueActionLink(String recipient, String templateKey, String linkSource, Long linkSourceId, String displayName, String contextName, String contextRole) {\n        EmailDeliveryJob job = new EmailDeliveryJob();\n        job.setRecipient(recipient);\n        job.setTemplateKey(templateKey);\n        job.setLinkSource(linkSource);\n        job.setLinkSourceId(linkSourceId);\n        job.setDisplayName(displayName);\n        job.setContextName(contextName);\n        job.setContextRole(contextRole);\n        job.setSubject(switch (templateKey) {\n            case \"VERIFY_EMAIL\" -> \"Xác minh email BeefCare\";\n            case \"RESET_PASSWORD\" -> \"Đặt lại mật khẩu BeefCare\";\n            case \"FARM_INVITATION\" -> \"Lời mời tham gia trang trại BeefCare\";\n            case \"GOOGLE_SIGN_IN_ADVICE\" -> \"Đăng nhập BeefCare bằng Google\";\n            case \"SUBSCRIPTION_NOTICE\" -> \"Thông báo gói dịch vụ BeefCare\";\n            default -> throw new IllegalArgumentException(\"Unknown action email template\");\n        });\n        job.setCreatedAt(java.time.Instant.now());\n        job.setAvailableAt(job.getCreatedAt());\n        job.setStatus(\"PENDING\");\n        jobs.save(job);\n    }"},"account-link-token-repository":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/repository/AccountLinkTokenRepository.java","start":1,"end":33,"highlightStart":13,"highlightEnd":32,"scope":"Cả file","symbol":"AccountLinkTokenRepository.java","code":"package vn.edu.fpt.beefcare.repository;\n\nimport java.time.Instant;\nimport java.util.Optional;\nimport org.springframework.data.jpa.repository.JpaRepository;\nimport org.springframework.data.jpa.repository.Modifying;\nimport org.springframework.data.jpa.repository.Query;\nimport org.springframework.data.repository.query.Param;\nimport org.springframework.stereotype.Repository;\nimport vn.edu.fpt.beefcare.domain.AccountLinkToken;\n\n@Repository\npublic interface AccountLinkTokenRepository extends JpaRepository\u003cAccountLinkToken, Long> {\n    /** JOB-08: verification and reset links that expired before the cut-off. */\n    @Query(\"select t.id from AccountLinkToken t where t.expiresAt \u003c :before order by t.id\")\n    java.util.List\u003cLong> findIdsExpiredBefore(@Param(\"before\") Instant before, org.springframework.data.domain.Pageable page);\n\n    @Modifying\n    @Query(\"delete from AccountLinkToken t where t.id in :ids\")\n    int deleteByIdIn(@Param(\"ids\") java.util.Collection\u003cLong> ids);\n\n    Optional\u003cAccountLinkToken> findOneByTokenHashAndTokenType(String tokenHash, String tokenType);\n\n    long countByUserIdAndTokenTypeAndCreatedAtAfter(Long userId, String tokenType, Instant since);\n\n    Optional\u003cAccountLinkToken> findFirstByUserIdAndTokenTypeOrderByCreatedAtDesc(Long userId, String tokenType);\n\n    Optional\u003cAccountLinkToken> findFirstByUserIdAndTokenTypeAndCreatedAtAfterOrderByCreatedAtAsc(Long userId, String tokenType, Instant since);\n\n    @Modifying\n    @Query(\"update AccountLinkToken t set t.usedAt = :now where t.user.id = :userId and t.tokenType = :type and t.usedAt is null\")\n    int invalidateUnused(@Param(\"userId\") Long userId, @Param(\"type\") String type, @Param(\"now\") Instant now);\n}"},"app-user-repository":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/repository/AppUserRepository.java","start":1,"end":37,"highlightStart":15,"highlightEnd":28,"scope":"Cả file","symbol":"AppUserRepository.java","code":"package vn.edu.fpt.beefcare.repository;\n\nimport org.springframework.data.jpa.repository.*;\nimport org.springframework.stereotype.Repository;\nimport jakarta.persistence.LockModeType;\nimport java.util.Optional;\nimport org.springframework.data.repository.query.Param;\nimport vn.edu.fpt.beefcare.domain.AppUser;\n\n/**\n * Spring Data JPA repository for the AppUser entity.\n */\n@SuppressWarnings(\"unused\")\n@Repository\npublic interface AppUserRepository extends JpaRepository\u003cAppUser, Long>, JpaSpecificationExecutor\u003cAppUser> {\n    Optional\u003cAppUser> findOneByEmailIgnoreCase(String email);\n    Optional\u003cAppUser> findOneByGoogleSubject(String googleSubject);\n\n    /** Existence hint for one invitation; does not load the account (and its inverse one-to-one platform access). */\n    boolean existsByEmailIgnoreCase(String email);\n\n    /** Only the existence hint for one visible invitation page; never expose platform account state. */\n    @Query(\"select lower(u.email) from AppUser u where lower(u.email) in :emails\")\n    java.util.Set\u003cString> findExistingInvitationEmails(@Param(\"emails\") java.util.Collection\u003cString> emails);\n\n    @Lock(LockModeType.PESSIMISTIC_WRITE

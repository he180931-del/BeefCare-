)\n    @Query(\"select u from AppUser u where u.id = :id\")\n    Optional\u003cAppUser> findByIdForUpdate(@Param(\"id\") Long id);\n\n    /**\n     * Row lock on an account without loading it (D32): used for the acting SA's own account, which is already loaded with\n     * a version that a concurrent command may have changed (an entity lock would then fail as an optimistic conflict).\n     */\n    // {h-schema}: Hibernate's default schema (empty at runtime, the isolated schema in PostgreSQL tests).\n    @Query(value = \"select id from {h-schema}app_user where id = :id for update\", nativeQuery = true)\n    java.util.List\u003cNumber> lockRow(@Param(\"id\") Long id);\n}"},"farm-membership-repository":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/repository/FarmMembershipRepository.java","start":1,"end":64,"highlightStart":14,"highlightEnd":18,"scope":"Cả file","symbol":"FarmMembershipRepository.java","code":"package vn.edu.fpt.beefcare.repository;\n\nimport org.springframework.data.jpa.repository.*;\nimport org.springframework.stereotype.Repository;\nimport java.util.Optional;\nimport java.util.List;\nimport vn.edu.fpt.beefcare.domain.FarmMembership;\n\n/**\n * Spring Data JPA repository for the FarmMembership entity.\n */\n@SuppressWarnings(\"unused\")\n@Repository\npublic interface FarmMembershipRepository extends JpaRepository\u003cFarmMembership, Long> {\n    Optional\u003cFarmMembership> findFirstByFarmIdAndUserIdAndStatusIgnoreCase(Long farmId, Long userId, String status);\n    boolean existsByUserIdAndRoleIgnoreCaseAndStatusIgnoreCase(Long userId, String role, String status);\n    Optional\u003cFarmMembership> findFirstByFarmIdAndUserId(Long farmId, Long userId);\n    List\u003cFarmMembership> findByFarmIdOrderById(Long farmId);\n\n    /**\n     * UC-FE03-06 (D30): the target row is locked before any check, so a concurrent command waits and then sees the\n     * committed role and status (MSG-FE03-20) instead of overwriting it.\n     */\n    @Lock(jakarta.persistence.LockModeType.PESSIMISTIC_WRITE)\n    @Query(\"select m from FarmMembership m where m.id = :id and m.farm.id = :farmId\")\n    Optional\u003cFarmMembership> lockByIdAndFarmId(@org.springframework.data.repository.query.Param(\"id\") Long id,\n        @org.springframework.data.repository.query.Param(\"farmId\") Long farmId);\n\n    /** SCR-13 (A1): every membership with its account in one query; the inverse platform access is joined to avoid N+1. */\n    @EntityGraph(attributePaths = { \"user\", \"user.platformStaffAccess\" })\n    @Query(\"select m from FarmMembership m where m.farm.id = :farmId\")\n    List\u003cFarmMembership> findWithUserByFarmId(@org.springframework.data.repository.query.Param(\"farmId\") Long farmId);\n    List\u003cFarmMembership> findByFarm_IdAndStatusIgnoreCase(Long farmId,String status);\n\n    /** SCR-16 \"Farms joined\" (D31): ACTIVE memberships of a page of accounts per role, in one query; [userId, ROLE, count]. */\n    @Query(\"select m.user.id, upper(m.role), count(m) from FarmMembership m where m.user.id in :userIds and upper(m.status) = 'ACTIVE' group by m.user.id, upper(m.role)\")\n    List\u003cObject[]> countActiveByUserAndRole(@org.springframework.data.repository.query.Param(\"userIds\") java.util.Collection\u003cLong> userIds);\n\n    /** SCR-16 account detail: names of the farms the account owns (any service status). */\n    @Query(\"select f.name from FarmMembership m join m.farm f where m.user.id = :userId and upper(m.role) = 'OWNER'\")\n    List\u003cString> findOwnedFarmNames(@org.springframework.data.repository.query.Param(\"userId\") Long userId);\n    List\u003cFarmMembership> findByIdInAndFarm_IdAndStatusIgnoreCase(List\u003cLong> ids, Long farmId, String status);\n    Optional\u003cFarmMembership> findFirstByFarmIdAndRoleIgnoreCaseAndStatusIgnoreCase(Long farmId, String role, String status);\n\n    /**\n     * FE-07 publication lock: selected-role candidates and explicitly named IDs are locked in one stable order,\n     * compatible with FE-03's per-membership PESSIMISTIC_WRITE lock.\n     */\n    @Lock(jakarta.persistence.LockModeType.PESSIMISTIC_WRITE)\n    @Query(\"select m from FarmMembership m where m.farm.id = :farmId and (upper(m.role) in :roles or m.id in :ids) order by m.id\")\n    List\u003cFarmMembership> lockAnnouncementCandidatesByFarmIdAndRolesOrIds(\n        @org.springframework.data.repository.query.Param(\"farmId\") Long farmId,\n        @org.springframework.data.repository.query.Param(\"roles\") List\u003cString> roles,\n        @org.springframework.data.repository.query.Param(\"ids\") List\u003cLong> ids\n    );\n\n    /** Lock a correction's original recipients plus author, ordered consistently with the FE-07 publication query. */\n    @Lock(jakarta.persistence.LockModeType.PESSIMISTIC_WRITE)\n    @Query(\"select m from FarmMembership m where m.farm.id = :farmId and m.id in :ids order by m.id\")\n    List\u003cFarmMembership> lockByIdsAndFarmIdOrderById(\n        @org.springframework.data.repository.query.Param(\"farmId\") Long farmId,\n        @org.springframework.data.repository.query.Param(\"ids\") List\u003cLong> ids\n    );\n}"},"user-repository":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/repository/UserRepository.java","start":1,"end":35,"highlightStart":1,"highlightEnd":35,"scope":"Cả file","symbol":"UserRepository.java","code":"package vn.edu.fpt.beefcare.repository;\n\nimport java.time.Instant;\nimport java.util.List;\nimport java.util.Optional;\nimport org.springframework.data.domain.*;\nimport org.springframework.data.jpa.repository.EntityGraph;\nimport org.springframework.data.jpa.repository.JpaRepository;\nimport org.springframework.stereotype.Repository;\nimport vn.edu.fpt.beefcare.domain.User;\n\n/**\n * Spring Data JPA repository for the {@link User} entity.\n */\n@Repository\npublic interface UserRepository extends JpaRepository\u003cUser, Long> {\n    Optional\u003cUser> findOneByActivationKey(String activationKey);\n    List\u003cUser> findAllByActivatedIsFalseAndActivationKeyIsNotNullAndCreatedDateBefore(Instant dateTime);\n    Optional\u003cUser> findOneByResetKey(String resetKey);\n    Optional\u003cUser> findOneByEmailIgnoreCase(String email);\n    Optional\u003cUser> findOneByEmailIgnoreCaseAndActivatedTrue(String email);\n    Optional\u003cUser> findOneByLogin(String login);\n\n    @EntityGraph(attributePaths = \"authorities\")\n    Optional\u003cUser> findOneWithAuthoritiesByLogin(String login);\n\n    @EntityGraph(attributePaths = \"authorities\")\n    Optional\u003cUser> findOneWithAuthoritiesByEmailIgnoreCase(String email);\n\n    Page\u003cUser> findAllByIdNotNullAndActivatedIsTrue(Pageable pageable);\n\n    /** SCR-16 (D31): which of these lower-cased emails belong to a verified (activated) sign-in identity, in one query. */\n    @org.springframework.data.jpa.repository.Query(\"select lower(u.email) from User u where u.activated = true and lower(u.email) in :emails\")\n    java.util.Set\u003cString> findActivatedEmails(@org.springframework.data.repository.query.Param(\"emails\") java.util.Collection\u003cString> emails);\n}"},"app-providers":{"file":"frontend/src/app/providers/AppProviders.tsx","start":1,"end":14,"highlightStart":7,"highlightEnd":12,"scope":"Cả file","symbol":"AppProviders.tsx","code":"import type { ReactNode } from 'react'\nimport { BrowserRouter } from 'react-router-dom'\nimport { AuthProvider } from '../../features/authentication'\nimport { AuthGate } from '../../features/authorization'\nimport { SessionProvider } from '../session/SessionProvider'\n\n/** Thứ tự bắt buộc: Router → Auth → AuthGate → Session → Routes (docs/frontend-refactor-guide.md §6.1). */\nexport function AppProviders({ children }: { children: ReactNode }) {\n  return (\n    \u003cBrowserRouter>\n      \u003cAuthProvider>\u003cAuthGate>\u003cSessionProvider>{children}\u003c/SessionProvider>\u003c/AuthGate>\u003c/AuthProvider>\n    \u003c/BrowserRouter>\n  )\n}"},"guest-auth-flow":{"file":"frontend/src/features/authentication/pages/GuestAuthFlow.tsx","start":1,"end":36,"highlightStart":15,"highlightEnd":34,"scope":"Cả hàm component","symbol":"GuestAuthFlow()","code":"import { useEffect } from 'react'\nimport { useLocation } from 'react-router-dom'\nimport { rememberInvitationLink } from '../invitationReturn'\nimport type { AuthClient } from '../types'\nimport { normalizeEmail } from '../validation/authValidation'\nimport { AUTH_PATH, emailFromState } from '../domain/authErrors'\nimport { PublicLandingPage } from './PublicLandingPage'\nimport { RegisterPage } from './RegisterPage'\nimport { SignInPage } from './SignInPage'\nimport { EmailSentPage } from './EmailSentPage'\nimport { ForgotPasswordPage, InvalidLinkPage, ResetPasswordPage } from './RecoveryPages'\nimport { SuspendedPage } from './SuspendedPage'\n\n/** Các màn hình dành cho khách chưa đăng nhập; chọn màn hình theo đường dẫn. */\nexport function GuestAuthFlow({ client, onAuthenticated, initialError = null, forceSuspended = false, onExitSuspended }: { client: AuthClient; onAuthenticated: () => void; initialError?: string | null; forceSuspended?: boolean; onExitSuspended?: () => void }) {\n  const location = useLocation()\n  const search = new URLSearchParams(location.search)\n  const path = location.pathname\n  // UC-FE03-04 AF3 / UC-FE01-02 AF2 (D28): sign in or register here, then come back to the invitation.\n  useEffect(() => { rememberInvitationLink(location.pathname + location.search) }, [location.pathname, location.search])\n  const mockNotice = client.mode === 'mock' ? \u003cdiv className=\"fixed bottom-3 right-3 z-30 rounded-full border border-[#c7dfcf] bg-white px-3 py-1.5 text-[11px] font-semibold text-brand shadow\">Chế độ mô phỏng · dữ liệu chỉ ở bộ nhớ\u003c/div> : null\n  let page\n  if (forceSuspended || path === AUTH_PATH.suspended) page = \u003cSuspendedPage onBackToSignIn={onExitSuspended} />\n  else if (path === AUTH_PATH.home) page = \u003cPublicLandingPage client={client} />\n  else if (path === AUTH_PATH.register) page = \u003cRegisterPage client={client} />\n  else if (path === AUTH_PATH.verification) page = \u003cEmailSentPage client={client} kind=\"verification\" />\n  else if (path === AUTH_PATH.forgot) page = \u003cForgotPasswordPage client={client} />\n  else if (path === AUTH_PATH.resetSent) page = \u003cEmailSentPage client={client} kind=\"reset\" />\n  else if (path === AUTH_PATH.reset || path === '/reset-password') page = \u003cResetPasswordPage client={client} />\n  else if (path === AUTH_PATH.invalid) page = \u003cInvalidLinkPage email={emailFromState(location.state) || normalizeEmail(search.get('email') || '')} flow={search.get('type') === 'verification' ? 'verification' : 'reset'} />\n  else if (path === AUTH_PATH.loginFailed) page = \u003cSignInPage client={client} onAuthenticated={onAuthenticated} initialError={null} startFailed />\n  else page = \u003cSignInPage client={client} onAuthenticated={onAuthenticated} initialError={initialError} />\n  return \u003c>{page}{mockNotice}\u003c/>\n}\n\nexport const guestAuthPaths = AUTH_PATH"},"auth-validation":{"file":"frontend/src/features/authentication/validation/authValidation.ts","start":1,"end":51,"highlightStart":4,"highlightEnd":51,"scope":"Cả file","symbol":"authValidation.ts","code":"export const EMAIL_MAX_LENGTH = 254\nexport const PASSWORD_MAX_LENGTH = 128\n\nexport function normalizeEmail(value: string): string {\n  return value.trim().toLocaleLowerCase('en-US')\n}\n\nexport function isValidEmail(value: string): boolean {\n  const email = value.trim()\n  if (!email || email.length > EMAIL_MAX_LENGTH) return false\n  return /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)\n}\n\nexport type SignInValues = { email: string; password: string }\nexport type RegistrationValues = SignInValues & { fullName: string; confirmPassword: string; termsAccepted: boolean }\nexport type ResetValues = { email: string; password: string; confirmPassword: string }\n\nexport function validateSignIn(values: SignInValues): Partial\u003cRecord\u003ckeyof SignInValues, string>> {\n  const errors: Partial\u003cRecord\u003ckeyof SignInValues, string>> = {}\n  if (!values.email.trim()) errors.email = 'Vui lòng nhập email.'\n  else if (!isValidEmail(values.email)) errors.email = 'Email không hợp lệ.'\n  if (!values.password) errors.password = 'Vui lòng nhập mật khẩu.'\n  else if (values.password.length > PASSWORD_MAX_LENGTH) errors.password = 'Mật khẩu không được dài quá 128 ký tự.'\n  return errors\n}\n\nexport function validateRegistration(values: RegistrationValues): Partial\u003cRecord\u003ckeyof RegistrationValues, string>> {\n  const errors: Partial\u003cRecord\u003ckeyof RegistrationValues, string>> = {}\n  const name = values.fullName.trim()\n  if (!name) errors.fullName = 'Vui lòng nhập họ và tên.'\n  else if (name.length \u003c 2 || name.length > 100) errors.fullName = 'Họ và tên cần từ 2 đến 100 ký tự.'\n  if (!values.email.trim()) errors.email = 'Vui lòng nhập email.'\n  else if (!isValidEmail(values.email)) errors.email = 'Email không hợp lệ.'\n  if (!values.password) errors.password = 'Vui lòng nhập mật khẩu.'\n  else if (values.password.length \u003c 8 || values.password.length > PASSWORD_MAX_LENGTH) errors.password = 'Mật khẩu cần từ 8 đến 128 ký tự.'\n  else if (normalizeEmail(values.password) === normalizeEmail(values.email)) errors.password = 'Mật khẩu không được trùng với email.'\n  if (!values.confirmPassword) errors.confirmPassword = 'Vui lòng xác nhận mật khẩu.'\n  else if (values.password !== values.confirmPassword) errors.confirmPassword = 'Mật khẩu xác nhận chưa khớp.'\n  if (!values.termsAccepted) errors.termsAccepted = 'Vui lòng đồng ý với Điều khoản sử dụng và Chính sách dữ liệu.'\n  return errors\n}\n\nexport function validateReset(values: ResetValues): Partial\u003cRecord\u003c'email' | 'password' | 'confirmPassword', string>> {\n  const errors: Partial\u003cRecord\u003c'email' | 'password' | 'confirmPassword', string>> = {}\n  if (!values.password) errors.password = 'Vui lòng nhập mật khẩu mới.'\n  else if (values.password.length \u003c 8 || values.password.length > PASSWORD_MAX_LENGTH) errors.password = 'Mật khẩu cần từ 8 đến 128 ký tự.'\n  else if (values.email && normalizeEmail(values.password) === normalizeEmail(values.email)) errors.password = 'Mật khẩu không được trùng với email.'\n  if (!values.confirmPassword) errors.confirmPassword = 'Vui lòng xác nhận mật khẩu mới.'\n  else if (values.password !== values.confirmPassword) errors.confirmPassword = 'Mật khẩu xác nhận chưa khớp.'\n  return errors\n}"},"auth-errors":{"file":"frontend/src/features/authentication/domain/authErrors.ts","start":1,"end":62,"highlightStart":13,"highlightEnd":62,"scope":"Cả file","symbol":"authErrors.ts","code":"import { DEFAULT_FARM_TIME_ZONE } from '../../../shared/lib/date/farmTime'\nimport { BackendError } from '../../../shared/api/backendClient'\nimport { userFacingError } from '../../../shared/api/userFacingError'\n\nexport const AUTH_PATH = {\n  home: '/', signIn: '/sign-in', register: '/dang-ky', verification: '/xac-minh-email',\n  forgot: '/quen-mat-khau', resetSent: '/kiem-tra-email', reset: '/resetpassword',\n  invalid: '/lien-ket-khong-con-hieu-luc', suspended: '/tai-khoan-tam-ngung', loginFailed: '/dang-nhap-that-bai',\n} as const\n\nexport const AUTH_PATHS = new Set\u003cstring>(Object.values(AUTH_PATH).filter((path) => path !== AUTH_PATH.home))\n\nexport const emailFromState = (state: unknown): string => {\n  if (typeof state !== 'object' || state === null || !('email' in state)) return ''\n  return typeof (state as { email?: unknown }).email === 'string' ? (state as { email: string }).email.trim().toLowerCase() : ''\n}\n\nexport const readError = (error: unknown) => ({\n  code: error instanceof BackendError ? error.code : typeof error === 'object' && error !== null && 'code' in error ? String((error as { code?: unknown }).code ?? '') : '',\n  status: error instanceof BackendError ? error.status : typeof error === 'object' && error !== null && 'status' in error ? Number((error as { status?: unknown }).status) : 0,\n  params: error instanceof BackendError ? error.params : typeof error === 'object' && error !== null && 'params' in error ? (error as { params?: Record\u003cstring, unknown> }).params ?? {} : {},\n})\n\n/** MSG-FE01-01: sai email hoặc mật khẩu (không tiết lộ giá trị nào sai). */\nexport function isCredentialError(error: unknown): boolean {\n  const { code, status } = readError(error)\n  if (code === 'MSG-FE01-11') return false\n  const message = error instanceof Error ? error.message.toLowerCase() : ''\n  return code === 'MSG-FE01-01' || status === 401 || (code ?? '').toLowerCase() === 'error.validation' || message.includes('error.validation')\n}\n\nexport const CREDENTIAL_MESSAGE = 'Email hoặc mật khẩu chưa chính xác.'\n\nexport function friendlyLoginError(error: unknown): string {\n  const { code, status, params } = readError(error)\n  if (code === 'MSG-FE01-11') return 'Email chưa được xác minh. Vui lòng mở email xác minh hoặc gửi lại liên kết.'\n  if (isCredentialError(error)) return CREDENTIAL_MESSAGE\n  if (code === 'MSG-FE01-02' || status === 423) {\n    const time = typeof params.time === 'string' ? new Date(params.time).toLocaleTimeString('vi-VN', { timeZone: DEFAULT_FARM_TIME_ZONE, hour: '2-digit', minute: '2-digit' }) : null\n    return `Đăng nhập bằng mật khẩu đang bị khóa sau 5 lần sai. Thử lại sau 15 phút${time ? ` (sau ${time})` : ''} hoặc tiếp tục với Google.`\n  }\n  if (code === 'MSG-FE01-03') return 'Tài khoản đang tạm ngưng.'\n  return userFacingError(error, 'Đăng nhập không thành công. Vui lòng thử lại.')\n}\n\nexport function friendlyAccountError(error: unknown): string {\n  const { code, status } = readError(error)\n  if (code === 'MSG-FE01-10') return 'Email này đã có tài khoản BeefCare. Hãy đăng nhập hoặc dùng chức năng quên mật khẩu.'\n  if (code === 'MSG-FE01-14') return 'Bạn cần đồng ý với Điều khoản sử dụng và Chính sách dữ liệu.'\n  if (code === 'MSG-FE01-08') return 'Mật khẩu cần từ 8 đến 128 ký tự và không được trùng với email.'\n  if (code === 'MSG-FE01-09') return 'Mật khẩu xác nhận chưa khớp.'\n  if (status === 409) return 'Thông tin tài khoản đã được sử dụng. Vui lòng kiểm tra email.'\n  if (status === 400 || status === 422) return 'Thông tin chưa hợp lệ. Vui lòng kiểm tra lại các trường đã nhập.'\n  return userFacingError(error, 'Không thể hoàn tất yêu cầu. Vui lòng thử lại.')\n}\n\nexport function friendlyEmailRequestError(error: unknown): string {\n  const { status } = readError(error)\n  if (status === 429) return 'Bạn đã gửi quá nhiều yêu cầu. Vui lòng thử lại sau.'\n  if (status === 400 || status === 422) return 'Yêu cầu chưa hợp lệ. Vui lòng kiểm tra email rồi thử lại.'\n  return userFacingError(error, 'Chưa gửi được email. Vui lòng thử lại sau.')\n}"},"auth-types":{"file":"frontend/src/features/authentication/types.ts","start":1,"end":31,"highlightStart":1,"highlightEnd":31,"scope":"Cả file hợp đồng TypeScript","symbol":"authentication/types.ts","code":"export type RegistrationRequest = {\n  fullName: string\n  email: string\n  password: string\n  confirmPassword: string\n  termsAccepted: boolean\n}\n\nexport type PasswordResetValidation = { valid: boolean; email?: string }\nexport type ResendResult = { nextAllowedAt: string }\n\n/** Implementations must be selected explicitly; a failed backend request is never a reason to switch modes. */\nexport type AuthClient = {\n  mode?: 'backend' | 'mock'\n  /** Chỉ client mô phỏng: tài khoản theo vai trò để chọn nhanh trên trang đăng nhập. */\n  demoAccounts?: ReadonlyArray\u003c{ label: string; email: string; password: string }>\n  /** Chỉ client mô phỏng: email mở khung lỗi sai thông tin và tài khoản tạm ngưng. */\n  demoErrorEmails?: { wrongCredentials: string; suspended: string }\n  isAuthenticated: () => Promise\u003cboolean>\n  login: (username: string, password: string, rememberMe?: boolean) => Promise\u003cvoid>\n  logout: () => Promise\u003cvoid>\n  register?: (request: RegistrationRequest) => Promise\u003cvoid>\n  resendVerification?: (email: string) => Promise\u003cResendResult>\n  requestPasswordReset?: (email: string) => Promise\u003cvoid>\n  validatePasswordReset?: (token: string) => Promise\u003cPasswordResetValidation>\n  resetPassword?: (token: string, newPassword: string, confirmPassword: string) => Promise\u003cvoid>\n  getPublicLanding?: () => Promise\u003cunknown>\n  getPublicPrices?: () => Promise\u003cunknown>\n}\n\nexport type AuthStatusView = 'sign-in' | 'verification-sent' | 'reset-sent' | 'reset-success' | 'invalid-link' | 'suspended'"},"email-sent-page":{"file":"frontend/src/features/authentication/pages/EmailSentPage.tsx","start":1,"end":90,"highlightStart":18,"highlightEnd":70,"scope":"Cả file","symbol":"EmailSentPage.tsx","code":"import { useEffect, useState } from 'react'\nimport { useLocation } from 'react-router-dom'\nimport { Icon } from '../../../shared/ui'\nimport type { AuthClient } from '../types'\nimport { normalizeEmail } from '../validation/authValidation'\nimport { AuthShell, primaryButtonClass } from '../components/AuthShell'\nimport { ActionLink } from '../components/AuthControls'\nimport { AUTH_PATH, emailFromState, friendlyEmailRequestError } from '../domain/authErrors'\nimport { Link } from 'react-router-dom'\n\n/** Nút gửi lại: khóa 60 giây sau mỗi lần gửi (SCR-04, SCR-05). */\nfunction secondsUntil(value: unknown): number {\n  if (typeof value !== 'string') return 0\n  const timestamp = Date.parse(value)\n  return Number.isFinite(timestamp) ? Math.max(0, Math.ceil((timestamp - Date.now()) / 1000)) : 0\n}\n\nfunction useResend(onSend: () => Promise\u003c{ nextAllowedAt?: string } | void>, initialNextAllowedAt?: string) {\n  const [seconds, setSeconds] = useState(() => secondsUntil(initialNextAllowedAt))\n  const [busy, setBusy] = useState(false)\n  const [error, setError] = useState\u003cstring | null>(null)\n  useEffect(() => {\n    if (seconds \u003c= 0) return\n    const timer = window.setTimeout(() => setSeconds((value) => value - 1), 1000)\n    return () => window.clearTimeout(timer)\n  }, [seconds])\n  const send = async () => {\n    setBusy(true); setError(null)\n    try {\n      const result = await onSend()\n      const next = result?.nextAllowedAt ? Date.parse(result.nextAllowedAt) : Date.now() + 60_000\n      setSeconds(Math.max(0, Math.ceil((next - Date.now()) / 1000)))\n    }\n    catch (reason) { setError(friendlyEmailRequestError(reason)) }\n    finally { setBusy(false) }\n  }\n  return { seconds, busy, error, send }\n}\n\nfunction EmailCard({ email, tone }: { email: string; tone: 'verification' | 'reset' }) {\n  const text = email || 'địa chỉ email bạn vừa nhập'\n  if (tone === 'reset') return \u003cdiv className=\"rounded-[14px] bg-[#eef4ef] px-5 py-4 text-[15px] font-bold text-brand-dark break-all\">{text}\u003c/div>\n  return (\n    \u003cdiv className=\"rounded-[14px] bg-[#eef4ef] px-5 py-3\">\n      \u003cp className=\"m-0 text-[11px] text-subtle\">Liên kết xác minh đã gửi tới\u003c/p>\n      \u003cp className=\"m-0 mt-0.5 break-all text-[15px] font-bold text-ink\">{text}\u003c/p>\n    \u003c/div>\n  )\n}\n\nexport function EmailSentPage({ client, kind }: { client: AuthClient; kind: 'verification' | 'reset' }) {\n  const location = useLocation()\n  const email = emailFromState(location.state) || normalizeEmail(new URLSearchParams(location.search).get('email') || '')\n  const initialNextAllowedAt = typeof location.state === 'object' && location.state !== null && 'nextAllowedAt' in location.state\n    ? String((location.state as { nextAllowedAt?: unknown }).nextAllowedAt ?? '')\n    : undefined\n  const verification = kind === 'verification'\n  const resendFn = verification ? client.resendVerification : client.requestPasswordReset\n  const { seconds, busy, error, send } = useResend(async () => { if (resendFn && email) return resendFn(email) }, initialNextAllowedAt)\n  const canResend = Boolean(resendFn && email)\n\n  if (verification) {\n    return (\n      \u003cAuthShell title=\"Xác minh email\" description=\"Chúng tôi đã gửi liên kết xác minh đến email của bạn. Mở thư và nhấn liên kết để tiếp tục.\" eyebrow=\"Kiểm tra hộp thư\" footer={\u003cActionLink to={AUTH_PATH.signIn}>\u003cIcon name=\"arrow-left\" size={13} className=\"mr-1 inline\" />Quay lại đăng nhập\u003c/ActionLink>}>\n        \u003cdiv className=\"space-y-4\">\n          \u003cEmailCard email={email} tone=\"verification\" />\n          \u003cp className=\"m-0 text-xs leading-5 text-subtle\">Liên kết chỉ dùng được một lần và có thời hạn. Nếu chưa thấy thư, hãy kiểm tra mục thư rác. Gửi lại sẽ làm liên kết cũ hết hiệu lực.\u003c/p>\n          {canResend && \u003cbutton type=\"button\" onClick={send} disabled={busy || seconds > 0} className={primaryButtonClass}>{busy ? 'Đang gửi…' : seconds > 0 ? `Đã gửi · thử lại sau ${seconds}s` : 'Gửi lại email xác minh'}\u003c/button>}\n          {error && \u003cp role=\"alert\" className=\"m-0 text-xs text-[#b54843]\">{error}\u003c/p>}\n          \u003cp className=\"m-0 text-center text-[13px] text-subtle\">Có thể gửi lại sau 60 giây · tối đa 5 lần mỗi giờ\u003c/p>\n        \u003c/div>\n      \u003c/AuthShell>\n    )\n  }\n  return (\n    \u003cAuthShell title=\"Kiểm tra email\" description=\"Nếu email thuộc tài khoản BeefCare, liên kết đặt lại đã được gửi.\" eyebrow=\"Liên kết đã gửi\">\n      \u003cdiv className=\"space-y-5\">\n        \u003cdiv className=\"flex flex-col items-center gap-4 text-center\">\n          \u003cspan aria-hidden=\"true\" className=\"grid size-20 place-items-center rounded-full bg-[#d7f0e1] text-brand\">\u003cIcon name=\"circle-check\" size={36} />\u003c/span>\n          \u003cp className=\"m-0 text-base leading-6 text-subtle\">Mở hộp thư để tiếp tục đặt mật khẩu. Nếu chưa thấy thư, hãy kiểm tra mục thư rác.\u003c/p>\n        \u003c/div>\n        \u003cEmailCard email={email} tone=\"reset\" />\n        \u003cp className=\"m-0 text-xs text-subtle\">Liên kết có hiệu lực 30 phút và chỉ dùng được một lần.\u003c/p>\n        \u003cLink to={AUTH_PATH.signIn} className={`${primaryButtonClass} no-underline`}>Quay lại đăng nhập\u003c/Link>\n        {canResend && \u003cdiv className=\"text-center\">\u003cbutton type=\"button\" onClick={send} disabled={busy || seconds > 0} className=\"cursor-pointer border-0 bg-transparent text-[13px] font-bold text-brand hover:underline disabled:cursor-not-allowed disabled:text-subtle\">{busy ? 'Đang gửi…' : seconds > 0 ? `Gửi lại liên kết · thử lại sau ${seconds}s` : 'Gửi lại liên kết'}\u003c/button>\u003c/div>}\n        {error && \u003cp role=\"alert\" className=\"m-0 text-center text-xs text-[#b54843]\">{error}\u003c/p>}\n      \u003c/div>\n    \u003c/AuthShell>\n  )\n}"},"farm-workspace-usecase":{"file":"frontend/src/features/farm-workspace/hooks/useFarmWorkspaceUseCase.ts","start":1,"end":118,"highlightStart":49,"highlightEnd":117,"scope":"Cả hook use case","symbol":"useFarmWorkspaceUseCase()","code":"import { useCallback } from 'react'\nimport { useQuery } from '../../../shared/hooks/useQuery'\nimport { farmWorkspaceApi } from '../api/farmWorkspaceApi'\nimport type {\n  AcceptedInvitation, ChangeMemberInput, CompleteOwnerProfileInput, FarmDetails, FarmInfoInput, FarmRegistrationInput,\n  FarmRole, FarmSummary, FarmWorkspaceProfile, Invitation, InvitationListQuery, InvitationPage, InvitationPreview, InviteMemberInput,\n  MemberCommandOptions, MemberList, Membership, RequestKeyOptions,\n} from '../types'\n\ntype QueryResult\u003cT> = ReturnType\u003ctypeof useQuery\u003cT>>\n\nexport type FarmListMode = 'normal' | 'empty' | 'load-error'\n\nexport interface FarmWorkspaceUseCaseInput {\n  loadProfile?: boolean\n  loadFarms?: boolean\n  farmsMode?: FarmListMode\n  farmId?: number | null\n  loadFarm?: boolean\n  loadMembers?: boolean\n  memberViewer?: FarmRole\n  invitationQuery?: InvitationListQuery | null\n  invitationToken?: string | null\n  signedInEmail?: string\n  refreshKey?: number\n}\n\nexport interface FarmWorkspaceUseCaseResult {\n  profile: QueryResult\u003cFarmWorkspaceProfile | null>\n  farms: QueryResult\u003cFarmSummary[] | null>\n  farm: QueryResult\u003cFarmDetails | null>\n  members: QueryResult\u003cMemberList | null>\n  invitations: QueryResult\u003cInvitationPage | null>\n  invitationPreview: QueryResult\u003cInvitationPreview | null>\n  getProfile: () => Promise\u003cFarmWorkspaceProfile>\n  completeOwnerRegistration: (input: CompleteOwnerProfileInput) => Promise\u003cFarmWorkspaceProfile>\n  registerFarm: (input: FarmRegistrationInput, options?: RequestKeyOptions) => Promise\u003cFarmDetails>\n  updateFarm: (farmId: number, input: FarmInfoInput, options?: RequestKeyOptions) => Promise\u003cFarmDetails>\n  selectFarm: (farmId: number) => Promise\u003cFarmSummary>\n  changeMember: (farmId: number, memberId: number, input: ChangeMemberInput, options?: MemberCommandOptions) => Promise\u003cMembership>\n  inviteMember: (farmId: number, input: InviteMemberInput, options?: RequestKeyOptions) => Promise\u003cInvitation>\n  resendInvitation: (farmId: number, invitationId: number, options?: MemberCommandOptions) => Promise\u003cInvitation>\n  cancelInvitation: (farmId: number, invitationId: number, options?: MemberCommandOptions) => Promise\u003cInvitation>\n  listMembers: (farmId: number, viewer?: FarmRole) => Promise\u003cMemberList>\n  listInvitations: (farmId: number, query?: InvitationListQuery) => Promise\u003cInvitationPage>\n  acceptInvitation: (token: string, signedInEmail?: string) => Promise\u003cAcceptedInvitation>\n}\n\n/**\n * Feature boundary for farm-workspace reads and commands.\n * Pages/components own view state and validation; this hook owns query lifecycle\n * and is the only UI-layer caller of the feature API.\n */\nexport function useFarmWorkspaceUseCase({\n  loadProfile = false,\n  loadFarms = false,\n  farmsMode = 'normal',\n  farmId = null,\n  loadFarm = false,\n  loadMembers = false,\n  memberViewer = 'OWNER',\n  invitationQuery = null,\n  invitationToken = null,\n  signedInEmail = '',\n  refreshKey = 0,\n}: FarmWorkspaceUseCaseInput = {}): FarmWorkspaceUseCaseResult {\n  const invitationStatus = invitationQuery?.status\n  const invitationPage = invitationQuery?.page\n  const invitationSize = invitationQuery?.size\n  const invitationSort = invitationQuery?.sort\n  const invitationDir = invitationQuery?.dir\n  const invitationId = invitationQuery?.invitationId\n\n  const profile = useQuery\u003cFarmWorkspaceProfile | null>(\n    () => loadProfile ? farmWorkspaceApi.getProfile() : Promise.resolve(null),\n    [loadProfile, refreshKey],\n  )\n  const farms = useQuery\u003cFarmSummary[] | null>(\n    () => {\n      if (!loadFarms) return Promise.resolve(null)\n      if (farmsMode === 'load-error') return Promise.reject(new Error('Không tải được danh sách trang trại.'))\n      if (farmsMode === 'empty') return Promise.resolve([])\n      return farmWorkspaceApi.listFarms()\n    },\n    [loadFarms, farmsMode, refreshKey],\n  )\n  const farm = useQuery\u003cFarmDetails | null>(\n    () => loadFarm && farmId !== null ? farmWorkspaceApi.getFarm(farmId) : Promise.resolve(null),\n    [loadFarm, farmId, refreshKey],\n  )\n  const members = useQuery\u003cMemberList | null>(\n    () => loadMembers && farmId !== null ? farmWorkspaceApi.listMembers(farmId, memberViewer) : Promise.resolve(null),\n    [loadMembers, farmId, memberViewer, refreshKey],\n  )\n  const invitations = useQuery\u003cInvitationPage | null>(\n    () => invitationQuery !== null && farmId !== null ? farmWorkspaceApi.listInvitations(farmId, invitationQuery) : Promise.resolve(null),\n    [farmId, invitationStatus, invitationPage, invitationSize, invitationSort, invitationDir, invitationId, refreshKey],\n  )\n  const invitationPreview = useQuery\u003cInvitationPreview | null>(\n    () => invitationToken ? farmWorkspaceApi.previewInvitation(invitationToken, signedInEmail) : Promise.resolve(null),\n    [invitationToken, signedInEmail, refreshKey],\n  )\n\n  const completeOwnerRegistration = useCallback((input: CompleteOwnerProfileInput) => farmWorkspaceApi.completeOwnerRegistration(input), [])\n  const getProfile = useCallback(() => farmWorkspaceApi.getProfile(), [])\n  const registerFarm = useCallback((input: FarmRegistrationInput, options?: RequestKeyOptions) => farmWorkspaceApi.registerFarm(input, options), [])\n  const updateFarm = useCallback((id: number, input: FarmInfoInput, options?: RequestKeyOptions) => farmWorkspaceApi.updateFarm(id, input, options), [])\n  const selectFarm = useCallback((id: number) => farmWorkspaceApi.selectFarm(id), [])\n  const changeMember = useCallback((id: number, memberId: number, input: ChangeMemberInput, options?: MemberCommandOptions) => farmWorkspaceApi.changeMember(id, memberId, input, options), [])\n  const inviteMember = useCallback((id: number, input: InviteMemberInput, options?: RequestKeyOptions) => farmWorkspaceApi.inviteMember(id, input, options), [])\n  const resendInvitation = useCallback((id: number, invitationIdValue: number, options?: MemberCommandOptions) => farmWorkspaceApi.resendInvitation(id, invitationIdValue, options), [])\n  const cancelInvitation = useCallback((id: number, invitationIdValue: number, options?: MemberCommandOptions) => farmWorkspaceApi.cancelInvitation(id, invitationIdValue, options), [])\n  const listMembers = useCallback((id: number, viewer?: FarmRole) => farmWorkspaceApi.listMembers(id, viewer), [])\n  const listInvitations = useCallback((id: number, query?: InvitationListQuery) => farmWorkspaceApi.listInvitations(id, query), [])\n  const acceptInvitation = useCallback((token: string, email?: string) => farmWorkspaceApi.acceptInvitation(token, email), [])\n\n  return { profile, farms, farm, members, invitations, invitationPreview, getProfile, completeOwnerRegistration, registerFarm, updateFarm, selectFarm, changeMember, inviteMember, resendInvitation, cancelInvitation, listMembers, listInvitations, acceptInvitation }\n}"},"workspace-validation":{"file":"frontend/src/features/farm-workspace/validation/workspaceValidation.ts","start":1,"end":104,"highlightStart":15,"highlightEnd":44,"scope":"Cả file validation","symbol":"workspaceValidation.ts","code":"import { ACCEPTED_FARM_TIME_ZONES, businessDate } from '../../../shared/lib/date/farmTime'\nimport type {\n  ChangeMemberInput,\n  CompleteOwnerProfileInput,\n  FarmInfoInput,\n  FarmRegistrationInput,\n  InviteMemberInput,\n} from '../types'\nimport { PROVINCES } from '../constants/provinces'\n\nexport type FormErrors\u003cT extends object> = Partial\u003cRecord\u003ckeyof T, string>>\n\nconst PHONE_PATTERN = /^(?:0\\d{9}|\\+84\\d{9})$/\n/** Số điện thoại có thể gõ kèm dấu cách, chấm hoặc gạch (\"0912 345 678\"); chỉ kiểm tra và gửi dạng đã bỏ ký tự phân tách. */\nexport const compactPhone = (value: string) => value.replace(/[\\s.-]/g, '')\nconst PHONE = { test: (value: string) => PHONE_PATTERN.test(compactPhone(value)) }\nconst NAME = (value: unknown, min: number, max: number) => typeof value === 'string' && value.trim().length >= min && value.trim().length \u003c= max\nconst optionalText = (value: unknown, max: number) => value == null || (typeof value === 'string' && value.length \u003c= max)\nconst blank = (value: unknown) => typeof value !== 'string' || value.trim() === ''\n\n/**\n * Name, province and commune of SCR-10 / SCR-11: \"{field} là bắt buộc.\" (MSG-COM-06) when empty, the bounds or list\n * message only when something was entered.\n */\nfunction farmLocationErrors(input: { name?: unknown; province?: string | null; commune?: unknown }) {\n  const errors: { name?: string; province?: string; commune?: string } = {}\n  if (blank(input.name)) errors.name = 'Tên trại là bắt buộc.'\n  else if (!NAME(input.name, 2, 150)) errors.name = 'Tên trại cần có từ 2 đến 150 ký tự.'\n  const province = input.province?.trim() ?? ''\n  if (!province) errors.province = 'Tỉnh/Thành là bắt buộc.'\n  else if (!(PROVINCES as readonly string[]).includes(province)) errors.province = 'Chọn tỉnh hoặc thành phố trong danh sách.'\n  if (blank(input.commune)) errors.commune = 'Xã/Phường là bắt buộc.'\n  else if (!NAME(input.commune, 1, 150)) errors.commune = 'Xã/Phường tối đa 150 ký tự.'\n  return errors\n}\n\nexport function validateOwnerProfile(input: Partial\u003cCompleteOwnerProfileInput>): FormErrors\u003cCompleteOwnerProfileInput> {\n  const errors: FormErrors\u003cCompleteOwnerProfileInput> = {}\n  if (!NAME(input.fullName, 2, 100)) errors.fullName = 'Họ tên cần có từ 2 đến 100 ký tự.'\n  if (input.phone && !PHONE.test(input.phone.trim())) errors.phone = 'Nhập số điện thoại Việt Nam hợp lệ.'\n  if (input.termsAccepted !== true) errors.termsAccepted = 'Bạn cần đồng ý với Điều khoản sử dụng và Chính sách dữ liệu.'\n  return errors\n}\n\n/** SCR-10 (UC-FE02-01). Tỉnh phải thuộc danh sách 34 tỉnh/thành (quyết định FE-02 Q3); quy mô dự kiến không bắt buộc. */\nexport function validateFarmRegistration(input: Partial\u003cOmit\u003cFarmRegistrationInput, 'expectedHerdSize'>> & { expectedHerdSize?: string }): FormErrors\u003cFarmRegistrationInput> {\n  const errors: FormErrors\u003cFarmRegistrationInput> = { ...farmLocationErrors(input) }\n  if (!optionalText(input.detailedAddress, 255)) errors.detailedAddress = 'Địa chỉ chi tiết tối đa 255 ký tự.'\n  if (!optionalText(input.contactPerson, 100)) errors.contactPerson = 'Người liên hệ tối đa 100 ký tự.'\n  if (input.contactPhone && !PHONE.test(input.contactPhone.trim())) errors.contactPhone = 'Nhập số điện thoại Việt Nam hợp lệ.'\n  if (!optionalText(input.registrationCertificateInfo, 255)) errors.registrationCertificateInfo = 'Thông tin giấy chứng nhận tối đa 255 ký tự.'\n  if (input.expectedHerdSize && !['UNDER_50', '50_149', '150_300', 'OVER_300'].includes(input.expectedHerdSize)) errors.expectedHerdSize = 'Chọn quy mô đàn dự kiến.'\n  if (input.mainBreedCodes != null && !Array.isArray(input.mainBreedCodes)) errors.mainBreedCodes = 'Danh sách giống không hợp lệ.'\n  return errors\n}\n\n/**\n * SCR-11 (UC-FE02-03). Như SCR-10 cho tỉnh (Q3), cộng phần vận hành: múi giờ UTC+7 (D39), giờ ca sáng\n * HH:mm, ghi chú tối đa 1.000 ký tự. Tên tỉnh cũ ngoài danh sách vẫn hiện để Chủ trại thấy và chọn lại.\n */\nexport function validateFarmInfo(input: Partial\u003cFarmInfoInput>): FormErrors\u003cFarmInfoInput> {\n  const errors: FormErrors\u003cFarmInfoInput> = { ...farmLocationErrors(input) }\n  if (!optionalText(input.detailedAddress, 255)) errors.detailedAddress = 'Địa chỉ chi tiết tối đa 255 ký tự.'\n  if (!optionalText(input.contactPerson, 100)) errors.contactPerson = 'Người liên hệ tối đa 100 ký tự.'\n  if (input.contactPhone && !PHONE.test(input.contactPhone.trim())) errors.contactPhone = 'Nhập số điện thoại Việt Nam hợp lệ.'\n  if (!optionalText(input.registrationCertificateInfo, 255)) errors.registrationCertificateInfo = 'Thông tin giấy chứng nhận tối đa 255 ký tự.'\n  const timeZone = input.timeZone?.trim() ?? ''\n  if (timeZone && !ACCEPTED_FARM_TIME_ZONES.has(timeZone)) errors.timeZone = 'Múi giờ phải là UTC+7.'\n  if (input.morningShiftStart && !/^([01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d)?$/.test(input.morningShiftStart)) errors.morningShiftStart = 'Nhập giờ theo định dạng HH:mm.'\n  if (!optionalText(input.operatingNotes, 1000)) errors.operatingNotes = 'Ghi chú vận hành tối đa 1.000 ký tự.'\n  return errors\n}\n\nexport function validateInvite(input: Partial\u003cOmit\u003cInviteMemberInput, 'role' | 'validityDays'>> & { role?: string; validityDays?: number }): FormErrors\u003cInviteMemberInput> {\n  const errors: FormErrors\u003cInviteMemberInput> = {}\n  const email = input.email?.trim() ?? ''\n  // TC-03-01/02: thiếu giá trị là MSG-COM-06, sai định dạng / quá 254 ký tự là MSG-COM-10.\n  if (!email) errors.email = 'Email người nhận là bắt buộc.'\n  else if (email.length > 254 || !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) errors.email = 'Nhập địa chỉ email hợp lệ.'\n  if (!input.role) errors.role = 'Vai trò là bắt buộc.'\n  else if (input.role !== 'MANAGER' && input.role !== 'TECHNICIAN') errors.role = 'Chọn Quản lý hoặc Kỹ thuật viên.'\n  if (![3, 7, 14].includes(Number(input.validityDays))) errors.validityDays = 'Thời hạn lời mời là 3, 7 hoặc 14 ngày.'\n  return errors\n}\n\n/** GBR-66: ngày nghiệp vụ Việt Nam, kể cả khi UTC còn ở ngày hôm trước. */\nexport const farmToday = businessDate\n\n/** Same rule as the server (Table III-1, D30): trimmed, at least 5 non-space characters, at most 500. */\nexport const MEMBER_REASON_RULE = 'Lý do cần ít nhất 5 ký tự (không tính khoảng trắng) và tối đa 500 ký tự.'\nconst visibleCharacters = (value: string) => [...value].filter((character) => !/\\s/u.test(character)).length\n\n/** UC-FE03-06 popup (D30): COM-06 for an empty field, COM-07 for a future date, COM-10 for a reason outside 5–500. */\nexport function validateMemberChange(input: Partial\u003cChangeMemberInput>, today = farmToday()): FormErrors\u003cChangeMemberInput> {\n  const errors: FormErrors\u003cChangeMemberInput> = {}\n  if (!['CHANGE_ROLE', 'DEACTIVATE', 'REACTIVATE'].includes(String(input.action))) errors.action = 'Chọn hành động.'\n  if (input.action === 'CHANGE_ROLE' && input.role !== 'MANAGER' && input.role !== 'TECHNICIAN') errors.role = 'Chọn vai trò mới.'\n  if (!input.effectiveDate) errors.effectiveDate = 'Ngày hiệu lực là bắt buộc.'\n  else if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(input.effectiveDate) || input.effectiveDate > today) errors.effectiveDate = 'Ngày hiệu lực không được ở tương lai.'\n  const reason = typeof input.reason === 'string' ? input.reason.trim() : ''\n  if (!reason) errors.reason = 'Lý do là bắt buộc.'\n  else if (reason.length > 500 || visibleCharacters(reason) \u003c 5) errors.reason = MEMBER_REASON_RULE\n  return errors\n}"},"backend-transport":{"file":"frontend/src/shared/api/backendTransport.ts","start":1,"end":16,"highlightStart":5,"highlightEnd":16,"scope":"Cả file","symbol":"backendTransport.ts","code":"import { backendBaseUrl } from '../config/runtime'\nimport { createBackendClient } from './backendClient'\nimport { notifySessionExpired } from './sessionExpiry'\n\nexport interface BackendTransport {\n  get(path: string, options?: { headers?: Record\u003cstring, string> }): Promise\u003cunknown>\n  command(path: string, body: unknown, options?: { method?: string; key?: string; headers?: Record\u003cstring, string> }): Promise\u003cunknown>\n  /** Null (no farm entered in this tab) builds a path the client refuses to send. */\n  farmPath(farmId: string | number | null, suffix?: string): string\n}\n\n/** The one HTTP client every feature API shares (CSRF token, credentials, Idempotency-Key, 401 signal). */\nexport const backendTransport: BackendTransport = createBackendClient({\n  baseUrl: backendBaseUrl,\n  onUnauthorized: notifySessionExpired,\n})"},"session-profile":{"file":"frontend/src/app/session/sessionProfile.ts","start":1,"end":40,"highlightStart":16,"highlightEnd":40,"scope":"Cả file mapper","symbol":"sessionFromProfile()","code":"import { asRecord, asRows, numberValue, textValue } from '../../shared/api/parse'\nimport type { AppRole, FarmRole, PlatformRole, SessionUser } from './sessionTypes'\n\nconst PLATFORM_ROLES: readonly PlatformRole[] = ['CS', 'PM', 'SA']\nconst FARM_ROLES: readonly FarmRole[] = ['OWNER', 'MANAGER', 'TECHNICIAN']\n\nexport const isPlatformRole = (role: string): role is PlatformRole => PLATFORM_ROLES.includes(role as PlatformRole)\n\n/** A profile fact, not an authorization policy: recognizes a farm membership role returned by the server. */\nexport const isFarmRole = (role: string): role is FarmRole => FARM_ROLES.includes(role as FarmRole)\n\n/**\n * Normalizes GET /api/account/profile into session facts. The caller owns the selected tab farm;\n * this function never reads browser storage or makes navigation/permission decisions.\n */\nexport function sessionFromProfile(value: unknown, selectedFarmId: number | null): SessionUser {\n  const row = asRecord(value)\n  const farms = asRows(row.farms)\n  const farm = selectedFarmId == null ? undefined : farms.find((item) => Number(item.farmId) === selectedFarmId)\n  const platformRole = textValue(row.platformRole)\n  const farmRole = farm ? textValue(farm.role) : FARM_ROLES.find((role) => farms.some((item) => textValue(item.role) === role)) ?? ''\n  // Tài khoản mới chưa có trại vẫn là chủ trại đang hoàn tất đăng ký (SCR-07 → SCR-10).\n  const role = (isPlatformRole(platformRole) ? platformRole : isFarmRole(farmRole) ? farmRole : 'OWNER') as AppRole\n\n  return {\n    id: numberValue(row.id),\n    role,\n    fullName: textValue(row.fullName),\n    email: textValue(row.email),\n    farmId: farm ? numberValue(farm.farmId) : null,\n    farmName: farm ? textValue(farm.farmName) : null,\n    ownerRegistrationCompleted: row.ownerRegistrationCompleted === true,\n    platformRole: isPlatformRole(platformRole) ? platformRole : null,\n    activeFarmCount: farms.filter((item) => textValue(item.serviceStatus, 'ACTIVE') === 'ACTIVE').length,\n    farmCount: farms.length,\n    farmRoles: Object.fromEntries(farms\n      .filter((item) => isFarmRole(textValue(item.role)))\n      .map((item) => [numberValue(item.farmId), textValue(item.role) as AppRole])),\n  }\n}"},"account-mapper":{"file":"frontend/src/features/account/api/accountMapper.ts","start":1,"end":37,"highlightStart":5,"highlightEnd":37,"scope":"Cả file mapper","symbol":"accountMapper.ts","code":"import { asRecord, asRows, numberValue, textValue } from '../../../shared/api/parse'\nimport type { AccountProfile, FarmPermissions } from '../types'\n\n/** ProfileResponse (GET /api/account/profile) → AccountProfile. */\nexport function mapAccountProfile(value: unknown): AccountProfile {\n  const row = asRecord(value)\n  return {\n    id: numberValue(row.id), email: textValue(row.email), fullName: textValue(row.fullName), phone: textValue(row.contactPhone ?? row.phone),\n    emailVerified: row.emailVerified === true, passwordSignInEnabled: row.passwordSignInEnabled === true,\n    googleSignInLinked: row.googleSignInLinked === true, ownerRegistrationCompleted: row.ownerRegistrationCompleted === true,\n    termsAccepted: row.termsAccepted === true,\n    status: textValue(row.status, 'ACTIVE'),\n    signInMethods: Array.isArray(row.signInMethods) ? row.signInMethods.filter((item): item is string => typeof item === 'string') : [],\n    hasPassword: row.hasPassword === true || row.passwordSignInEnabled === true,\n    platformRole: typeof row.platformRole === 'string' ? row.platformRole : null,\n    farms: asRows(row.farms).map((farm) => ({\n      farmId: numberValue(farm.farmId), farmName: textValue(farm.farmName), role: textValue(farm.role),\n      serviceStatus: textValue(farm.serviceStatus),\n      permissions: Array.isArray(farm.permissions) ? farm.permissions.filter((item): item is string => typeof item === 'string') : [],\n    })),\n  }\n}\n\n/** GET /api/farms/{farmId}/my-permissions → FarmPermissions; an unknown role or level is an error, never a guess. */\nexport function mapFarmPermissions(value: unknown): FarmPermissions {\n  const row = asRecord(value)\n  const role = textValue(row.role)\n  if (role !== 'OWNER' && role !== 'MANAGER' && role !== 'TECHNICIAN') throw new Error('Máy chủ không trả vai trò trại hợp lệ.')\n  return {\n    role,\n    permissions: asRows(row.permissions).map((item) => {\n      const value = textValue(item.value)\n      if (value !== 'FULL' && value !== 'RESTRICTED' && value !== 'NO') throw new Error('Máy chủ không trả quyền trại hợp lệ.')\n      return { area: textValue(item.area), value }\n    }),\n  }\n}"},"profile-validation":{"file":"frontend/src/features/account/validation/profileValidation.ts","start":1,"end":29,"highlightStart":9,"highlightEnd":29,"scope":"Cả file validation","symbol":"profileValidation.ts","code":"import type { PasswordChangeInput, PasswordErrors, ProfileErrors, ProfileUpdateInput } from '../types'\n\nexport const PASSWORD_RULE_MESSAGE = 'Mật khẩu cần từ 8 đến 128 ký tự và không được trùng với email.'\nconst PHONE = /^(0\\d{9}|\\+84\\d{9})$/\n\nexport const compactPhone = (value: string) => value.replace(/[\\s.-]/g, '')\n\n/** SCR-08: họ tên 2–100 ký tự; điện thoại không bắt buộc, định dạng Việt Nam (MSG-COM-06, MSG-COM-10). */\nexport function validateProfile(input: ProfileUpdateInput): ProfileErrors {\n  const errors: ProfileErrors = {}\n  const name = input.fullName.trim()\n  if (!name) errors.fullName = 'Họ và tên là bắt buộc.'\n  else if (name.length \u003c 2 || name.length > 100) errors.fullName = 'Họ và tên cần từ 2 đến 100 ký tự.'\n  const phone = compactPhone(input.phone)\n  if (phone && !PHONE.test(phone)) errors.phone = 'Số điện thoại không hợp lệ.'\n  return errors\n}\n\n/** GBR-02, UC-FE01-06. `requireCurrent` false khi đã xác thực lại với Google hoặc thêm mật khẩu đầu tiên. */\nexport function validatePasswordChange(input: PasswordChangeInput, ctx: { email: string; requireCurrent: boolean }): PasswordErrors {\n  const errors: PasswordErrors = {}\n  if (ctx.requireCurrent && !input.currentPassword) errors.currentPassword = 'Mật khẩu hiện tại là bắt buộc.'\n  const next = input.newPassword\n  if (!next) errors.newPassword = 'Mật khẩu mới là bắt buộc.'\n  else if (next.length \u003c 8 || next.length > 128 || next.toLowerCase() === ctx.email.trim().toLowerCase()) errors.newPassword = PASSWORD_RULE_MESSAGE\n  if (!input.confirmPassword) errors.confirmPassword = 'Vui lòng nhập lại mật khẩu mới.'\n  else if (input.confirmPassword !== next) errors.confirmPassword = 'Mật khẩu xác nhận chưa khớp.'\n  return errors\n}"},"use-query":{"file":"frontend/src/shared/hooks/useQuery.ts","start":1,"end":32,"highlightStart":4,"highlightEnd":32,"scope":"Cả hook","symbol":"useQuery()","code":"import { useCallback, useEffect, useRef, useState, type DependencyList } from 'react'\n\n/** Loads data for a page. A newer request (or `setData`) wins: the answer of an older, stale request is ignored. */\nexport function useQuery\u003cT>(fetcher: () => Promise\u003cT>, deps: DependencyList = []) {\n  const [state, setState] = useState\u003c{ data: T | null; loading: boolean; error: unknown }>({ data: null, loading: true, error: null })\n  const fetcherRef = useRef(fetcher); fetcherRef.current = fetcher\n  const requestId = useRef(0)\n  const run = useCallback(async (): Promise\u003cT> => {\n    const currentRequest = ++requestId.current\n    setState((s) => ({ ...s, loading: true, error: null }))\n    try {\n      const data = await fetcherRef.current()\n      if (currentRequest === requestId.current) setState({ data, loading: false, error: null })\n      return data\n    } catch (error) {\n      if (currentRequest === requestId.current) setState({ data: null, loading: false, error })\n      throw error\n    }\n  }, [])\n  const setData = useCallback((data: T) => {\n    requestId.current += 1\n    setState({ data, loading: false, error: null })\n  }, [])\n  useEffect(() => {\n    void run().catch(() => undefined)\n    return () => { requestId.current += 1 }\n  }, deps)\n  // Screens wire `onRetry={query.refetch}` and `await query.refetch()` after a command: a failure stays in `error` (shown by\n  // the screen) and never becomes an unhandled rejection. Resolves the data, or undefined when loading failed.\n  const refetch = useCallback((): Promise\u003cT | undefined> => run().catch(() => undefined), [run])\n  return { ...state, refetch, setData }\n}"},"user-facing-error":{"file":"frontend/src/shared/api/userFacingError.ts","start":1,"end":23,"highlightStart":7,"highlightEnd":23,"scope":"Cả file","symbol":"userFacingError()","code":"import { BackendError } from './backendClient'\n\ntype ErrorShape = { status?: unknown; message?: unknown; fieldErrors?: unknown[]; violations?: unknown[] }\nconst shape = (value: unknown): ErrorShape => typeof value === 'object' && value !== null ? value as ErrorShape : {}\nconst rawMessage = (error: unknown): string => error instanceof Error ? error.message : typeof error === 'string' ? error : typeof shape(error).message === 'string' ? String(shape(error).message) : ''\n\n/** Transport-generic error copy. Feature/domain codes are owned by feature adapters. */\nexport function userFacingError(error: unknown, fallback = 'Không thể hoàn tất thao tác. Vui lòng thử lại.'): string {\n  const status = error instanceof BackendError ? error.status : Number(shape(error).status)\n  const message = rawMessage(error).trim()\n  const normalized = message.toLowerCase()\n  if (status === 401 || status === 403 || /unauthori[sz]ed|forbidden|access denied/.test(normalized)) return 'Phiên làm việc không còn hợp lệ hoặc bạn không có quyền thực hiện. Vui lòng đăng nhập lại hoặc liên hệ Chủ trại.'\n  if (status === 404 || /not found|không tìm thấy|error\\.http\\.404/.test(normalized)) return 'Không tìm thấy dữ liệu cần thao tác. Vui lòng tải lại trang và thử lại.'\n  if (status === 408 || status === 504 || /timeout|timed out|gateway timeout|error\\.http\\.408|error\\.http\\.504/.test(normalized)) return 'Máy chủ phản hồi quá lâu. Vui lòng kiểm tra kết nối rồi thử lại.'\n  if ((status >= 500 && status \u003c= 599) || /error\\.http\\.5\\d\\d|server error|internal server/.test(normalized)) return 'Máy chủ đang gặp sự cố. Vui lòng thử lại sau ít phút.'\n  if (/failed to fetch|networkerror|network error|network request|\\bload failed|connection refused|err_connection|cors|error\\.network/.test(normalized)) return 'Không thể kết nối máy chủ. Vui lòng kiểm tra máy chủ và kết nối mạng rồi thử lại.'\n  if (status === 400 || status === 409 || status === 422 || error instanceof BackendError && (error.fieldErrors.length > 0 || error.violations.length > 0) || /error\\.validation|validation failed/.test(normalized)) return 'Không thể lưu dữ liệu. Vui lòng kiểm tra lại thông tin.'\n  if (/error\\.http\\.\\d+|^http\\s*\\d+$/i.test(normalized)) return fallback\n  if (message && !/^unknown error$/i.test(message)) return message\n  return fallback\n}\n\nexport const displayError = userFacingError"},"session-context":{"file":"frontend/src/app/session/sessionContext.ts","start":1,"end":20,"highlightStart":5,"highlightEnd":20,"scope":"Cả file","symbol":"sessionContext.ts","code":"import { createContext, useContext } from 'react'\nimport type { AppRole, Session, SessionUser } from './sessionTypes'\nexport { isFarmRole } from './sessionProfile'\n\nexport type { AppRole, FarmRole, PlatformRole, Session, SessionUser } from './sessionTypes'\n\nexport const SessionContext = createContext\u003cSession | null>(null)\n\n/** Null khi trang được render ngoài `SessionProvider` (vd. test từng trang): khi đó không áp quyền theo vai trò. */\nexport const useSession = () => useContext(SessionContext)\n\n/**\n * The role on a page that works on `farmId` (the farm named in its address): the account's role in that farm, else the\n * session role (the farm of this tab). Only for routing and showing actions; the backend checks every command.\n */\nexport const roleInFarm = (session: SessionUser, farmId: number | null | undefined): AppRole =>\n  (farmId == null ? undefined : session.farmRoles?.[farmId]) ?? session.role\n\n/** Optimistic session update after the server accepts the Owner profile form. */\nexport const markOwnerRegistrationCompleted = \u003cT extends SessionUser>(session: T): T => ({ ...session, ownerRegistrationCompleted: true })"},"profile-parts":{"file":"frontend/src/features/account/components/ProfileParts.tsx","start":1,"end":71,"highlightStart":1,"highlightEnd":71,"scope":"Cả file component","symbol":"ProfileParts.tsx","code":"import type { ReactNode } from 'react'\nimport { Badge, Button, Card, Field, Icon, inputCls, Table, Td, Th } from '../../../shared/ui'\nimport { FARM_ROLE_LABEL, initials } from '../domain/profileRules'\nimport type { AccountProfile, FarmPermissions, ProfileErrors } from '../types'\n\nexport const Avatar = ({ name, size = 56 }: { name: string; size?: number }) => (\n  \u003cspan aria-hidden=\"true\" style={{ width: size, height: size }} className=\"grid shrink-0 place-items-center rounded-full bg-edge text-base font-semibold text-white\">{initials(name)}\u003c/span>\n)\n\nconst methods = (profile: AccountProfile) => (profile.signInMethods.length ? profile.signInMethods.map((method) => method === 'GOOGLE' ? 'Google' : method === 'PASSWORD' ? 'Thư điện tử & mật khẩu' : method).join(' · ') : [profile.googleSignInLinked && 'Google', profile.passwordSignInEnabled && 'Thư điện tử & mật khẩu'].filter(Boolean).join(' · ')) || '—'\n\nconst Err = ({ children }: { children?: string }) => children ? \u003cspan className=\"text-xs text-err-fg\">{children}\u003c/span> : null\n\n/** Thẻ \"Hồ sơ cá nhân\" (SCR-08). Họ tên và điện thoại ở biểu mẫu `profile-form`; nút \"Lưu hồ sơ\" nằm ở đầu trang. */\nexport function ProfileCard({ profile, headline, values, onChange, errors, onSubmit, onPassword, banner }: {\n  profile: AccountProfile\n  headline: string\n  values: { fullName: string; phone: string }\n  onChange: (values: { fullName: string; phone: string }) => void\n  errors: ProfileErrors\n  onSubmit: (event: React.FormEvent) => void\n  onPassword: () => void\n  banner?: ReactNode\n}) {\n  return (\n    \u003cCard title=\"Hồ sơ cá nhân\">\n      \u003cdiv className=\"flex items-center gap-3\">\n        \u003cAvatar name={profile.fullName} />\n        \u003cdiv>\u003cdiv className=\"text-base font-semibold text-[#212121]\">{profile.fullName}\u003c/div>\u003cdiv className=\"text-xs text-muted\">{headline}\u003c/div>\u003c/div>\n      \u003c/div>\n      {banner}\n      \u003cform id=\"profile-form\" onSubmit={onSubmit} noValidate className=\"flex flex-col gap-4\">\n        \u003cdiv className=\"grid gap-4 sm:grid-cols-2\">\n          \u003cField label=\"Thư điện tử đăng nhập\" id=\"profile-email\">\u003cinput id=\"profile-email\" readOnly value={`${profile.email} · ${profile.emailVerified ? 'đã xác minh' : 'chưa xác minh'}`} className={`${inputCls} bg-chip text-muted`} />\u003c/Field>\n          \u003cField label=\"Phương thức đăng nhập\" id=\"profile-methods\">\u003cinput id=\"profile-methods\" readOnly value={methods(profile)} className={`${inputCls} bg-chip text-muted`} />\u003c/Field>\n          \u003cField label=\"Họ và tên *\" id=\"profile-name\">\u003cinput id=\"profile-name\" autoComplete=\"name\" maxLength={100} value={values.fullName} onChange={(event) => onChange({ ...values, fullName: event.target.value })} className={inputCls} aria-invalid={Boolean(errors.fullName)} />\u003cErr>{errors.fullName}\u003c/Err>\u003c/Field>\n          \u003cField label=\"Điện thoại liên hệ\" id=\"profile-phone\">\u003cinput id=\"profile-phone\" type=\"tel\" autoComplete=\"tel\" value={values.phone} onChange={(event) => onChange({ ...values, phone: event.target.value })} className={inputCls} aria-invalid={Boolean(errors.phone)} />\u003cErr>{errors.phone}\u003c/Err>\u003c/Field>\n        \u003c/div>\n      \u003c/form>\n      \u003cdiv>\u003cButton onClick={onPassword}>\u003cIcon name=\"lock\" size={16} />{profile.passwordSignInEnabled ? 'Đổi mật khẩu' : 'Thêm mật khẩu'}\u003c/Button>\u003c/div>\n    \u003c/Card>\n  )\n}\n\n/** Thẻ \"Quyền của tôi trong trại này\": bảng chỉ đọc theo vai trò hiện tại (GBR-06). */\nconst PERMISSION_LABEL: Record\u003cstring, string> = {\n  CATTLE_PROFILE_QR: 'Hồ sơ bò & thẻ QR', PENS_AND_MOVES: 'Chuồng trại & chuyển chuồng', HERD_ENTRY_AND_PAYMENTS: 'Nhập đàn, thanh toán & xác nhận bê',\n  GROWTH_BCS: 'Cân nặng & thể trạng', VACCINATION: 'Tiêm phòng', HEALTH_AND_TREATMENT: 'Sức khỏe & điều trị', REPRODUCTION: 'Sinh sản',\n  CATALOGUES_AND_PARAMETERS: 'Danh mục & tham số trại', FARM_ANNOUNCEMENTS: 'Thông báo trại', REMINDERS: 'Nhắc việc', DASHBOARD_AND_REPORTS: 'Tổng quan & báo cáo',\n  MEMBERS_ROLES: 'Thành viên & vai trò', HERD_EXIT_AND_COLLECTIONS: 'Xuất đàn & thu tiền', FEED_STOCK_AND_CATALOGUE: 'Kho thức ăn, phiếu nhập, khẩu phần & danh mục',\n  FEEDING_LOG: 'Nhật ký cho ăn', SUBSCRIPTION_AND_PAYMENT: 'Gói dịch vụ & thanh toán', FARM_INFORMATION: 'Thông tin trại',\n}\nconst PERMISSION_VALUE = { FULL: 'Có', RESTRICTED: 'Chỉ xem', NO: 'Không' } as const\n\nexport function PermissionsCard({ permissions, loading, error }: { permissions: FarmPermissions | null; loading: boolean; error: unknown }) {\n  const role = permissions?.role\n  return (\n    \u003cCard title=\"Quyền của tôi trong trại này\" actions={role && \u003cspan className=\"inline-flex rounded-full bg-[#454545] px-2.5 py-0.5 text-[11px] font-medium text-white\">{FARM_ROLE_LABEL[role]}\u003c/span>}>\n      \u003cTable stack={false}>\n        \u003cthead>\u003ctr>\u003cTh>Quyền\u003c/Th>\u003cTh>Trạng thái\u003c/Th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          {loading && \u003ctr>\u003cTd colSpan={2}>Đang tải quyền…\u003c/Td>\u003c/tr>}\n          {Boolean(error) && \u003ctr>\u003cTd colSpan={2}>Không tải được quyền của bạn trong trại này.\u003c/Td>\u003c/tr>}\n          {permissions?.permissions.map((permission) => (\n            \u003ctr key={permission.area}>\u003cTd className=\"font-medium\">{PERMISSION_LABEL[permission.area] ?? permission.area}\u003c/Td>\u003cTd>\u003cBadge tone={permission.value === 'NO' ? 'outline' : undefined}>{PERMISSION_VALUE[permission.value]}\u003c/Badge>\u003c/Td>\u003c/tr>\n          ))}\n        \u003c/tbody>\n      \u003c/Table>\n    \u003c/Card>\n  )\n}"},"account-types":{"file":"frontend/src/features/account/types.ts","start":1,"end":41,"highlightStart":1,"highlightEnd":41,"scope":"Cả file hợp đồng TypeScript","symbol":"account/types.ts","code":"import type { AppRole } from '../authorization'\n\n/** ProfileResponse trong OpenAPI (GET /api/account/profile). */\nexport interface AccountProfile {\n  id: number\n  email: string\n  fullName: string\n  phone: string\n  emailVerified: boolean\n  passwordSignInEnabled: boolean\n  googleSignInLinked: boolean\n  ownerRegistrationCompleted: boolean\n  /** True when the user already accepted the terms during email/Google registration. */\n  termsAccepted?: boolean\n  status: string\n  signInMethods: string[]\n  hasPassword: boolean\n  platformRole: string | null\n  farms: Array\u003c{ farmId: number; farmName: string; role: string; serviceStatus: string; permissions: string[] }>\n}\n\n/** A10: server-verified permissions for the currently selected farm. */\nexport interface FarmPermission { area: string; value: 'FULL' | 'RESTRICTED' | 'NO' }\nexport interface FarmPermissions { role: 'OWNER' | 'MANAGER' | 'TECHNICIAN'; permissions: FarmPermission[] }\n\n/** Người đang đăng nhập; chế độ mô phỏng dùng nó để dựng hồ sơ, máy chủ thật bỏ qua. */\nexport interface AccountIdentity {\n  email: string\n  fullName: string\n  role: AppRole\n  farmName: string | null\n  farmId: number | null\n}\n\nexport interface ProfileUpdateInput { fullName: string; phone: string }\n\n/** `currentPassword` bỏ trống khi vừa xác thực lại với Google (D07) hoặc khi thêm mật khẩu đầu tiên. */\nexport interface PasswordChangeInput { currentPassword?: string; newPassword: string; confirmPassword: string }\n\nexport type ProfileErrors = Partial\u003cRecord\u003ckeyof ProfileUpdateInput, string>>\nexport type PasswordErrors = Partial\u003cRecord\u003ckeyof PasswordChangeInput, string>>"},"app-routes-fe01":{"file":"frontend/src/app/routes/AppRoutes.tsx","start":110,"end":194,"highlightStart":151,"highlightEnd":188,"scope":"Hàm route chính","symbol":"AppRoutes() · FE-01 routes","code":"export default function AppRoutes() {\n  return (\n    \u003cSuspense fallback={null}>\n      \u003cRoutes>\n        \u003cRoute path=\"/terms\" element={\u003cLegal kind=\"terms\" />} />\n        \u003cRoute path=\"/data-policy\" element={\u003cLegal kind=\"data\" />} />\n        \u003cRoute path=\"/\" element={\u003cHomeRedirect />} />\n        \u003cRoute path=\"/tong-quan\" element={desk(\u003cFarmDashboard />)} />\n        \u003cRoute path=\"/nhac-viec\" element={desk(\u003cReminders />)} />\n        \u003cRoute path=\"/bao-cao\" element={desk(\u003cManagementReport />)} />\n        \u003cRoute path=\"/thong-bao/*\" element={desk(\u003cAnnouncements />)} />\n        \u003cRoute path=\"/herd-entry\" element={desk(\u003cImportList />)} />\n        \u003cRoute path=\"/herd-entry/new\" element={desk(\u003cImportNew />)} />\n        \u003cRoute path=\"/herd-entry/:id\" element={desk(\u003cImportDetail />)} />\n        \u003cRoute path=\"/herd-exit\" element={desk(\u003cExportList />)} />\n        \u003cRoute path=\"/herd-exit/new\" element={desk(\u003cExportNew />)} />\n        \u003cRoute path=\"/herd-exit/:id\" element={desk(\u003cExportDetail />)} />\n        \u003cRoute path=\"/pens\" element={farmMember(\u003cBarnList />)} />\n        \u003cRoute path=\"/cattle\" element={desk(\u003cCowList />)} />\n        \u003cRoute path=\"/cattle/:code/sinh-san/de\" element={desk(\u003cCalving />)} />\n        \u003cRoute path=\"/cattle/:code\" element={desk(\u003cCowProfile />)} />\n        \u003cRoute path=\"/quet-qr\" element={desk(\u003cScanQr />)} />\n        \u003cRoute path=\"/can-nang/*\" element={desk(\u003cGrowth />)} />\n        \u003cRoute path=\"/tiem-phong/*\" element={desk(\u003cVaccination />)} />\n        \u003cRoute path=\"/suc-khoe/*\" element={desk(\u003cHealth />)} />\n        \u003cRoute path=\"/sinh-san\" element={desk(\u003cReproductionWorklist />)} />\n        \u003cRoute path=\"/thuc-an\" element={desk(\u003cFeedStock />)} />\n        \u003cRoute path=\"/thuc-an/hom-nay\" element={farmMember(\u003cFeedTodayRations />)} />\n        \u003cRoute path=\"/thuc-an/phieu-nhap\" element={desk(\u003cFeedReceipts />)} />\n        \u003cRoute path=\"/thuc-an/phieu-nhap/moi\" element={desk(\u003cFeedReceiptForm />)} />\n        \u003cRoute path=\"/thuc-an/phieu-nhap/:id\" element={desk(\u003cFeedReceiptForm />)} />\n        \u003cRoute path=\"/thuc-an/kiem-ke\" element={desk(\u003cFeedStockAdjustments />)} />\n        \u003cRoute path=\"/thuc-an/kiem-ke/moi\" element={desk(\u003cFeedStockAdjustmentForm />)} />\n        \u003cRoute path=\"/thuc-an/kiem-ke/:id\" element={desk(\u003cFeedStockAdjustmentForm />)} />\n        \u003cRoute path=\"/thuc-an/khau-phan\" element={desk(\u003cFeedRations />)} />\n        \u003cRoute path=\"/thuc-an/khau-phan/moi\" element={desk(\u003cFeedRationForm />)} />\n        \u003cRoute path=\"/thuc-an/khau-phan/:id\" element={desk(\u003cFeedRationForm />)} />\n        \u003cRoute path=\"/thuc-an/nhat-ky\" element={farmMember(\u003cFeedFeeding />)} />\n        \u003cRoute path=\"/thuc-an/danh-muc\" element={desk(\u003cFeedCatalogue />)} />\n        \u003cRoute path=\"/thuc-an/bao-cao\" element={desk(\u003cFeedConsumptionReport />)} />\n        \u003cRoute path=\"/danh-muc/*\" element={farmMember(\u003cCatalogue />)} />\n        \u003cRoute path=\"/owner-registration\" element={\u003cOwnerRegistration />} />\n        \u003cRoute path=\"/chon-trai\" element={\u003cFarmSelect />} />\n        \u003cRoute path=\"/dang-ky-trai\" element={\u003cFarmRegistration />} />\n        \u003cRoute path=\"/dang-ky-goi\" element={ownerFarm(\u003cFirstSubscription />, 'farm')} />\n        \u003cRoute path=\"/thong-tin-trai\" element={ownerFarm(\u003cFarmInformation />, 'farmId')} />\n        \u003cRoute path=\"/thanh-vien\" element={desk(\u003cMembers />, 'farmId')} />\n        \u003cRoute path=\"/loi-moi\" element={ownerFarm(\u003cInvitations />, 'farmId')} />\n        \u003cRoute path=\"/invitation/accept\" element={\u003cAcceptInvitation />} />\n        \u003cRoute path=\"/goi-dich-vu/*\" element={ownerFarm(\u003cSubscription />, 'farm')} />\n        \u003cRoute path=\"/ho-tro/*\" element={owner(\u003cSupport />, 'farmId')} />\n        \u003cRoute path=\"/thong-bao-cua-toi\" element={owner(\u003cMyNotifications />)} />\n        \u003cRoute path=\"/ho-so\" element={only(['OWNER', 'MANAGER'], \u003cProfile />)} />\n\n        \u003cRoute path=\"/kt\" element={technician(\u003cTechnicianHome />)} />\n        \u003cRoute path=\"/kt/nhac-viec\" element={technician(\u003cTechnicianReminders />)} />\n        \u003cRoute path=\"/kt/thong-bao/*\" element={technician(\u003cTechnicianAnnouncements />)} />\n        \u003cRoute path=\"/kt/dan-bo/*\" element={technician(\u003cTechnicianCattle />)} />\n        \u003cRoute path=\"/kt/quet-qr\" element={technician(\u003cScanQr />)} />\n        \u003cRoute path=\"/kt/sinh-san\" element={technician(\u003cTechnicianReproduction />)} />\n        \u003cRoute path=\"/kt/thuc-an\" element={technician(\u003cFeedTodayRations />)} />\n        \u003cRoute path=\"/kt/tai-khoan\" element={only(['TECHNICIAN'], \u003cTechnicianAccount />)} />\n\n        \u003cRoute path=\"/nen-tang/ho-tro/*\" element={cs(\u003cSupportDesk />)} />\n        \u003cRoute path=\"/nen-tang/yeu-cau/*\" element={only(['PM', 'SA'], \u003cInternalRequests />)} />\n        \u003cRoute path=\"/nen-tang/dich-vu/*\" element={pm(\u003cFarmService />)} />\n        \u003cRoute path=\"/nen-tang/goi-dang-ky/*\" element={pm(\u003cPlatformSubscriptions />)} />\n        \u003cRoute path=\"/nen-tang/thanh-toan/*\" element={pm(\u003cPaymentReconciliation />)} />\n        \u003cRoute path=\"/nen-tang/bang-gia/*\" element={pm(\u003cPlanPrices />)} />\n        \u003cRoute path=\"/nen-tang/bien-nhan/*\" element={pm(\u003cReceipts />)} />\n        \u003cRoute path=\"/nen-tang/thu-chi/*\" element={pm(\u003cManualFinance />)} />\n        \u003cRoute path=\"/nen-tang/bao-cao-dong-tien/*\" element={pm(\u003cCashReport />)} />\n        \u003cRoute path=\"/nen-tang/thong-bao-doi-soat\" element={pm(\u003cReconciliationNotices />)} />\n        \u003cRoute path=\"/nen-tang/thong-bao-ho-tro\" element={pm(\u003cPmSupportNotices />)} />\n        \u003cRoute path=\"/nen-tang/tai-khoan/*\" element={sa(\u003cUserAccounts />)} />\n        \u003cRoute path=\"/nen-tang/quyen/*\" element={sa(\u003cStaffAccess />)} />\n        \u003cRoute path=\"/nen-tang/audit/*\" element={sa(\u003cAudit />)} />\n        \u003cRoute path=\"/nen-tang/thong-bao\" element={sa(\u003cAdminNotices />)} />\n        \u003cRoute path=\"/nen-tang/ho-so\" element={only(['CS', 'PM', 'SA'], \u003cPlatformProfile />)} />\n\n        \u003cRoute path=\"*\" element={\u003cPlaceholder />} />\n      \u003c/Routes>\n    \u003c/Suspense>\n  )\n}"},"profile-rules":{"file":"frontend/src/features/account/domain/profileRules.ts","start":1,"end":19,"highlightStart":1,"highlightEnd":19,"scope":"Cả file policy FE","symbol":"profileRules.ts","code":"import type { AppRole } from '../../authorization'\n\nexport const PLATFORM_ROLE_LABEL: Record\u003cstring, string> = {\n  CS: 'Nhân viên hỗ trợ · CS', PM: 'Quản lý nền tảng · PM', SA: 'Quản trị hệ thống · SA',\n}\nexport const FARM_ROLE_LABEL: Record\u003cstring, string> = { OWNER: 'Chủ trại', MANAGER: 'Quản lý', TECHNICIAN: 'Kỹ thuật viên' }\n\nexport const roleTitle = (role: AppRole) => FARM_ROLE_LABEL[role] ?? PLATFORM_ROLE_LABEL[role] ?? role\n\nexport function initials(name: string) {\n  const parts = name.trim().split(/\\s+/).filter(Boolean)\n  return parts.length ? (parts.length === 1 ? parts[0][0] : parts[0][0] + parts[parts.length - 1][0]).toUpperCase() : '?'\n}\n\n/** Mô tả vai trò ở đầu hồ sơ: \"Quản lý tại Trại bò Yên Bài – Ba Vì\" hoặc vai trò nền tảng. */\nexport function roleAtFarm(role: AppRole, farmName: string | null) {\n  if (role in FARM_ROLE_LABEL) return farmName ? `${FARM_ROLE_LABEL[role]} tại ${farmName}` : FARM_ROLE_LABEL[role]\n  return PLATFORM_ROLE_LABEL[role] ?? role\n}"},"active-account-filter":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/config/SecurityConfiguration.java","start":150,"end":202,"highlightStart":150,"highlightEnd":201,"scope":"Cả filter","symbol":"ActiveAccountFilter.doFilterInternal()","code":"        return http.build();\n    }\n\n    /** Forces account revocation and account-status changes to take effect on the next authenticated API request. */\n    static final class ActiveAccountFilter extends OncePerRequestFilter {\n\n        private final FarmAccessService access;\n        private final SessionRegistry sessionRegistry;\n\n        ActiveAccountFilter(FarmAccessService access, SessionRegistry sessionRegistry) {\n            this.access = access;\n            this.sessionRegistry = sessionRegistry;\n        }\n\n        @Override\n        protected void doFilterInternal(HttpServletRequest request, HttpServletResponse response, FilterChain chain)\n            throws ServletException, IOException {\n            var authentication = org.springframework.security.core.context.SecurityContextHolder.getContext().getAuthentication();\n            if (request.getRequestURI().startsWith(request.getContextPath() + \"/api/\") &&\n                authentication != null && authentication.isAuthenticated() &&\n                !(authentication instanceof org.springframework.security.authentication.AnonymousAuthenticationToken) &&\n                !request.getRequestURI().equals(request.getContextPath() + \"/api/csrf\")) {\n                var session = request.getSession(false);\n                if (session != null) {\n                    var sessionInformation = sessionRegistry.getSessionInformation(session.getId());\n                    if (sessionInformation != null && sessionInformation.isExpired()) {\n                        session.invalidate();\n                        org.springframework.security.core.context.SecurityContextHolder.clearContext();\n                        response.sendError(401);\n                        return;\n                    }\n                }\n                try {\n                    access.currentActiveUser();\n                } catch (DomainException ex) {\n                    if (session != null) {\n                        var sessionInformation = sessionRegistry.getSessionInformation(session.getId());\n                        if (sessionInformation != null) {\n                            sessionInformation.expireNow();\n                        }\n                        session.invalidate();\n                    }\n                    org.springframework.security.core.context.SecurityContextHolder.clearContext();\n                    response.setStatus(ex.getStatus().value());\n                    response.setContentType(\"application/json\");\n                    response.getWriter().write(\"{\\\"code\\\":\\\"\" + ex.getCode() + \"\\\"}\");\n                    return;\n                }\n            }\n            chain.doFilter(request, response);\n        }\n    }\n}"},"farm-access-current":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/FarmAccessService.java","start":1,"end":135,"highlightStart":76,"highlightEnd":131,"scope":"Cả class service","symbol":"FarmAccessService.currentActiveUser()","code":"package vn.edu.fpt.beefcare.service;\n\nimport java.util.Locale;\nimport java.util.Optional;\nimport org.springframework.http.HttpStatus;\nimport org.springframework.stereotype.Service;\nimport vn.edu.fpt.beefcare.domain.AppUser;\nimport vn.edu.fpt.beefcare.domain.Farm;\nimport vn.edu.fpt.beefcare.domain.FarmMembership;\nimport vn.edu.fpt.beefcare.domain.enumeration.FarmRole;\nimport vn.edu.fpt.beefcare.repository.AppUserRepository;\nimport vn.edu.fpt.beefcare.repository.FarmMembershipRepository;\nimport vn.edu.fpt.beefcare.repository.FarmRepository;\nimport vn.edu.fpt.beefcare.repository.UserRepository;\nimport vn.edu.fpt.beefcare.security.SecurityUtils;\n\n/**\n * GBR-09: every protected request rechecks the account status, the current membership and role in the path farm,\n * and operational access requires an ACTIVE farm service. Only the owner's farm information actions are exempt.\n *\n * The signed-in JHipster login is mapped to the BeefCare {@link AppUser} by e-mail (login or account e-mail).\n */\n@Service\npublic class FarmAccessService {\n\n    static final String ACTIVE = \"ACTIVE\";\n\n    private final AppUserRepository appUserRepository;\n    private final FarmMembershipRepository membershipRepository;\n    private final FarmRepository farmRepository;\n    private final UserRepository userRepository;\n\n    public FarmAccessService(\n        AppUserRepository appUserRepository,\n        FarmMembershipRepository membershipRepository,\n        FarmRepository farmRepository,\n        UserRepository userRepository\n    ) {\n        this.appUserRepository = appUserRepository;\n        this.membershipRepository = membershipRepository;\n        this.farmRepository = farmRepository;\n        this.userRepository = userRepository;\n    }\n\n    /** Verifies the caller may perform {@code action} in the farm and returns the verified context. */\n    public FarmContext require(Long farmId, FarmAction action) {\n        AppUser user = currentActiveUser();\n        FarmMembership membership = membershipRepository\n            .findFirstByFarmIdAndUserIdAndStatusIgnoreCase(farmId, user.getId(), ACTIVE)\n            .orElseThrow(() -> DomainException.forbidden(MessageCodes.COM_01));\n        FarmRole role = parseRole(membership.getRole());\n        if (role == null || !action.allows(role)) {\n            throw DomainException.forbidden(MessageCodes.COM_01);\n        }\n        Farm farm = farmRepository.findById(farmId).orElseThrow(() -> DomainException.forbidden(MessageCodes.COM_01));\n        if (!ACTIVE.equalsIgnoreCase(farm.getServiceStatus())) {\n            if (action == FarmAction.SELECT_FARM) {\n                if (role != FarmRole.OWNER) {\n                    throw DomainException.forbidden(MessageCodes.FE02_04, \"farm\", farm.getName(), \"status\", farm.getServiceStatus());\n                }\n            } else if (\n                action != FarmAction.VIEW_FARM_INFORMATION &&\n                action != FarmAction.MANAGE_FARM_INFORMATION &&\n                // GBR-14 Owner-only read exception (D29): the member list stays readable so members can be deactivated.\n                !(action == FarmAction.VIEW_MEMBERS && role == FarmRole.OWNER)\n            ) {\n                throw DomainException.forbidden(MessageCodes.COM_12, \"farm\", farm.getName(), \"status\", farm.getServiceStatus());\n            }\n        }\n        return new FarmContext(farm, user, role);\n    }\n\n    /** The signed-in account, which must be ACTIVE. */\n    public AppUser currentActiveUser() {\n        String login = SecurityUtils.getCurrentUserLogin()\n            .orElseThrow(() -> new DomainException(MessageCodes.COM_01, null, HttpStatus.UNAUTHORIZED));\n        AppUser user = findAppUser(login).orElseGet(() -> provisionForAuthenticatedIdentity(login));\n        if (!ACTIVE.equalsIgnoreCase(user.getAccountStatus())) {\n            throw DomainException.forbidden(MessageCodes.FE01_03, \"email\", user.getEmail());\n        }\n        userRepository\n            .findOneByLogin(login.toLowerCase(Locale.ROOT))\n            .or(() -> userRepository.findOneByEmailIgnoreCase(login))\n            .filter(identity -> !identity.isActivated())\n            .ifPresent(identity -> {\n                throw DomainException.forbidden(MessageCodes.COM_01);\n            });\n        return user;\n    }\n\n    /** Creates the BeefCare identity projection for an already activated JHipster credential on first sign-in. */\n    private AppUser provisionForAuthenticatedIdentity(String login) {\n        var identity = userRepository\n            .findOneByLogin(login.toLowerCase(Locale.ROOT))\n            .filter(vn.edu.fpt.beefcare.domain.User::isActivated)\n            .orElseThrow(() -> DomainException.forbidden(MessageCodes.COM_01));\n        if (identity.getEmail() == null || identity.getEmail().isBlank()) {\n            throw DomainException.forbidden(MessageCodes.COM_01);\n        }\n        String fullName = ((identity.getFirstName() == null ? \"\" : identity.getFirstName().trim()) + \" \" +\n            (identity.getLastName() == null ? \"\" : identity.getLastName().trim())).trim();\n        if (fullName.isBlank()) {\n            fullName = identity

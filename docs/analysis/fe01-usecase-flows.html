<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BeefCare · FE-01 · Luồng code theo use case</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />
  <style>
    :root { --bg:#f4f7fb; --paper:#fff; --ink:#182230; --muted:#667085; --line:#d9e1ec; --blue:#2563eb; --blue-soft:#eef4ff; --green:#0f766e; --green-soft:#eefaf7; --amber:#f59e0b; --code:#101827; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); font:14px/1.45 Arial, Helvetica, sans-serif; }
    button { font:inherit; }
    .shell { max-width:1480px; margin:0 auto; padding:10px 16px 18px; }
    .topbar { display:flex; align-items:center; gap:10px; min-height:30px; overflow:auto; white-space:nowrap; color:var(--muted); font-size:12px; }
    .brand { color:var(--ink); font-weight:750; }
    .sep { color:#98a2b3; }
    .tabs { display:flex; align-items:center; gap:4px; min-width:max-content; }
    .tab { border:0; border-bottom:2px solid transparent; background:transparent; color:#667085; padding:5px 7px 4px; cursor:pointer; }
    .tab:hover { color:var(--blue); }
    .tab.active { color:var(--blue); border-bottom-color:var(--blue); font-weight:700; }
    .card { background:var(--paper); border:1px solid var(--line); border-radius:10px; box-shadow:0 4px 14px rgba(32,55,91,.04); overflow:hidden; }
    .card-head { min-height:38px; padding:7px 11px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .card-head h1, .card-head h2 { margin:0; font-size:15px; }
    .hint { color:var(--muted); font-size:11px; }
    .diagram-body { padding:8px; overflow:auto; }
    .system-map { display:grid; grid-template-columns:minmax(0,1fr) minmax(250px,.52fr) minmax(0,1fr); min-width:1120px; align-items:stretch; }
    .lane-head { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:30px; padding:6px 8px; border:1px solid; border-radius:8px 8px 0 0; font-size:11px; font-weight:800; }
    .lane-head small { color:var(--muted); font-size:9px; font-weight:400; }
    .lane-head.frontend { color:var(--blue); border-color:#c9d8f7; background:#eef4ff; }
    .lane-head.backend { color:var(--green); border-color:#b9e0d8; background:#eaf8f4; }
    .bridge-head { display:flex; align-items:center; justify-content:center; min-height:30px; padding:4px 7px; color:#475569; text-align:center; font-size:9px; font-weight:700; }
    .lane-cell { min-width:0; padding:6px; border-right:1px solid; border-left:1px solid; border-top:1px solid rgba(148,163,184,.28); }
    .lane-cell.frontend { border-right-color:#c9d8f7; border-left-color:#c9d8f7; background:#f8faff; }
    .lane-cell.backend { border-right-color:#b9e0d8; border-left-color:#b9e0d8; background:#f7fcfa; }
    .lane-cell.last { border-bottom:1px solid; border-radius:0 0 8px 8px; }
    .lane-cell.frontend.last { border-bottom-color:#c9d8f7; }
    .lane-cell.backend.last { border-bottom-color:#b9e0d8; }
    .lane-cell.empty { display:flex; align-items:center; justify-content:center; color:#98a2b3; font-size:9px; }
    .row-caption { display:flex; gap:6px; align-items:baseline; margin:0 1px 5px; font-size:10px; font-weight:750; }
    .row-caption span { color:var(--muted); font-weight:400; }
    .nodes { display:flex; align-items:stretch; gap:3px; min-width:0; }
    .node { flex:1 1 0; min-width:0; border:1px solid #b8c7dd; border-radius:6px; background:#fff; padding:5px; color:inherit; text-align:left; cursor:pointer; overflow-wrap:anywhere; word-break:break-word; }
    .backend .node { border-color:#add5cd; }
    .node:hover, .node.active { border-color:var(--blue); box-shadow:0 0 0 2px rgba(37,99,235,.09); }
    .backend .node:hover, .backend .node.active { border-color:var(--green); box-shadow:0 0 0 2px rgba(15,118,110,.09); }
    .node-file { display:flex; align-items:baseline; justify-content:space-between; gap:4px; font-size:11px; font-weight:800; }
    .node-lines { flex:none; color:#667085; font:7px/1.2 "SFMono-Regular", Consolas, monospace; font-weight:600; }
    .node-path { display:block; color:var(--muted); font:8px/1.25 "SFMono-Regular", Consolas, monospace; margin-top:2px; }
    .methods { display:block; border-top:1px solid #edf1f6; margin-top:3px; padding-top:3px; color:#344054; font:9px/1.32 "SFMono-Regular", Consolas, monospace; white-space:normal; }
    .method { display:block; }
    .node-result { display:block; margin-top:3px; color:#64748b; font-size:8px; }
    .arrow { flex:0 0 24px; align-self:center; color:#8190a6; text-align:center; font-size:13px; line-height:1; }
    .arrow span { display:block; margin-bottom:2px; color:#667085; font-size:7px; line-height:1.15; white-space:normal; }
    .bridge-cell { display:flex; flex-direction:column; justify-content:center; gap:5px; min-width:0; padding:6px 7px; border-top:1px dashed #cbd5e1; background:#fbfcfe; }
    .bridge-cell.last { border-bottom:1px solid #e2e8f0; }
    .exchange { min-width:0; padding:4px 0; }
    .exchange + .exchange { border-top:1px dotted #cbd5e1; }
    .request-line, .response-line, .failure-line { padding:4px 5px; border-radius:4px; overflow-wrap:anywhere; font:9px/1.35 "SFMono-Regular", Consolas, monospace; font-weight:700; }
    .request-line { color:#1d4ed8; background:#eef4ff; text-align:right; }
    .response-line { color:#0f766e; background:#eefaf7; text-align:left; }
    .failure-line { margin-top:3px; color:#b42318; background:#fff1f0; text-align:left; }
    .receiver { padding:2px 3px; color:#475569; font-size:9px; line-height:1.3; overflow-wrap:anywhere; }
    .receiver strong { color:#344054; }
    .local-exchange { padding:7px; border:1px dashed #cbd5e1; border-radius:6px; background:#fff; color:#475569; font-size:9px; line-height:1.45; }
    .local-exchange strong { color:#344054; }
    .local-result { margin-top:3px; padding:3px 5px; border-radius:4px; background:#f1f5f9; overflow-wrap:anywhere; }
    .workspace { display:grid; grid-template-columns:minmax(330px,.74fr) minmax(570px,1.26fr); gap:9px; margin-top:9px; align-items:start; }
    .flow { padding:7px 10px 9px; }
    .flow-step { display:grid; grid-template-columns:21px 1fr; gap:7px; width:100%; padding:4px 1px; border:0; border-left:2px solid transparent; background:transparent; color:inherit; text-align:left; cursor:pointer; }
    .flow-step:hover, .flow-step.active { color:var(--blue); border-left-color:var(--blue); }
    .flow-num { color:#98a2b3; text-align:right; font-size:10px; font-weight:800; }
    .flow-title { display:block; font-size:12px; }
    .flow-pseudo { display:block; color:#475569; font-size:11px; line-height:1.35; margin-top:1px; }
    .flow-step.active .flow-pseudo { color:#1d4ed8; }
    .flow-meta { display:block; color:#98a2b3; font-size:9px; margin-top:1px; }
    .detail { position:sticky; top:8px; }
    .detail-body { padding:9px; }
    .source-head { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:start; margin-bottom:7px; }
    .source-symbol { margin:0; font-size:14px; }
    .source-path { color:var(--muted); font:10px/1.35 "SFMono-Regular", Consolas, monospace; overflow-wrap:anywhere; }
    .scope { border:1px solid #c7d6ee; border-radius:999px; background:var(--blue-soft); color:#1d4ed8; padding:3px 7px; font-size:9px; white-space:nowrap; }
    .source-note { display:none; }
    .code-window { max-height:500px; overflow:auto; border-radius:7px; background:var(--code); color:#dbeafe; padding:7px 0; font:11px/1.48 "SFMono-Regular", Consolas, "Liberation Mono", monospace; tab-size:2; }
    .code-line { display:grid; grid-template-columns:48px max-content; min-width:100%; min-height:16px; padding-right:14px; }
    .code-line.highlight { background:rgba(245,158,11,.16); box-shadow:inset 3px 0 #f59e0b; }
    .line-number { color:#65748b; padding:0 9px 0 5px; text-align:right; user-select:none; }
    .highlight .line-number { color:#fbbf24; }
    .line-code { white-space:pre; }
    .code-explanation { margin-top:8px; border:1px solid #d8e2ea; border-radius:7px; background:#f8fafc; overflow:hidden; }
    .explain-row { display:grid; grid-template-columns:108px 1fr; gap:8px; padding:7px 9px; color:#344054; font-size:10px; line-height:1.45; }
    .explain-row + .explain-row { border-top:1px solid #e5eaf0; }
    .explain-row strong { color:#0f5f59; }
    @media (max-width:980px) { .workspace{grid-template-columns:1fr;} .detail{position:static;} .code-window{max-height:480px;} }
  </style>
</head>

dentity, input)"],"source":"account-api-password","result":"POST change-password"}],"arrows":["account.changePassword","transport.command"]}],"backend":[{"title":"1. Ghi yêu cầu re-auth và nhận callback Google","subtitle":"cửa sổ tin cậy 5 phút trong session","nodes":[{"file":"AccountResource.java","path":"web/rest","methods":["startGoogleReauthentication()","reauthenticationReturnPath()"],"source":"account-google-reauth","result":"Lưu return path vào session"},{"file":"GoogleOidcSuccessHandler.java","path":"security","methods":["onAuthenticationSuccess(...)"],"source":"google-success-handler","result":"Ghi AUTHENTICATED_AT"},{"file":"GoogleReauthentication.java","path":"security","methods":["recent(session, now)"],"source":"google-reauth-window","result":"Kiểm tra ≤ 5 phút"}],"arrows":["OAuth callback","sau đó kiểm cửa sổ"]},{"title":"2. Đổi hoặc thêm password","subtitle":"giữ session hiện tại, đóng session khác","nodes":[{"file":"AccountResource.java","path":"web/rest","methods":["changePassword(dto, request)"],"source":"account-change-password","result":"Đọc Google recent"},{"file":"IdentityService.java","path":"service","methods":["changePassword(..., googleReauthenticated)"],"source":"identity-change-password","result":"Validate + encode + revoke"},{"file":"UserRepository.java","path":"repository","methods":["findOneWithAuthoritiesByLogin()","managed entity flush"],"source":"user-repository","result":"Lưu password mới"}],"arrows":["gọi service","persist / expire"]}],"steps":[{"title":"Mở popup Đổi/Thêm mật khẩu","pseudo":"hasPassword quyết định hiện mật khẩu hiện tại; Google recent quyết định có thể bỏ qua","meta":"Frontend · ChangePasswordDialog()","source":"change-password-dialog","note":"Component đầy đủ thể hiện cả hai nhánh đổi mật khẩu và thêm mật khẩu đầu tiên."},{"title":"Nếu cần, người dùng xác thực lại với Google","pseudo":"reauthenticate() → account.reauthenticateWithGoogle(identity, returnTo)","meta":"Frontend · dialog reauthenticate()","source":"change-password-dialog","note":"Sau response 204, trình duyệt mới được chuyển sang Google."},{"title":"Frontend ghi return path rồi mở OAuth","pseudo":"POST /api/account/google-reauthentication → googleAuthorizationUrl() → window.location.assign()","meta":"Frontend · accountApi password methods","source":"account-api-password","note":"Backend xác minh return path; frontend không tự đưa URL tùy ý."},{"title":"Backend lưu đường quay lại an toàn","pseudo":"currentActiveUser → chỉ chấp nhận route hồ sơ phù hợp vai trò → ghi vào HttpSession","meta":"Backend · startGoogleReauthentication()","source":"account-google-reauth","note":"Route không hợp lệ luôn rơi về /ho-so."},{"title":"Callback Google đánh dấu thời điểm xác thực","pseudo":"GoogleOidcSuccessHandler ghi AUTHENTICATED_AT và redirect về popup với googleReauthenticated=true","meta":"Backend · Google callback","source":"google-success-handler","note":"Dấu thời gian nằm trong session server, không tin query parameter một mình."},{"title":"Người dùng nhập mật khẩu mới và bấm Lưu","pseudo":"validatePasswordChange → account.changePassword(identity, input)","meta":"Frontend · ChangePasswordDialog.submit()","source":"change-password-dialog","note":"currentPassword chỉ được gửi khi thực sự bắt buộc."},{"title":"REST endpoint kiểm tra cửa sổ Google 5 phút","pseudo":"GoogleReauthentication.recent(session, now) → identityService.changePassword(..., boolean)","meta":"Backend · AccountResource.changePassword()","source":"account-change-password","note":"Controller chuyển kết quả kiểm tra server-side vào service."},{"title":"Service đổi/thêm password và đóng phiên khác","pseudo":"Kiểm current password hoặc Google recent → validate new password → encode → activate method → expireSessions(true)","meta":"Backend · IdentityService.changePassword()","source":"identity-change-password","note":"Session hiện tại được giữ; các session khác bị expire."}]}],"sources":{"register-page":{"file":"frontend/src/features/authentication/pages/RegisterPage.tsx","start":9,"end":71,"highlightStart":21,"highlightEnd":40,"scope":"Cả hàm component","symbol":"RegisterPage()","code":"export function RegisterPage({ client }: { client: AuthClient }) {\n  const navigate = useNavigate()\n  const [fullName, setFullName] = useState('')\n  const [email, setEmail] = useState('')\n  const [password, setPassword] = useState('')\n  const [confirmPassword, setConfirmPassword] = useState('')\n  const [termsAccepted, setTermsAccepted] = useState(false)\n  const [errors, setErrors] = useState\u003cReturnType\u003ctypeof validateRegistration>>({})\n  const [error, setError] = useState\u003cstring | null>(null)\n  const [duplicate, setDuplicate] = useState(false)\n  const [submitting, setSubmitting] = useState(false)\n\n  const submit = async (event: FormEvent\u003cHTMLFormElement>) => {\n    event.preventDefault()\n    setError(null)\n    setDuplicate(false)\n    const request: RegistrationRequest = { fullName: fullName.trim(), email: normalizeEmail(email), password, confirmPassword, termsAccepted }\n    const nextErrors = validateRegistration({ ...request })\n    setErrors(nextErrors)\n    if (Object.keys(nextErrors).length) return\n    if (!client.register) { setError('Dịch vụ đăng ký chưa được nối với máy chủ.'); return }\n    setSubmitting(true)\n    try {\n      await client.register(request)\n      navigate(AUTH_PATH.verification, {\n        replace: true,\n        state: { email: request.email, nextAllowedAt: new Date(Date.now() + 60_000).toISOString() },\n      })\n    } catch (reason) {\n      setError(friendlyAccountError(reason))\n      setDuplicate(typeof reason === 'object' && reason !== null && 'code' in reason && (reason as { code?: unknown }).code === 'MSG-FE01-10')\n    } finally { setSubmitting(false) }\n  }\n\n  return (\n    \u003cAuthShell\n      title=\"Tạo tài khoản chủ trại\"\n      description=\"Tạo tài khoản để bắt đầu đăng ký trang trại.\"\n      eyebrow=\"Đăng ký chủ trại\"\n      alert={error ? \u003cAlert>{error}{duplicate && \u003cspan className=\"mt-2 flex gap-4\">\u003cActionLink to={AUTH_PATH.signIn} state={{ email: normalizeEmail(email) }}>Đăng nhập\u003c/ActionLink>\u003cActionLink to={AUTH_PATH.forgot} state={{ email: normalizeEmail(email) }}>Quên mật khẩu\u003c/ActionLink>\u003c/span>}\u003c/Alert> : null}\n      footer={\u003c>Đã có tài khoản? \u003cActionLink to={AUTH_PATH.signIn}>Đăng nhập\u003c/ActionLink>\u003c/>}\n    >\n      \u003cdiv className=\"space-y-4\">\n        \u003cGoogleButton client={client} label=\"Đăng ký bằng Google\" />\n        \u003cDivider>hoặc dùng email\u003c/Divider>\n        \u003cForm onSubmit={submit}>\n          \u003cFormField id=\"register-name\" label=\"Họ và tên\" value={fullName} onChange={(event) => setFullName(event.target.value)} error={errors.fullName} placeholder=\"Tên chủ trại\" autoComplete=\"name\" maxLength={100} required />\n          \u003cFormField id=\"register-email\" label=\"Email\" type=\"email\" value={email} onChange={(event) => setEmail(event.target.value)} error={errors.email} placeholder=\"email@example.com\" autoComplete=\"email\" maxLength={254} required />\n          \u003cPasswordField id=\"register-password\" label=\"Mật khẩu\" value={password} onChange={setPassword} error={errors.password} placeholder=\"Tối thiểu 8 ký tự\" autoComplete=\"new-password\" />\n          \u003cPasswordField id=\"register-confirm-password\" label=\"Xác nhận mật khẩu\" value={confirmPassword} onChange={setConfirmPassword} error={errors.confirmPassword} placeholder=\"Nhập lại mật khẩu\" autoComplete=\"new-password\" />\n          \u003cdiv>\n            \u003clabel className=\"flex cursor-pointer items-start gap-2.5 text-[13px] leading-5 text-subtle\">\n              \u003cinput className=\"mt-0.5 size-5 shrink-0 accent-brand\" type=\"checkbox\" checked={termsAccepted} onChange={(event) => setTermsAccepted(event.target.checked)} />\n              \u003cspan>Tôi đồng ý với \u003ca href=\"/terms\" className=\"font-bold text-brand underline\">Điều khoản sử dụng\u003c/a> và \u003ca href=\"/data-policy\" className=\"font-bold text-brand underline\">Chính sách dữ liệu\u003c/a>.\u003c/span>\n            \u003c/label>\n            {errors.termsAccepted && \u003cspan className=\"mt-1 block text-xs text-[#b54843]\">{errors.termsAccepted}\u003c/span>}\n          \u003c/div>\n          \u003cbutton type=\"submit\" disabled={submitting} className={primaryButtonClass}>{submitting ? 'Đang tạo tài khoản…' : 'Tạo tài khoản'}\u003c/button>\n        \u003c/Form>\n      \u003c/div>\n    \u003c/AuthShell>\n  )\n}"},"auth-provider-init":{"file":"frontend/src/features/authentication/AuthContext.tsx","start":33,"end":94,"highlightStart":33,"highlightEnd":61,"scope":"Cả hàm component","symbol":"AuthProvider() · khởi tạo phiên","code":"export function AuthProvider({ client = defaultAuthClient, children }: { client?: AuthClient; children: ReactNode }) {\n  const auth = useAuthenticationUseCase(client)\n  const [status, setStatus] = useState\u003c'checking' | 'anonymous' | 'authenticated' | 'suspended'>('checking')\n  const [error, setError] = useState\u003cstring | null>(null)\n  const hasRouter = useInRouterContext()\n  const expireSession = useCallback(() => {\n    clearCurrentFarmId()\n    setError('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.')\n    setStatus('anonymous')\n  }, [])\n\n  useEffect(() => {\n    let active = true\n    setStatus('checking')\n    setError(null)\n    auth.isAuthenticated().then((ok) => {\n      if (active) setStatus(ok ? 'authenticated' : 'anonymous')\n    }).catch((reason: unknown) => {\n      if (active) {\n        if (reason instanceof BackendError && reason.code === 'MSG-FE01-03') {\n          setStatus('suspended')\n        } else {\n          setError('Không thể kiểm tra phiên đăng nhập với máy chủ. Hãy thử đăng nhập lại hoặc kiểm tra kết nối.')\n          setStatus('anonymous')\n        }\n      }\n    })\n    return () => { active = false }\n  }, [auth])\n\n  const value = useMemo\u003cAuthContextValue>(() => ({\n    authenticated: status === 'authenticated',\n    mode: client.mode ?? 'backend',\n    logout: async () => {\n      let logoutFailed = false\n      try {\n        await auth.logout()\n      } catch {\n        logoutFailed = true\n      }\n      clearCurrentFarmId()\n      setError(logoutFailed\n        ? 'Không thể xác nhận đăng xuất với máy chủ. Phiên trên thiết bị này đã được xóa; bạn có thể đăng nhập lại.'\n        : null)\n      notifySessionSignedOut()\n      setStatus('anonymous')\n    },\n  }), [auth, client, status])\n\n  if (status === 'checking') return \u003cdiv className=\"grid min-h-screen place-items-center text-sm text-subtle\">Đang kiểm tra phiên đăng nhập…\u003c/div>\n  return (\n    \u003cAuthContext.Provider value={value}>\n      {status === 'authenticated' && hasRouter && \u003cSessionRedirect onExpired={expireSession} />}\n      {status === 'authenticated' && hasRouter && \u003cInvitationResume />}\n      {status === 'authenticated'\n        ? children\n        : hasRouter\n          ? \u003cGuestAuthFlow client={client} initialError={error} forceSuspended={status === 'suspended'} onExitSuspended={() => { setError(null); setStatus('anonymous') }} onAuthenticated={() => setStatus('authenticated')} />\n          : \u003cLegacyLoginForm client={client} initialError={error} onSuccess={() => setStatus('authenticated')} />}\n    \u003c/AuthContext.Provider>\n  )\n}"},"auth-client-register":{"file":"frontend/src/features/authentication/client.ts","start":1,"end":27,"highlightStart":8,"highlightEnd":17,"scope":"Cả file","symbol":"client.ts","code":"import { createBackendClient } from '../../shared/api/backendClient'\nimport type { AuthClient, RegistrationRequest } from './types'\nimport { demo } from '../../demo/demoModules'\n\nexport function createBackendAuthClient(): AuthClient {\n  const api = createBackendClient({ baseUrl: import.meta.env.VITE_BEEFCARE_API_URL || '' })\n  return {\n    mode: 'backend',\n    isAuthenticated: api.isAuthenticated,\n    login: api.login,\n    logout: api.logout,\n    register: (request: RegistrationRequest) => api.request\u003cvoid>('/api/register', { method: 'POST', body: request }),\n    resendVerification: (email) => api.request\u003c{ nextAllowedAt: string }>('/api/account/verification/resend', { method: 'POST', body: { email } }),\n    requestPasswordReset: (email) => api.request\u003cvoid>('/api/account/reset-password/init', { method: 'POST', body: { email } }),\n    validatePasswordReset: (token) => api.get\u003c{ valid: boolean; email?: string }>(`/api/account/reset-password/validate?token=${encodeURIComponent(token)}`),\n    resetPassword: (token, newPassword, confirmPassword) => api.request\u003cvoid>('/api/account/reset-password/finish', {\n      method: 'POST', body: { key: token, newPassword, confirmPassword },\n    }),\n    getPublicLanding: () => api.get('/api/public/landing'),\n    getPublicPrices: () => api.get('/api/public/prices'),\n  }\n}\n\nconst authMode = (import.meta.env as ImportMetaEnv & { VITE_BEEFCARE_AUTH_MODE?: string }).VITE_BEEFCARE_AUTH_MODE\nexport const defaultAuthClient: AuthClient = authMode === 'mock'\n  ? demo.mockAuth.createMockAuthClient()\n  : createBackendAuthClient()"},"backend-client-request":{"file":"frontend/src/shared/api/backendClient.ts","start":55,"end":141,"highlightStart":79,"highlightEnd":103,"scope":"Cả hàm","symbol":"createBackendClient()","code":"export function createBackendClient({ baseUrl = '', fetchImpl = globalThis.fetch, newKey = () => globalThis.crypto.randomUUID(), onUnauthorized }: ClientOptions = {}) {\n  let csrfToken: string | undefined\n  let csrfHeader = 'X-XSRF-TOKEN'\n  const pathUrl = (path: string): string => {\n    if (!path.startsWith('/api/')) throw new TypeError('Use a relative /api/ path')\n    return `${baseUrl.replace(/\\/$/, '')}${path}`\n  }\n  async function responseBody(response: Response): Promise\u003cunknown> {\n    if (response.status === 204) return undefined\n    const contentType = response.headers.get('content-type') || ''\n    if (contentType.includes('json')) return response.json()\n    if (!response.ok) return { message: await response.text() }\n    return response.blob()\n  }\n  async function getCsrf(): Promise\u003cCsrfBody> {\n    const response = await fetchImpl(pathUrl('/api/csrf'), { credentials: 'include', headers: { Accept: 'application/json' } })\n    const body = await responseBody(response)\n    if (!response.ok) throw new BackendError(response.status, body)\n    const csrf = errorBody(body) as ErrorBody & Partial\u003cCsrfBody>\n    if (!csrf.token) throw new Error('Backend did not return a CSRF token')\n    csrfToken = csrf.token\n    csrfHeader = csrf.headerName || 'X-XSRF-TOKEN'\n    return { token: csrf.token, headerName: csrf.headerName }\n  }\n  async function request\u003cT = unknown>(path: string, { method = 'GET', body, key, signal, headers = {} }: RequestOptions = {}, retried = false): Promise\u003cT> {\n    if (path.startsWith(NO_FARM_PATH)) throw new NoActiveFarmError()\n    const changing = !['GET', 'HEAD', 'OPTIONS'].includes(method.toUpperCase())\n    if (changing && !csrfToken) await getCsrf()\n    const multipart = typeof FormData !== 'undefined' && body instanceof FormData\n    const actualHeaders: Record\u003cstring, string> = { Accept: 'application/json', ...headers }\n    if (body !== undefined && !multipart) actualHeaders['Content-Type'] = 'application/json'\n    if (changing && csrfToken) actualHeaders[csrfHeader] = csrfToken\n    if (key) actualHeaders['Idempotency-Key'] = key\n    const response = await fetchImpl(pathUrl(path), {\n      method, credentials: 'include', headers: actualHeaders,\n      body: body === undefined ? undefined : multipart ? body : JSON.stringify(body), signal,\n    })\n    const result = await responseBody(response)\n    if (response.status === 401) onUnauthorized?.()\n    // A 403 without a domain code is the CSRF filter: the token belongs to an earlier session (another client in the\n    // same tab signed out / in). Refresh it and resend once with the same Idempotency-Key; a domain 403 (MSG-COM-01) stays.\n    if (response.status === 403 && changing && !retried && !new BackendError(403, result).code) {\n      csrfToken = undefined\n      await getCsrf()\n      return request\u003cT>(path, { method, body, key, signal, headers }, true)\n    }\n    if (!response.ok) throw new BackendError(response.status, result)\n    return result as T\n  }\n  return {\n    request,\n    getCsrf,\n    newCommandKey: newKey,\n    async login(username: string, password: string, rememberMe = false) {\n      await getCsrf()\n      await request('/api/authenticate', { method: 'POST', body: { username, password, rememberMe } })\n      csrfToken = undefined\n      await getCsrf()\n    },\n    async logout() {\n      try {\n        await request('/api/logout', { method: 'POST' })\n      } catch (error) {\n        if (!(error instanceof BackendError && error.status === 401)) throw error\n      } finally {\n        csrfToken = undefined\n      }\n    },\n    async isAuthenticated() {\n      try {\n        await request('/api/authenticate')\n        return true\n      } catch (error) {\n        if (error instanceof BackendError && error.status === 401) return false\n        throw error\n      }\n    },\n    get: \u003cT = unknown>(path: string, options?: RequestOptions) => request\u003cT>(path, options),\n    // Keep this key for a retry after a timeout; generate a new key only for a new user action.\n    command: \u003cT = unknown>(path: string, body: unknown, { method = 'POST', key = newKey(), ...options }: RequestOptions = {}) => request\u003cT>(path, { ...options, method, body, key }),\n    farmPath: (farmId: string | number | null, suffix = '') => {\n      if (farmId == null) return `${NO_FARM_PATH}${suffix}`\n      if (!/^\\d+$/.test(String(farmId))) throw new TypeError('farmId must be the backend numeric ID')\n      return `/api/farms/${farmId}${suffix}`\n    },\n  }\n}"},"google-oauth-file":{"file":"frontend/src/features/authentication/googleOAuth.ts","start":1,"end":5,"highlightStart":1,"highlightEnd":5,"scope":"Cả file","symbol":"googleOAuth.ts","code":"/** Starts every Google flow at Spring Boot, including deployments where the frontend has a separate origin. */\nexport function googleAuthorizationUrl(): string {\n  const apiOrigin = (import.meta.env.VITE_BEEFCARE_API_URL || '').trim().replace(/\\/+$/, '')\n  return `${apiOrigin}/oauth2/authorization/google`\n}"},"account-usecase-file":{"file":"frontend/src/features/account/hooks/useAccountUseCase.ts","start":1,"end":17,"highlightStart":8,"highlightEnd":16,"scope":"Cả file","symbol":"useAccountUseCase.ts","code":"import { useMemo } from 'react'\nimport { accountApi } from '../api/accountApi'\n\n/**\n * Feature-owned command boundary for account pages and dialogs.  Components\n * own form state and validation; account API calls stay in this hook.\n */\nexport function useAccountUseCase() {\n  return useMemo(() => ({\n    samplePasswordHint: () => accountApi.samplePasswordHint(),\n    reauthenticateWithGoogle: (identity: Parameters\u003ctypeof accountApi.reauthenticateWithGoogle>[0], returnTo: string) => accountApi.reauthenticateWithGoogle(identity, returnTo),\n    changePassword: (identity: Parameters\u003ctypeof accountApi.changePassword>[0], input: Parameters\u003ctypeof accountApi.changePassword>[1]) => accountApi.changePassword(identity, input),\n    getProfile: (identity: Parameters\u003ctypeof accountApi.getProfile>[0]) => accountApi.getProfile(identity),\n    updateProfile: (identity: Parameters\u003ctypeof accountApi.updateProfile>[0], input: Parameters\u003ctypeof accountApi.updateProfile>[1]) => accountApi.updateProfile(identity, input),\n    getFarmPermissions: (identity: Parameters\u003ctypeof accountApi.getFarmPermissions>[0], farmId: number) => accountApi.getFarmPermissions(identity, farmId),\n  }), [])\n}"},"account-register":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/AccountResource.java","start":112,"end":118,"highlightStart":112,"highlightEnd":118,"scope":"Cả hàm","symbol":"registerAccount()","code":"    @PostMapping(\"/register\")\n    @ResponseStatus(HttpStatus.CREATED)\n    public RegistrationResponse registerAccount(@RequestBody RegistrationRequest request) {\n        return new RegistrationResponse(\n            identityService.register(request.fullName(), request.email(), request.password(), request.confirmPassword(), request.termsAccepted())\n        );\n    }"},"identity-register":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/IdentityService.java","start":74,"end":113,"highlightStart":74,"highlightEnd":113,"scope":"Cả hàm","symbol":"register()","code":"    @Transactional\n    public String register(String fullName, String email, String password, String confirmation, boolean termsAccepted) {\n        String normalizedEmail = normalizeEmail(email);\n        if (fullName == null || fullName.isBlank()) throw DomainException.required(\"fullName\");\n        if (fullName.trim().length() \u003c 2 || fullName.trim().length() > 100) throw DomainException.invalid(\"fullName\");\n        validatePassword(password, normalizedEmail, confirmation);\n        if (!termsAccepted) throw DomainException.badRequest(MessageCodes.FE01_14, \"field\", \"termsAccepted\");\n        if (userRepository.findOneByEmailIgnoreCase(normalizedEmail).isPresent() || appUserRepository.findOneByEmailIgnoreCase(normalizedEmail).isPresent()) {\n            throw DomainException.conflict(MessageCodes.FE01_10, \"email\", normalizedEmail);\n        }\n\n        User identity = new User();\n        identity.setLogin(normalizedEmail.length() \u003c= 50 ? normalizedEmail : \"email-\" + UUID.randomUUID().toString().replace(\"-\", \"\"));\n        identity.setEmail(normalizedEmail);\n        identity.setPassword(passwordEncoder.encode(password));\n        identity.setActivated(false);\n        identity.setLangKey(\"vi\");\n        identity.setFirstName(fullName.trim().substring(0, Math.min(50, fullName.trim().length())));\n        authorityRepository.findById(AuthoritiesConstants.USER).ifPresent(identity.getAuthorities()::add);\n        if (identity.getAuthorities().isEmpty()) throw new IllegalStateException(\"The standard user authority is not configured\");\n        try {\n            identity = userRepository.saveAndFlush(identity);\n\n            AppUser account = new AppUser();\n            account.setEmail(normalizedEmail);\n            account.setFullName(fullName.trim());\n            account.setAccountStatus(\"ACTIVE\");\n            account.setPasswordLoginEnabled(true);\n            Instant registeredAt = Instant.now();\n            account.setTermsAccepted(true);\n            account.setTermsAcceptedAt(registeredAt);\n            account.setPasswordMethodStatus(\"PENDING_VERIFICATION\");\n            account.setPasswordLinkedAt(registeredAt);\n            appUserRepository.saveAndFlush(account);\n        } catch (DataIntegrityViolationException duplicateIdentity) {\n            throw DomainException.conflict(MessageCodes.FE01_10, \"email\", normalizedEmail);\n        }\n        sendLink(identity, EMAIL_VERIFICATION, VERIFICATION_LIFETIME, \"VERIFY_EMAIL\");\n        return normalizedEmail;\n    }"},"account-activate":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/AccountResource.java","start":131,"end":154,"highlightStart":131,"highlightEnd":154,"scope":"Cả hàm","symbol":"activateAccount()","code":"    @GetMapping(\"/activate\")\n    public ResponseEntity\u003cVoid> activateAccount(@RequestParam(value = \"token\") String token, HttpServletRequest request, jakarta.servlet.http.HttpServletResponse response) {\n        User activated;\n        try {\n            activated = identityService.activateEmail(token);\n        } catch (DomainException invalid) {\n            if (!MessageCodes.FE01_06.equals(invalid.getCode())) throw invalid;\n            String destination = frontendBaseUrl.replaceAll(\"/+$\", \"\") + \"/lien-ket-khong-con-hieu-luc?type=verification\";\n            String email = identityService.verificationEmail(token).orElse(null);\n            if (email != null) destination += \"&email=\" + URLEncoder.encode(email, StandardCharsets.UTF_8);\n            return ResponseEntity.status(HttpStatus.SEE_OTHER).location(URI.create(destination)).build();\n        }\n        UserDetails details = userDetailsService.loadUserByUsername(activated.getEmail());\n        Authentication authentication = UsernamePasswordAuthenticationToken.authenticated(details, null, details.getAuthorities());\n        SecurityContext context = SecurityContextHolder.createEmptyContext();\n        context.setAuthentication(authentication);\n        SecurityContextHolder.setContext(context);\n        if (request.getSession(false) != null) request.changeSessionId();\n        HttpSession session = request.getSession(true);\n        session.setMaxInactiveInterval(sessionTimeoutSeconds);\n        contextRepository.saveContext(context, request, response);\n        sessionRegistry.registerNewSession(session.getId(), authentication.getName());\n        return ResponseEntity.status(HttpStatus.SEE_OTHER).location(URI.create(frontendBaseUrl.replaceAll(\"/+$\", \"\") + \"/owner-registration\")).build();\n    }"},"identity-activate":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/IdentityService.java","start":115,"end":128,"highlightStart":115,"highlightEnd":128,"scope":"Cả hàm","symbol":"activateEmail()","code":"    @Transactional\n    public User activateEmail(String token) {\n        AccountLinkToken link = consume(token, EMAIL_VERIFICATION);\n        User user = userRepository.findOneWithAuthoritiesByLogin(link.getUser().getLogin()).orElseThrow(IdentityService::invalidLink);\n        AppUser projection = appUserRepository.findOneByEmailIgnoreCase(user.getEmail()).orElseThrow(IdentityService::invalidLink);\n        if (!\"ACTIVE\".equalsIgnoreCase(projection.getAccountStatus())) throw suspended(user.getEmail());\n        if (user.isActivated()) return user;\n        user.setActivated(true);\n        user.setActivationKey(null);\n        user.setFailedPasswordAttempts(0);\n        user.setPasswordLockedUntil(null);\n        activatePasswordMethod(projection, Instant.now());\n        return user;\n    }"},"account-resend-verification":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/AccountResource.java","start":156,"end":178,"highlightStart":157,"highlightEnd":166,"scope":"Endpoint + DTO response","symbol":"resendEmailVerification()","code":"    /** Same answer for every address (GBR-03). The body is a JSON object: a bare JSON string would arrive with its quotes. */\n    @PostMapping(\"/account/verification/resend\")\n    public ResendVerificationResponse resendEmailVerification(@RequestBody EmailRequest request) {\n        return new ResendVerificationResponse(identityService.resendVerification(request.email()));\n    }\n\n    public record EmailRequest(String email) {}\n\n    public record ResendVerificationResponse(Instant nextAllowedAt) {}\n\n    /**\n     * {@code GET  /account} : get the current user.\n     *\n     * @return the current user.\n     * @throws RuntimeException {@code 500 (Internal Server Error)} if the user couldn't be returned.\n     */\n    @GetMapping(\"/account\")\n    public AdminUserDTO getAccount() {\n        return userService\n            .getUserWithAuthorities()\n            .map(AdminUserDTO::new)\n            .orElseThrow(() -> new AccountResourceException(\"User could not be found\"));\n    }"},"identity-resend-verification":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/IdentityService.java","start":130,"end":159,"highlightStart":131,"highlightEnd":149,"scope":"Hàm resend + đọc email token","symbol":"resendVerification()","code":"    @Transactional\n    public Instant resendVerification(String email) {\n        String normalizedEmail = normalizeEmail(email);\n        Instant now = Instant.now();\n        Optional\u003cUser> pending = findPasswordAccount(normalizedEmail, false).filter(user -> !user.isActivated());\n        if (pending.isEmpty()) return now.plusSeconds(60);\n        User user = pending.orElseThrow();\n        Optional\u003cAccountLinkToken> latest = tokenRepository.findFirstByUserIdAndTokenTypeOrderByCreatedAtDesc(user.getId(), EMAIL_VERIFICATION);\n        if (latest.isPresent() && latest.orElseThrow().getCreatedAt().plusSeconds(60).isAfter(now)) {\n            return latest.orElseThrow().getCreatedAt().plusSeconds(60);\n        }\n        Instant hourStart = now.minus(Duration.ofHours(1));\n        if (tokenRepository.countByUserIdAndTokenTypeAndCreatedAtAfter(user.getId(), EMAIL_VERIFICATION, hourStart) >= MAX_LINK_EMAILS_PER_HOUR) {\n            return tokenRepository\n                .findFirstByUserIdAndTokenTypeAndCreatedAtAfterOrderByCreatedAtAsc(user.getId(), EMAIL_VERIFICATION, hourStart)\n                .map(link -> link.getCreatedAt().plus(Duration.ofHours(1)))\n                .orElseGet(() -> now.plusSeconds(60));\n        }\n        sendLink(user, EMAIL_VERIFICATION, VERIFICATION_LIFETIME, \"VERIFY_EMAIL\");\n        return now.plusSeconds(60);\n    }\n\n    @Transactional(readOnly = true)\n    public Optional\u003cString> verificationEmail(String rawToken) {\n        if (rawToken == null || rawToken.isBlank()) return Optional.empty();\n        return tokenRepository\n            .findOneByTokenHashAndTokenType(linkSigner.hash(rawToken), EMAIL_VERIFICATION)\n            .map(AccountLinkToken::getUser)\n            .map(User::getEmail);\n    }"},"owner-registration-page":{"file":"frontend/src/features/farm-workspace/pages/OwnerRegistrationPage.tsx","start":7,"end":32,"highlightStart":7,"highlightEnd":27,"scope":"Cả hàm component","symbol":"OwnerRegistrationPage()","code":"export default function OwnerRegistrationPage() {\n  const { query, profile, form, set, errors, error, saving, email, submit } = useOwnerRegistration()\n  return (\n    \u003cSetupLayout\n      narrow step={1} eyebrow=\"Thiết lập trại\" heading=\"Mỗi trại một hồ sơ rõ ràng.\"\n      lines={['Thông tin, quyền truy cập và dịch vụ được quản lý riêng cho từng trại.']}\n    >\n      \u003cStepper current={1} />\n      {Boolean(query.error) && \u003cNote tone=\"err\">Không tải được hồ sơ tài khoản. Hãy thử tải lại trang.\u003c/Note>}\n      \u003cCard title=\"Hoàn tất hồ sơ chủ trại\">\n        \u003cform onSubmit={submit} className=\"flex flex-col gap-4\" noValidate>\n          {error && \u003cNote tone=\"err\">{error}\u003c/Note>}\n          \u003cField label=\"Thư điện tử đăng nhập\" id=\"owner-email\">\u003cinput id=\"owner-email\" readOnly value={email ? `${email} · ${profile?.emailVerified === false ? 'chưa xác minh' : `đã xác minh${profile?.googleSignInLinked ? ' qua Google' : ''}`}` : 'Đang tải…'} className={inputCls} />\u003c/Field>\n          \u003cField label=\"Họ và tên *\" id=\"owner-full-name\">\u003cinput id=\"owner-full-name\" autoComplete=\"name\" value={form.fullName} onChange={(event) => set('fullName', event.target.value)} className={inputCls} maxLength={100} />\u003cFieldError>{errors.fullName}\u003c/FieldError>\u003c/Field>\n          \u003cField label=\"Số điện thoại liên hệ\" id=\"owner-phone\">\u003cinput id=\"owner-phone\" type=\"tel\" autoComplete=\"tel\" value={form.phone} onChange={(event) => set('phone', event.target.value)} className={inputCls} />\u003cFieldError>{errors.phone}\u003c/FieldError>\u003c/Field>\n          {!query.data?.termsAccepted && !query.data?.ownerRegistrationCompleted && \u003cdiv>\n            \u003clabel className=\"flex items-center gap-2 text-[13px] text-ink\">\u003cinput type=\"checkbox\" className=\"size-4 accent-brand\" checked={form.termsAccepted} onChange={(event) => set('termsAccepted', event.target.checked)} />Tôi đồng ý với \u003ca href=\"/terms\" className=\"font-bold text-brand underline\">Điều khoản sử dụng\u003c/a> và \u003ca href=\"/data-policy\" className=\"font-bold text-brand underline\">Chính sách dữ liệu\u003c/a> của BeefCare\u003c/label>\n            \u003cFieldError>{errors.termsAccepted}\u003c/FieldError>\n          \u003c/div>}\n          \u003cdiv className=\"flex justify-end\">\u003cButton type=\"submit\" variant=\"primary\" size=\"lg\" disabled={saving || query.loading}>{saving ? 'Đang lưu…' : 'Hoàn tất và đăng ký trang trại'}\u003c/Button>\u003c/div>\n        \u003c/form>\n      \u003c/Card>\n      \u003cFoot>Thư điện tử đã xác minh được khóa; họ và tên và số điện thoại giúp nhận diện người chịu trách nhiệm.\u003c/Foot>\n    \u003c/SetupLayout>\n  )\n}"},"owner-registration-hook":{"file":"frontend/src/features/farm-workspace/hooks/useOwnerRegistration.ts","start":9,"end":16,"highlightStart":9,"highlightEnd":16,"scope":"Cả hook","symbol":"useOwnerRegistration()","code":"export function useOwnerRegistration() {\n  const navigate = useNavigate(); const session = useSession(); const { profile: query, completeOwnerRegistration } = useFarmWorkspaceUseCase({ loadProfile: true })\n  const [form, setForm] = useState\u003cCompleteOwnerProfileInput>({ fullName: '', phone: '', termsAccepted: false }); const [errors, setErrors] = useState\u003cFormErrors\u003cCompleteOwnerProfileInput>>({}); const [error, setError] = useState\u003cstring | null>(null); const [saving, setSaving] = useState(false)\n  useEffect(() => { if (query.data) setForm({ fullName: session?.fullName ?? query.data.fullName, phone: query.data.phone, termsAccepted: query.data.termsAccepted === true || query.data.ownerRegistrationCompleted }) }, [query.data, session?.fullName])\n  const set = \u003cK extends keyof CompleteOwnerProfileInput>(key: K, value: CompleteOwnerProfileInput[K]) => setForm(current => ({ ...current, [key]: value }))\n  const submit = async (event: React.FormEvent) => { event.preventDefault(); const next = validateOwnerProfile(form); setErrors(next); if (Object.keys(next).length) return; setSaving(true); setError(null); try { await completeOwnerRegistration(form); notifyOwnerRegistrationCompleted(); navigate('/dang-ky-trai', { replace: true }) } catch (reason) { setError(farmWorkspaceError(reason, 'Không thể lưu hồ sơ lúc này.')) } finally { setSaving(false) } }\n  return { session, query, profile: query.data, form, set, errors, error, saving, email: session?.email ?? query.data?.email, submit }\n}"},"owner-registration-api":{"file":"frontend/src/features/farm-workspace/api/farmWorkspaceApi.ts","start":162,"end":177,"highlightStart":169,"highlightEnd":177,"scope":"Cả hàm chứa adapter","symbol":"createFarmWorkspaceApi() · completeOwnerRegistration","code":"export function createFarmWorkspaceApi({ mode, transport, demoStore = lazyObject(() => demo.farmWorkspace.farmWorkspaceDemoStore) }: {\n  mode: BackendMode; farmId: string | number | null; transport: BackendTransport; demoStore?: FarmWorkspaceDemoStore\n}): FarmWorkspaceApi {\n  const path = (id: number, suffix: string) => transport.farmPath(id, suffix)\n  const command = (url: string, body: unknown, method: string) => transport.command(url, body, { method })\n  return {\n    getProfile: async () => mode === 'backend' ? profile(await transport.get('/api/account/profile')) : demoStore.getProfile(),\n    completeOwnerRegistration: async (input: CompleteOwnerProfileInput) => {\n      if (mode !== 'backend') return demoStore.completeOwnerRegistration(input)\n      const result = asRecord(await command('/api/account/owner-registration', {\n        fullName: input.fullName,\n        contactPhone: compactPhone(input.phone),\n        termsAccepted: input.termsAccepted,\n      }, 'POST'))\n      return profile({ ...result, ownerRegistrationCompleted: result.completed === true, farms: [] })\n    },"},"account-owner-complete":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/AccountResource.java","start":180,"end":204,"highlightStart":181,"highlightEnd":204,"scope":"Cả hàm","symbol":"completeOwnerRegistration()","code":"    /** Completes the personal Owner profile; it does not create a farm or grant farm/platform access. */\n    @PostMapping(\"/account/owner-registration\")\n    @Transactional\n    public OwnerRegistrationResponse completeOwnerRegistration(@RequestBody OwnerRegistrationRequest request) {\n        String name = fullName(request.fullName());\n        String phone = phone(request.contactPhone(), \"contactPhone\");\n        AppUser user = farmAccessService.currentActiveUser();\n        // SCR-07 only asks for consent when it was not already recorded during SCR-03.\n        if (!request.termsAccepted() && !user.isTermsAccepted()) {\n            throw DomainException.badRequest(MessageCodes.FE01_14, \"field\", \"termsAccepted\");\n        }\n        user.setFullName(name);\n        user.setPhone(phone);\n        Instant now = Instant.now();\n        if (!user.isTermsAccepted()) {\n            user.setTermsAccepted(true);\n            user.setTermsAcceptedAt(now);\n        }\n        if (!user.isOwnerRegistrationCompleted()) {\n            user.setOwnerRegistrationCompleted(true);\n            user.setOwnerRegistrationCompletedAt(now);\n        }\n        appUserRepository.save(user);\n        return new OwnerRegistrationResponse(user.getId(), user.getEmail(), user.getFullName(), user.getPhone(), true);\n    }"},"sign-in-page":{"file":"frontend/src/features/authentication/pages/SignInPage.tsx","start":11,"end":94,"highlightStart":25,"highlightEnd":45,"scope":"Cả hàm component","symbol":"SignInPage()","code":"export function SignInPage({ client, onAuthenticated, initialError, startFailed = false }: Props) {\n  const navigate = useNavigate()\n  const location = useLocation()\n  const [email, setEmail] = useState(emailFromState(location.state))\n  const [password, setPassword] = useState('')\n  const [remember, setRemember] = useState(false)\n  const [errors, setErrors] = useState\u003cReturnType\u003ctypeof validateSignIn>>({})\n  const googleSignInRejected = new URLSearchParams(location.search).get('error') === 'google-sign-in'\n  const [error, setError] = useState\u003cstring | null>(startFailed ? CREDENTIAL_MESSAGE : googleSignInRejected ? 'Không thể đăng nhập với Google. Vui lòng thử lại hoặc dùng email.' : initialError)\n  const [credentialFailed, setCredentialFailed] = useState(startFailed)\n  const [unverified, setUnverified] = useState(false)\n  const [submitting, setSubmitting] = useState(false)\n  const resetSuccess = new URLSearchParams(location.search).get('reset') === 'success'\n\n  const submit = async (event: FormEvent\u003cHTMLFormElement>) => {\n    event.preventDefault()\n    setError(null)\n    setCredentialFailed(false)\n    setUnverified(false)\n    const nextErrors = validateSignIn({ email, password })\n    setErrors(nextErrors)\n    if (Object.keys(nextErrors).length) return\n    setSubmitting(true)\n    try {\n      await client.login(normalizeEmail(email), password, remember)\n      onAuthenticated()\n      if (AUTH_PATHS.has(location.pathname)) navigate('/', { replace: true })\n    } catch (reason) {\n      const { code } = readError(reason)\n      setError(friendlyLoginError(reason))\n      setCredentialFailed(isCredentialError(reason))\n      setUnverified(code === 'MSG-FE01-11')\n      if (code === 'MSG-FE01-03') navigate(AUTH_PATH.suspended, { state: { email: normalizeEmail(email) } })\n    } finally { setSubmitting(false) }\n  }\n\n  const failed = credentialFailed && Boolean(error)\n  const alert = resetSuccess\n    ? \u003cAlert tone=\"success\">Mật khẩu đã được cập nhật. Bạn có thể đăng nhập bằng mật khẩu mới.\u003c/Alert>\n    : error && !failed\n      ? \u003cAlert>{error}{unverified && \u003cspan className=\"mt-2 block\">\u003cLink to={AUTH_PATH.verification} state={{ email: normalizeEmail(email) }} className=\"font-bold text-brand underline-offset-4 hover:underline\">Gửi lại email xác minh\u003c/Link>\u003c/span>}\u003c/Alert>\n      : null\n\n  return (\n    \u003cAuthShell\n      title={failed ? 'Đăng nhập chưa thành công' : 'Đăng nhập'}\n      description={failed ? 'Kiểm tra thông tin và thử lại. Mật khẩu phân biệt chữ hoa, chữ thường.' : 'Tiếp tục quản lý trại của bạn.'}\n      eyebrow={failed ? 'Thông tin chưa đúng' : 'Chào mừng trở lại'}\n      alert={alert}\n      footer={\u003cspan className=\"flex flex-col gap-4\">\u003cspan>Khôi phục mật khẩu chỉ áp dụng cho tài khoản đăng ký bằng email.\u003c/span>\u003cspan>Chưa có tài khoản?{' '}\u003cActionLink to={AUTH_PATH.register}>Đăng ký chủ trại\u003c/ActionLink>\u003c/span>\u003c/span>}\n    >\n      \u003cdiv className=\"space-y-4\">\n        \u003cGoogleButton client={client} label=\"Tiếp tục với Google\" />\n        {!failed && \u003cDivider>hoặc đăng nhập bằng email\u003c/Divider>}\n        \u003cForm onSubmit={submit}>\n          \u003cFormField id=\"signin-email\" label=\"Email\" type=\"email\" value={email} onChange={(event) => setEmail(event.target.value)} error={errors.email} placeholder=\"name@example.com\" autoComplete=\"username\" maxLength={254} required />\n          \u003cPasswordField id=\"signin-password\" label=\"Mật khẩu\" value={password} onChange={setPassword} error={errors.password} invalid={failed} placeholder=\"••••••••••\" autoComplete=\"current-password\" />\n          {failed && (\n            \u003cdiv role=\"alert\" className=\"rounded-xl bg-[#fff0ee] px-4 py-3\">\n              \u003cp className=\"m-0 text-[13px] font-bold text-[#b54843]\">{error}\u003c/p>\n              \u003cp className=\"m-0 mt-1 text-[11px] text-subtle\">Sau 5 lần sai liên tiếp, đăng nhập bị khóa 15 phút.\u003c/p>\n            \u003c/div>\n          )}\n          \u003cdiv className=\"flex items-center justify-between gap-4 text-xs\">\n            \u003clabel className=\"flex cursor-pointer items-center gap-2 text-subtle\">\u003cinput className=\"size-4 accent-brand\" type=\"checkbox\" checked={remember} onChange={(event) => setRemember(event.target.checked)} /> Ghi nhớ đăng nhập\u003c/label>\n            \u003cActionLink to={AUTH_PATH.forgot} state={email ? { email: normalizeEmail(email) } : undefined}>Quên mật khẩu?\u003c/ActionLink>\n          \u003c/div>\n          \u003cbutton type=\"submit\" disabled={submitting} className={primaryButtonClass}>{submitting ? 'Đang đăng nhập…' : failed ? 'Thử đăng nhập lại' : 'Đăng nhập'}\u003c/button>\n        \u003c/Form>\n        {Boolean(client.demoAccounts?.length) && (\n          \u003cdiv className=\"rounded-xl bg-[#eef4ef] p-3 text-xs text-subtle\">\n            \u003cp className=\"m-0 mb-2 font-bold text-ink\">Tài khoản mock theo vai trò\u003c/p>\n            \u003cdiv className=\"flex flex-wrap gap-1.5\">\n              {client.demoAccounts?.map((user) => (\n                \u003cbutton key={user.email} type=\"button\" title={user.email} onClick={() => { setEmail(user.email); setPassword(user.password) }} className=\"cursor-pointer rounded-md border border-field bg-white px-2 py-1 font-medium text-brand-dark\">{user.label}\u003c/button>\n              ))}\n            \u003c/div>\n            {client.demoErrorEmails && \u003cp className=\"m-0 mt-2 text-[11px]\">Xem khung lỗi: \u003ccode>{client.demoErrorEmails.wrongCredentials}\u003c/code> (sai thông tin), \u003ccode>{client.demoErrorEmails.suspended}\u003c/code> (tạm ngưng).\u003c/p>}\n          \u003c/div>\n        )}\n      \u003c/div>\n    \u003c/AuthShell>\n  )\n}"},"backend-client-login":{"file":"frontend/src/shared/api/backendClient.ts","start":55,"end":141,"highlightStart":108,"highlightEnd":113,"scope":"Cả hàm","symbol":"createBackendClient() · login","code":"export function createBackendClient({ baseUrl = '', fetchImpl = globalThis.fetch, newKey = () => globalThis.crypto.randomUUID(), onUnauthorized }: ClientOptions = {}) {\n  let csrfToken: string | undefined\n  let csrfHeader = 'X-XSRF-TOKEN'\n  const pathUrl = (path: string): string => {\n    if (!path.startsWith('/api/')) throw new TypeError('Use a relative /api/ path')\n    return `${baseUrl.replace(/\\/$/, '')}${path}`\n  }\n  async function responseBody(response: Response): Promise\u003cunknown> {\n    if (response.status === 204) return undefined\n    const contentType = response.headers.get('content-type') || ''\n    if (contentType.includes('json')) return response.json()\n    if (!response.ok) return { message: await response.text() }\n    return response.blob()\n  }\n  async function getCsrf(): Promise\u003cCsrfBody> {\n    const response = await fetchImpl(pathUrl('/api/csrf'), { credentials: 'include', headers: { Accept: 'application/json' } })\n    const body = await responseBody(response)\n    if (!response.ok) throw new BackendError(response.status, body)\n    const csrf = errorBody(body) as ErrorBody & Partial\u003cCsrfBody>\n    if (!csrf.token) throw new Error('Backend did not return a CSRF token')\n    csrfToken = csrf.token\n    csrfHeader = csrf.headerName || 'X-XSRF-TOKEN'\n    return { token: csrf.token, headerName: csrf.headerName }\n  }\n  async function request\u003cT = unknown>(path: string, { method = 'GET', body, key, signal, headers = {} }: RequestOptions = {}, retried = false): Promise\u003cT> {\n    if (path.startsWith(NO_FARM_PATH)) throw new NoActiveFarmError()\n    const changing = !['GET', 'HEAD', 'OPTIONS'].includes(method.toUpperCase())\n    if (changing && !csrfToken) await getCsrf()\n    const multipart = typeof FormData !== 'undefined' && body instanceof FormData\n    const actualHeaders: Record\u003cstring, string> = { Accept: 'application/json', ...headers }\n    if (body !== undefined && !multipart) actualHeaders['Content-Type'] = 'application/json'\n    if (changing && csrfToken) actualHeaders[csrfHeader] = csrfToken\n    if (key) actualHeaders['Idempotency-Key'] = key\n    const response = await fetchImpl(pathUrl(path), {\n      method, credentials: 'include', headers: actualHeaders,\n      body: body === undefined ? undefined : multipart ? body : JSON.stringify(body), signal,\n    })\n    const result = await responseBody(response)\n    if (response.status === 401) onUnauthorized?.()\n    // A 403 without a domain code is the CSRF filter: the token belongs to an earlier session (another client in the\n    // same tab signed out / in). Refresh it and resend once with the same Idempotency-Key; a domain 403 (MSG-COM-01) stays.\n    if (response.status === 403 && changing && !retried && !new BackendError(403, result).code) {\n      csrfToken = undefined\n      await getCsrf()\n      return request\u003cT>(path, { method, body, key, signal, headers }, true)\n    }\n    if (!response.ok) throw new BackendError(response.status, result)\n    return result as T\n  }\n  return {\n    request,\n    getCsrf,\n    newCommandKey: newKey,\n    async login(username: string, password: string, rememberMe = false) {\n      await getCsrf()\n      await request('/api/authenticate', { method: 'POST', body: { username, password, rememberMe } })\n      csrfToken = undefined\n      await getCsrf()\n    },\n    async logout() {\n      try {\n        await request('/api/logout', { method: 'POST' })\n      } catch (error) {\n        if (!(error instanceof BackendError && error.status === 401)) throw error\n      } finally {\n        csrfToken = undefined\n      }\n    },\n    async isAuthenticated() {\n      try {\n        await request('/api/authenticate')\n        return true\n      } catch (error) {\n        if (error instanceof BackendError && error.status === 401) return false\n        throw error\n      }\n    },\n    get: \u003cT = unknown>(path: string, options?: RequestOptions) => request\u003cT>(path, options),\n    // Keep this key for a retry after a timeout; generate a new key only for a new user action.\n    command: \u003cT = unknown>(path: string, body: unknown, { method = 'POST', key = newKey(), ...options }: RequestOptions = {}) => request\u003cT>(path, { ...options, method, body, key }),\n    farmPath: (farmId: string | number | null, suffix = '') => {\n      if (farmId == null) return `${NO_FARM_PATH}${suffix}`\n      if (!/^\\d+$/.test(String(farmId))) throw new TypeError('farmId must be the backend numeric ID')\n      return `/api/farms/${farmId}${suffix}`\n    },\n  }\n}"},"backend-client-auth-check":{"file":"frontend/src/shared/api/backendClient.ts","start":55,"end":141,"highlightStart":124,"highlightEnd":128,"scope":"Cả hàm","symbol":"createBackendClient() · isAuthenticated","code":"export function createBackendClient({ baseUrl = '', fetchImpl = globalThis.fetch, newKey = () => globalThis.crypto.randomUUID(), onUnauthorized }: ClientOptions = {}) {\n  let csrfToken: string | undefined\n  let csrfHeader = 'X-XSRF-TOKEN'\n  const pathUrl = (path: string): string => {\n    if (!path.startsWith('/api/')) throw new TypeError('Use a relative /api/ path')\n    return `${baseUrl.replace(/\\/$/, '')}${path}`\n  }\n  async function responseBody(response: Response): Promise\u003cunknown> {\n    if (response.status === 204) return undefined\n    const contentType = response.headers.get('content-type') || ''\n    if (contentType.includes('json')) return response.json()\n    if (!response.ok) return { message: await response.text() }\n    return response.blob()\n  }\n  async function getCsrf(): Promise\u003cCsrfBody> {\n    const response = await fetchImpl(pathUrl('/api/csrf'), { credentials: 'include', headers: { Accept: 'application/json' } })\n    const body = await responseBody(response)\n    if (!response.ok) throw new BackendError(response.status, body)\n    const csrf = errorBody(body) as ErrorBody & Partial\u003cCsrfBody>\n    if (!csrf.token) throw new Error('Backend did not return a CSRF token')\n    csrfToken = csrf.token\n    csrfHeader = csrf.headerName || 'X-XSRF-TOKEN'\n    return { token: csrf.token, headerName: csrf.headerName }\n  }\n  async function request\u003cT = unknown>(path: string, { method = 'GET', body, key, signal, headers = {} }: RequestOptions = {}, retried = false): Promise\u003cT> {\n    if (path.startsWith(NO_FARM_PATH)) throw new NoActiveFarmError()\n    const changing = !['GET', 'HEAD', 'OPTIONS'].includes(method.toUpperCase())\n    if (changing && !csrfToken) await getCsrf()\n    const multipart = typeof FormData !== 'undefined' && body instanceof FormData\n    const actualHeaders: Record\u003cstring, string> = { Accept: 'application/json', ...headers }\n    if (body !== undefined && !multipart) actualHeaders['Content-Type'] = 'application/json'\n    if (changing && csrfToken) actualHeaders[csrfHeader] = csrfToken\n    if (key) actualHeaders['Idempotency-Key'] = key\n    const response = await fetchImpl(pathUrl(path), {\n      method, credentials: 'include', headers: actualHeaders,\n      body: body === undefined ? undefined : multipart ? body : JSON.stringify(body), signal,\n    })\n    const result = await responseBody(response)\n    if (response.status === 401) onUnauthorized?.()\n    // A 403 without a domain code is the CSRF filter: the token belongs to an earlier session (another client in the\n    // same tab signed out / in). Refresh it and resend once with the same Idempotency-Key; a domain 403 (MSG-COM-01) stays.\n    if (response.status === 403 && changing && !retried && !new BackendError(403, result).code) {\n      csrfToken = undefined\n      await getCsrf()\n      return request\u003cT>(path, { method, body, key, signal, headers }, true)\n    }\n    if (!response.ok) throw new BackendError(response.status, result)\n    return result as T\n  }\n  return {\n    request,\n    getCsrf,\n    newCommandKey: newKey,\n    async login(username: string, password: string, rememberMe = false) {\n      await getCsrf()\n      await request('/api/authenticate', { method: 'POST', body: { username, password, rememberMe } })\n      csrfToken = undefined\n      await getCsrf()\n    },\n    async logout() {\n      try {\n        await request('/api/logout', { method: 'POST' })\n      } catch (error) {\n        if (!(error instanceof BackendError && error.status === 401)) throw error\n      } finally {\n        csrfToken = undefined\n      }\n    },\n    async isAuthenticated() {\n      try {\n        await request('/api/authenticate')\n        return true\n      } catch (error) {\n        if (error instanceof BackendError && error.status === 401) return false\n        throw error\n      }\n    },\n    get: \u003cT = unknown>(path: string, options?: RequestOptions) => request\u003cT>(path, options),\n    // Keep this key for a retry after a timeout; generate a new key only for a new user action.\n    command: \u003cT = unknown>(path: string, body: unknown, { method = 'POST', key = newKey(), ...options }: RequestOptions = {}) => request\u003cT>(path, { ...options, method, body, key }),\n    farmPath: (farmId: string | number | null, suffix = '') => {\n      if (farmId == null) return `${NO_FARM_PATH}${suffix}`\n      if (!/^\\d+$/.test(String(farmId))) throw new TypeError('farmId must be the backend numeric ID')\n      return `/api/farms/${farmId}${suffix}`\n    },\n  }\n}"},"authenticate-controller":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/AuthenticateController.java","start":35,"end":128,"highlightStart":72,"highlightEnd":122,"scope":"Cả class controller","symbol":"AuthenticateController","code":"\n    private final AuthenticationManager authenticationManager;\n    private final FarmAccessService farmAccessService;\n    private final SessionRegistry sessionRegistry;\n    private final IdentityService identityService;\n    private final HttpSessionSecurityContextRepository contextRepository = new HttpSessionSecurityContextRepository();\n\n    @Value(\"${beefcare.security.session.timeout-seconds:28800}\")\n    private int standardTimeoutSeconds;\n\n    @Value(\"${beefcare.security.session.remember-me-timeout-seconds:2592000}\")\n    private int rememberMeTimeoutSeconds;\n\n    @Value(\"${beefcare.security.cookie-secure:false}\")\n    private boolean secureCookies;\n\n    @Value(\"${beefcare.security.cookie-same-site:Lax}\")\n    private String cookieSameSite;\n\n    public AuthenticateController(\n        AuthenticationManager authenticationManager,\n        FarmAccessService farmAccessService,\n        SessionRegistry sessionRegistry,\n        IdentityService identityService\n    ) {\n        this.authenticationManager = authenticationManager;\n        this.farmAccessService = farmAccessService;\n        this.sessionRegistry = sessionRegistry;\n        this.identityService = identityService;\n    }\n\n    /** Fetch this before login; send the returned value in X-XSRF-TOKEN and retain the XSRF-TOKEN cookie. */\n    @GetMapping(\"/api/csrf\")\n    public CsrfToken csrf(CsrfToken token) {\n        return token;\n    }\n\n    @PostMapping(\"/api/authenticate\")\n    public ResponseEntity\u003cVoid> authorize(@Valid @RequestBody LoginVM loginVM, HttpServletRequest request, HttpServletResponse response) {\n        identityService.checkPasswordSignInAllowed(loginVM.getUsername()); // suspended 403 MSG-FE01-03, locked 423 MSG-FE01-02\n        Authentication authentication;\n        try {\n            authentication = authenticationManager.authenticate(\n                UsernamePasswordAuthenticationToken.unauthenticated(loginVM.getUsername(), loginVM.getPassword())\n            );\n        } catch (AuthenticationException ex) {\n            // DaoAuthenticationProvider wraps a UserDetailsService failure in InternalAuthenticationServiceException, so look at the cause too.\n            if (ex instanceof vn.edu.fpt.beefcare.security.UserNotActivatedException || ex.getCause() instanceof vn.edu.fpt.beefcare.security.UserNotActivatedException) {\n                throw new DomainException(MessageCodes.FE01_11, DomainException.params(\"email\", loginVM.getUsername().trim()), HttpStatus.UNAUTHORIZED);\n            }\n            java.util.Optional\u003cjava.time.Instant> lockedUntil = identityService.recordFailedPasswordAttempt(loginVM.getUsername());\n            if (lockedUntil.isPresent()) throw IdentityService.locked(lockedUntil.orElseThrow());\n            throw new DomainException(MessageCodes.FE01_01, null, HttpStatus.UNAUTHORIZED);\n        }\n        identityService.clearFailedPasswordAttempts(loginVM.getUsername());\n\n        SecurityContext context = SecurityContextHolder.createEmptyContext();\n        context.setAuthentication(authentication);\n        SecurityContextHolder.setContext(context);\n        if (request.getSession(false) != null) {\n            request.changeSessionId();\n        }\n        HttpSession session = request.getSession(true);\n        session.setMaxInactiveInterval(loginVM.isRememberMe() ? rememberMeTimeoutSeconds : standardTimeoutSeconds);\n        try {\n            farmAccessService.currentActiveUser();\n        } catch (DomainException ex) {\n            SecurityContextHolder.clearContext();\n            session.invalidate();\n            return ResponseEntity.status(ex.getStatus()).build();\n        }\n        contextRepository.saveContext(context, request, response);\n        sessionRegistry.registerNewSession(session.getId(), authentication.getName());\n        if (loginVM.isRememberMe()) {\n            response.addHeader(\n                HttpHeaders.SET_COOKIE,\n                ResponseCookie.from(\"JSESSIONID\", session.getId())\n                    .httpOnly(true)\n                    .secure(secureCookies)\n                    .sameSite(cookieSameSite)\n                    .path(\"/\")\n                    .maxAge(rememberMeTimeoutSeconds)\n                    .build()\n                    .toString()\n            );\n        }\n        return ResponseEntity.noContent().build();\n    }\n\n    @GetMapping(\"/api/authenticate\")\n    public ResponseEntity\u003cVoid> isAuthenticated(Principal principal) {\n        return principal == null ? ResponseEntity.status(HttpStatus.UNAUTHORIZED).build() : ResponseEntity.noContent().build();\n    }\n}"},"authenticate-check":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/web/rest/AuthenticateController.java","start":124,"end":127,"highlightStart":124,"highlightEnd":127,"scope":"Cả hàm","symbol":"isAuthenticated()","code":"    @GetMapping(\"/api/authenticate\")\n    public ResponseEntity\u003cVoid> isAuthenticated(Principal principal) {\n        return principal == null ? ResponseEntity.status(HttpStatus.UNAUTHORIZED).build() : ResponseEntity.noContent().build();\n    }"},"identity-signin-policy":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/IdentityService.java","start":251,"end":269,"highlightStart":251,"highlightEnd":269,"scope":"Cả hàm","symbol":"checkPasswordSignInAllowed()","code":"    @Transactional\n    public User checkPasswordSignInAllowed(String login) {\n        Optional\u003cUser> found = userRepository.findOneByEmailIgnoreCase(login.trim()).or(() -> userRepository.findOneByLogin(login.trim().toLowerCase(Locale.ROOT)));\n        if (found.isEmpty()) return null;\n        User user = found.get();\n        AppUser account = appUserRepository.findOneByEmailIgnoreCase(user.getEmail()).orElse(null);\n        if (account != null && \"SUSPENDED\".equalsIgnoreCase(account.getAccountStatus())) throw suspended(user.getEmail());\n        // A Google-only account has no password method: answered exactly like a wrong credential (MSG-FE01-01, 401) so the\n        // answer does not reveal that the address has an account (UC-FE01-02 E1).\n        if (account != null && !account.isPasswordLoginEnabled()) throw new DomainException(MessageCodes.FE01_01, null, HttpStatus.UNAUTHORIZED);\n        if (user.getPasswordLockedUntil() != null && user.getPasswordLockedUntil().isAfter(Instant.now())) {\n            throw locked(user.getPasswordLockedUntil());\n        }\n        if (user.getPasswordLockedUntil() != null) {\n            user.setPasswordLockedUntil(null);\n            user.setFailedPasswordAttempts(0);\n        }\n        return user;\n    }"},"identity-failed-attempt":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/IdentityService.java","start":271,"end":294,"highlightStart":271,"highlightEnd":294,"scope":"Hai hàm trọn vẹn","symbol":"recordFailedPasswordAttempt() + clearFailedPasswordAttempts()","code":"    @Transactional\n    public Optional\u003cInstant> recordFailedPasswordAttempt(String login) {\n        User user = findLogin(login).orElse(null);\n        if (user == null || !user.isActivated()) return Optional.empty();\n        int attempts = user.getFailedPasswordAttempts() + 1;\n        if (attempts >= 5) {\n            user.setFailedPasswordAttempts(5);\n            Instant lockedUntil = Instant.now().plus(PASSWORD_LOCK);\n            user.setPasswordLockedUntil(lockedUntil);\n            return Optional.of(lockedUntil);\n        } else {\n            user.setFailedPasswordAttempts(attempts);\n            return Optional.empty();\n        }\n    }\n\n    @Transactional\n    public void clearFailedPasswordAttempts(String login) {\n        findLogin(login).ifPresent(user -> {\n            user.setFailedPasswordAttempts(0);\n            user.setPasswordLockedUntil(null);\n            appUserRepository.findOneByEmailIgnoreCase(user.getEmail()).ifPresent(account -> account.setPasswordLastUsedAt(Instant.now()));\n        });\n    }"},"google-button":{"file":"frontend/src/features/authentication/components/AuthControls.tsx","start":27,"end":31,"highlightStart":27,"highlightEnd":31,"scope":"Cả hàm component","symbol":"GoogleButton()","code":"export function GoogleButton({ client, label }: { client: AuthClient; label: string }) {\n  const glyph = \u003cspan aria-hidden=\"true\" className=\"absolute left-5 text-xl font-bold\">G\u003c/span>\n  if (client.mode === 'mock') return \u003cbutton type=\"button\" disabled className={googleButtonClass} title=\"Google OAuth chỉ khả dụng khi nối máy chủ\">{glyph}{label}\u003c/button>\n  return \u003ca href={googleAuthorizationUrl()} className={`${googleButtonClass} no-underline`}>{glyph}{label}\u003c/a>\n}"},"google-identity":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/service/GoogleIdentityService.java","start":37,"end":88,"highlightStart":37,"highlightEnd":88,"scope":"Cả hàm","symbol":"provisionOrLink()","code":"    @Transactional\n    public Result provisionOrLink(OidcUser google) {\n        String subject = google.getSubject();\n        String email = normalizeEmail(google.getClaimAsString(\"email\"));\n        if (subject == null || subject.isBlank() || !Boolean.TRUE.equals(google.getClaim(\"email_verified\"))) throw denied(\"missing-subject-or-unverified-email\");\n\n        Optional\u003cAppUser> bySubject = appUsers.findOneByGoogleSubject(subject);\n        if (bySubject.isPresent() && !email.equals(bySubject.orElseThrow().getEmail())) throw denied(\"subject-email-mismatch\");\n        AppUser account = bySubject.or(() -> appUsers.findOneByEmailIgnoreCase(email)).orElse(null);\n        if (account != null && \"SUSPENDED\".equalsIgnoreCase(account.getAccountStatus())) {\n            throw DomainException.forbidden(MessageCodes.FE01_03, \"email\", account.getEmail());\n        }\n        if (account != null && !\"ACTIVE\".equalsIgnoreCase(account.getAccountStatus())) throw denied(\"inactive-account\");\n        if (account != null && account.getGoogleSubject() != null && !account.getGoogleSubject().equals(subject)) throw denied(\"conflicting-google-subject\");\n\n        User identity = identities.findOneByEmailIgnoreCase(email).orElse(null);\n\n        String displayName = safeDisplayName(google, email);\n        if (account == null) {\n            account = new AppUser();\n            account.setEmail(email);\n            account.setAccountStatus(\"ACTIVE\");\n            account.setPasswordLoginEnabled(false);\n            account.setFullName(displayName);\n        }\n        Instant signedInAt = Instant.now();\n        account.setGoogleSubject(subject);\n        if (account.getGoogleLinkedAt() == null) account.setGoogleLinkedAt(signedInAt);\n        account.setGoogleLastUsedAt(signedInAt);\n        if (account.getFullName() == null || account.getFullName().isBlank()) account.setFullName(displayName);\n        appUsers.saveAndFlush(account);\n\n        if (identity == null) {\n            identity = new User();\n            identity.setLogin(email.length() \u003c= 50 ? email : \"google-\" + UUID.randomUUID().toString().replace(\"-\", \"\"));\n            // Google-only identities have no usable local password; an unpredictable discarded secret satisfies legacy schema.\n            identity.setPassword(passwordEncoder.encode(UUID.randomUUID() + UUID.randomUUID().toString()));\n            identity.setEmail(email);\n            identity.setLangKey(\"vi\");\n            identity.setActivated(true);\n            identity.setFirstName(firstName(displayName));\n            identity.setLastName(lastName(displayName));\n            Authority userAuthority = authorities.findById(AuthoritiesConstants.USER).orElseThrow(() -> new IllegalStateException(\"ROLE_USER is not configured\"));\n            identity.getAuthorities().add(userAuthority);\n        } else {\n            identity.setActivated(true); // Google's verified claim is sufficient to verify an existing email identity.\n            identity.setActivationKey(null);\n            if ((identity.getFirstName() == null || identity.getFirstName().isBlank()) && !displayName.isBlank()) identity.setFirstName(firstName(displayName));\n        }\n        identities.saveAndFlush(identity);\n        return new Result(identity, account.isOwnerRegistrationCompleted());\n    }"},"google-success-handler":{"file":"backend/src/main/java/vn/edu/fpt/beefcare/security/GoogleOidcSuccessHandler.java","start":30,"end":100,"highlightStart":57,"highlightEnd":79,"scope":"Cả class","symbol":"GoogleOidcSuccessHandler","code":"/** Converts a verified OIDC identity into BeefCare's current server-side session principal. */\n@Component\npublic class GoogleOidcSuccessHandler implements AuthenticationSuccessHandler {\n\n    private static final Logger LOG = LoggerFactory.getLogger(GoogleOidcSuccessHandler.class);\n    private final GoogleIdentityService identities;\n    private final UserDetailsService userDetailsService;\n    private final SessionRegistry sessions;\n    private final HttpSessionSecurityContextRepository contextRepository = new HttpSessionSecurityContextRepository();\n    private final String frontendBaseUrl;\n\n    @Value(\"${beefcare.security.session.timeout-seconds:28800}\")\n    private int sessionTimeoutSeconds;\n\n    public GoogleOidcSuccessHandler(\n        GoogleIdentityService identities,\n        UserDetailsService userDetailsService,\n        SessionRegistry sessions,\n        @Value(\"${beefcare.email.frontend-base-url}\") String frontendBaseUrl\n    ) {\n        this.identities = identities;\n        this.userDetailsService = userDetailsService;\n        this.sessions = sessions;\n        this.frontendBaseUrl = frontendBaseUrl.replaceAll(\"/+$\", \"\");\n    }\n\n    @Override\n    public void onAuthenticationSuccess(HttpServletRequest request, HttpServletResponse response, Authentication source) throws IOException, ServletException {\n        try {\n            if (!(source instanceof OAuth2AuthenticationToken token) || !(token.getPrincipal() instanceof OidcUser google)) {\n                throw new IllegalStateException(\"Expected an OpenID Connect identity\");\n            }\n            GoogleIdentityService.Result linked = identities.provisionOrLink(google);\n            UserDetails details = userDetailsService.loadUserByUsername(linked.user().getEmail());\n            Authentication beefCareAuthentication = UsernamePasswordAuthenticationToken.authenticated(details, null, details.getAuthorities());\n            SecurityContext context = SecurityContextHolder.createEmptyContext();\n            context.setAuthentication(beefCareAuthentication);\n            SecurityContextHolder.setContext(context);\n            if (request.getSession(false) != null) request.changeSessionId();\n            HttpSession session = request.getSession(true);\n            session.setMaxInactiveInterval(sessionTimeoutSeconds);\n            contextRepository.saveContext(context, request, response);\n            sessions.registerNewSession(session.getId(), beefCareAuthentication.getName());\n            session.setAttribute(GoogleReauthentication.AUTHENTICATED_AT, java.time.Instant.now());\n            Object requestedReturnPath = session.getAttribute(GoogleReauthentication.RETURN_TO_PROFILE_PATH);\n            session.removeAttribute(GoogleReauthentication.RETURN_TO_PROFILE_PATH);\n            String destination = requestedReturnPath instanceof String returnPath\n                ? returnPath + \"?m=doi-mat-khau&googleReauthenticated=true\"\n                : linked.ownerRegistrationCompleted() ? \"/chon-trai\" : \"/owner-registration\";\n            response.sendRedirect(frontendBaseUrl + destination);\n        } catch (DomainException failure) {\n            SecurityContextHolder.clearContext();\n            if (MessageCodes.FE01_03.equals(failure.getCode())) {\n                String email = String.valueOf(failure.getParams().getOrDefault(\"email\", \"\"));\n                String destination = \"/tai-khoan-tam-ngung\";\n                if (!email.isBlank()) destination += \"?email=\" + URLEncoder.encode(email, StandardCharsets.UTF_8);\n                response.sendRedirect(frontendBaseUrl + destination);\n                return;\n            }\n            LOG.warn(\"Google sign-in was rejected [{}]\", failure.getCode());\n            response.sendRedirect(frontendBaseUrl + \"/sign-in?error=google-sign-in\");\n        } catch (RuntimeException failure) {\n            SecurityContextHolder.clearContext();\n            String reason = failure instanceof OAuth2AuthenticationException oauthFailure\n                ? oauthFailure.getError().getDescription()\n

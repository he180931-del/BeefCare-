function esc(s){return String(s).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}
function nodes(s){return s.split(' → ').map((x,i)=>'<span class="node"><b>'+esc(x.split(' → ')[0])+'</b>'+esc(x.includes(' → ')?x.slice(x.indexOf(' → ')+3):'')+'</span>').join('<span class="arrow">→</span>')}
function render(){let f=document.querySelector('.active').dataset.f,q=document.querySelector('#q').value.toLowerCase(),out='';A.forEach(([key,title,spec,ucs])=>{if(f!=='all'&&f!==key)return;let rows=ucs.filter(x=>(x.id+x.title+x.fe+x.be+x.files).toLowerCase().includes(q));if(!rows.length)return;out+='<section class="feature"><h2>'+title+'<small>'+spec+'</small></h2>';rows.forEach(x=>{out+='<article class="uc"><div class="uchead"><h3>'+x.id+' · '+x.title+'</h3></div><div class="models">'+box('Frontend · hàm, route, state','fe',x.fe,x)+' '+box('Backend · resource, service, persistence','be',x.be,x)+'</div>'+(x.note?'<div class="notes"><b>CHÊNH LỆCH / LƯU Ý:</b> '+esc(x.note)+'</div>':'')+'</article>'});out+='</section>'});document.querySelector('#app').innerHTML=out||'<p>Không có kết quả.</p>'}
function box(h,k,flow,x){return '<div class="model '+k+'"><h4>'+h+'</h4><div class="flow">'+nodes(flow)+'</div><div class="branches"><div class="branch ok"><b>SUCCESS</b><br>'+esc(x.ok)+'</div><div class="branch"><b>ERROR / GUARD</b><br>'+esc(x.err)+'</div></div><div class="meta"><div><b>Route / endpoint</b><code>'+esc(x.route)+'</code></div><div><b>File mapping</b><code>'+esc(k==='fe'?x.files.split(' | ')[0]:x.files.split(' | ')[1])+'</code></div></div></div>'}
document.querySelectorAll('.toolbar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.toolbar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});document.querySelector('#q').oninput=render;render();
